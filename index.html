                                                        ${msg.feedback.usedTargetWell ? "✓ Đã dùng đúng cụm từ chỉ định!" : "💡 Gợi ý lồng ghép cụm từ chỉ định"}
                                                    </span>
                                                </div>

                                                <!-- Corrected Sentence -->
                                                <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 space-y-1.5">
                                                    <div class="flex items-center justify-between">
                                                        <span class="text-xs font-extrabold text-slate-700">1. Chỉnh sửa câu tự nhiên hơn:</span>
                                                        <button type="button" onclick="app.speakEnglish('${this.escapeJs(msg.feedback.correctedSentence)}')"
                                                            class="px-2.5 py-1 rounded-xl bg-white border border-slate-200 text-slate-700 text-[11px] font-bold">
                                                            🔊 Nghe câu sửa
                                                        </button>
                                                    </div>
                                                    <p class="text-xs sm:text-sm font-bold text-slate-900">"${this.escapeHtml(msg.feedback.correctedSentence)}"</p>
                                                    <p class="text-xs text-slate-600">${this.escapeHtml(msg.feedback.correctionExplanationVi)}</p>
                                                </div>

                                                <!-- Band 6.5 - 7.5+ Upgrade -->
                                                <div class="p-4 rounded-2xl bg-gradient-to-br from-pinky-50 to-purple-50 border border-pinky-200 space-y-1.5">
                                                    <div class="flex items-center justify-between">
                                                        <span class="text-xs font-extrabold text-pinky-700">2. Gợi ý nâng cấp chuẩn IELTS Band 6.5 - 7.5+:</span>
                                                        <button type="button" onclick="app.speakEnglish('${this.escapeJs(msg.feedback.bandUpgradeSentence)}')"
                                                            class="px-2.5 py-1 rounded-xl bg-pinky-600 text-white text-[11px] font-bold">
                                                            🔊 Nghe mẫu Band 7.0+
                                                        </button>
                                                    </div>
                                                    <p class="text-xs sm:text-sm font-extrabold text-pinky-950">"${this.escapeHtml(msg.feedback.bandUpgradeSentence)}"</p>
                                                    <p class="text-xs text-slate-700">${this.escapeHtml(msg.feedback.bandUpgradeExplanationVi)}</p>
                                                </div>
                                            </div>
                                        ` : ""}

                                        <!-- AI Question Bubble -->
                                        <div class="bg-white rounded-3xl rounded-tl-md border border-pinky-200 p-5 shadow-xs space-y-2">
                                            <div class="flex items-center justify-between">
                                                <span class="text-xs font-extrabold text-pinky-600">🤖 AI Examiner hỏi:</span>
                                                <button type="button" onclick="app.speakEnglish('${this.escapeJs(msg.questionEn)}')"
                                                    class="px-2.5 py-1 rounded-xl bg-pinky-50 text-pinky-700 text-xs font-bold">
                                                    🔊 Nghe câu hỏi
                                                </button>
                                            </div>
                                            <p class="font-display font-bold text-sm sm:text-base text-slate-900">${this.escapeHtml(msg.questionEn)}</p>
                                            ${msg.questionVi ? `<p class="text-xs text-slate-500">${this.escapeHtml(msg.questionVi)}</p>` : ""}
                                        </div>
                                    </div>
                                `;
                            }).join("")}
                        </div>

                        <!-- Continuous Manual-Stop Recording & Text Input Box -->
                        <div class="bg-white rounded-3xl border border-pinky-200 p-4 sm:p-5 shadow-sm space-y-3">
                            ${this.isRecording ? `
                                <div class="flex items-center justify-between px-4 py-2.5 rounded-2xl bg-rose-50 border border-rose-200">
                                    <div class="flex items-center gap-3">
                                        <span class="relative flex h-3 w-3">
                                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                                            <span class="relative inline-flex rounded-full h-3 w-3 bg-rose-600"></span>
                                        </span>
                                        <span class="text-xs font-extrabold text-rose-700">Đang ghi âm liên tục (Chỉ dừng khi bạn bấm Dừng)</span>
                                        <div class="flex items-end gap-0.5 h-5">
                                            <span class="wave-bar w-1 bg-rose-500 rounded-full" style="animation-delay:0s"></span>
                                            <span class="wave-bar w-1 bg-rose-500 rounded-full" style="animation-delay:0.2s"></span>
                                            <span class="wave-bar w-1 bg-rose-500 rounded-full" style="animation-delay:0.4s"></span>
                                        </div>
                                    </div>
                                    <span id="recording-timer-text" class="font-mono text-xs font-extrabold text-rose-700">${this.formatSeconds(this.recordingSeconds)}</span>
                                </div>
                            ` : ""}

                            <textarea id="speaking-user-input" rows="3"
                                placeholder="Bấm nút Bắt đầu nói (hoặc gõ trực tiếp câu trả lời tiếng Anh của bạn tại đây)..."
                                class="w-full p-3.5 rounded-2xl border border-pinky-200 focus:border-pinky-500 text-xs sm:text-sm outline-hidden"></textarea>

                            <div class="flex flex-wrap items-center justify-between gap-2">
                                <button type="button" onclick="app.toggleRecording()"
                                    class="px-5 py-3 rounded-2xl ${this.isRecording ? 'bg-rose-600 hover:bg-rose-700 text-white mic-pulse' : 'bg-pinky-100 hover:bg-pinky-200 text-pinky-800'} font-bold text-xs sm:text-sm flex items-center gap-2 transition-all cursor-pointer">
                                    <i data-lucide="${this.isRecording ? 'square' : 'mic'}" class="w-4 h-4"></i>
                                    ${this.isRecording ? "Dừng ghi âm" : "Bắt đầu nói (Ghi âm dài)"}
                                </button>

                                <button type="button" onclick="app.sendSpeakingResponse()" ${this.isSpeakingLoading ? "disabled" : ""}
                                    class="px-6 py-3 rounded-2xl bg-pinky-600 hover:bg-pinky-700 disabled:opacity-60 text-white font-bold text-xs sm:text-sm shadow-sm flex items-center gap-2 cursor-pointer">
                                    <i data-lucide="send" class="w-4 h-4"></i>
                                    ${this.isSpeakingLoading ? "AI đang chấm & gợi ý Band 7.0+..." : "Gửi câu trả lời"}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // =========================================================================
            // UTILITIES & MAIN RENDER LOOP
            // =========================================================================
            renderEmptyDeckPrompt(featureName) {
                return `
                    <div class="max-w-lg mx-auto bg-white rounded-3xl border border-pinky-200 p-8 text-center space-y-4">
                        <h3 class="font-display font-extrabold text-xl text-slate-900">Chưa có bộ từ vựng để mở ${featureName}</h3>
                        <p class="text-xs sm:text-sm text-slate-500">Hãy quay lại Trang chủ để tạo một bộ file từ vựng mới nhé!</p>
                        <button type="button" onclick="app.switchTab('creator')"
                            class="px-5 py-2.5 rounded-2xl bg-pinky-600 text-white font-bold text-sm">
                            Tạo file từ mới ngay
                        </button>
                    </div>
                `;
            }

            shuffleArray(arr) {
                const copy = [...arr];
                for (let i = copy.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            escapeHtml(str) {
                return String(str || "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            escapeJs(str) {
                return String(str || "")
                    .replace(/\\/g, "\\\\")
                    .replace(/'/g, "\\'")
                    .replace(/\n/g, " ");
            }

            showToast(message) {
                const container = document.getElementById("toast-container");
                if (!container) return;
                const toast = document.createElement("div");
                toast.className = "bg-slate-900/95 text-white text-xs font-semibold px-4 py-3 rounded-2xl shadow-lg border border-pinky-400/30 transition-opacity duration-300";
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = "0";
                    setTimeout(() => toast.remove(), 300);
                }, 3200);
            }

            render() {
                // 1. Update Top Deck Selector
                const deckSelect = document.getElementById("active-deck-select");
                if (deckSelect) {
                    if (this.state.decks.length === 0) {
                        deckSelect.innerHTML = `<option value="">Chưa có file từ</option>`;
                    } else {
                        deckSelect.innerHTML = this.state.decks.map(d =>
                            `<option value="${d.id}" ${d.id === this.state.activeDeckId ? "selected" : ""}>${this.escapeHtml(d.title)} (${d.items.length})</option>`
                        ).join("");
                    }
                }

                // 2. Render Navigation Pills
                const navTabs = document.getElementById("nav-tabs");
                const totalDueAll = this.getTotalDueAcrossAllDecks();
                if (navTabs) {
                    const tabs = [
                        { id: "home", label: "Trang chủ", icon: "home" },
                        { id: "creator", label: "1. Tạo từ & File", icon: "plus-circle" },
                        { id: "srs", label: `2. Lịch ôn (1-2-5-10d)${totalDueAll > 0 ? ` (${totalDueAll})` : ""}`, icon: "calendar-clock" },
                        { id: "flashcards", label: "3. Flashcards", icon: "layers" },
                        { id: "quiz", label: "4. Trắc nghiệm", icon: "check-circle-2" },
                        { id: "writing", label: "5. Tập viết", icon: "pen-tool" },
                        { id: "speaking", label: "6. Luyện nói AI", icon: "mic" }
                    ];

                    navTabs.innerHTML = tabs.map(t => {
                        const isActive = this.currentTab === t.id || (t.id === "home" && this.currentTab === "deck-hub");
                        return `
                            <button type="button" onclick="app.switchTab('${t.id}')"
                                class="px-3.5 py-2 rounded-2xl text-xs font-bold flex items-center gap-1.5 transition-all cursor-pointer ${
                                    isActive
                                        ? "bg-pinky-600 text-white shadow-xs"
                                        : "text-slate-600 hover:bg-pinky-50 hover:text-pinky-700"
                                }">
                                <i data-lucide="${t.icon}" class="w-3.5 h-3.5"></i>
                                <span>${t.label}</span>
                            </button>
                        `;
                    }).join("");
                }

                // 3. Render Active View
                const mainEl = document.getElementById("app-main");
                if (mainEl) {
                    if (this.currentTab === "home") {
                        mainEl.innerHTML = this.renderHomeView();
                    } else if (this.currentTab === "deck-hub") {
                        mainEl.innerHTML = this.renderDeckHubView();
                    } else if (this.currentTab === "creator") {
                        mainEl.innerHTML = this.renderCreatorView();
                    } else if (this.currentTab === "srs") {
                        mainEl.innerHTML = this.renderSrsScheduleView();
                    } else if (this.currentTab === "flashcards") {
                        mainEl.innerHTML = this.renderFlashcardsView();
                    } else if (this.currentTab === "quiz") {
                        mainEl.innerHTML = this.renderQuizView();
                    } else if (this.currentTab === "writing") {
                        mainEl.innerHTML = this.renderWritingView();
                    } else if (this.currentTab === "speaking") {
                        mainEl.innerHTML = this.renderSpeakingView();
                    }
                }

                if (window.lucide) {
                    lucide.createIcons();
                }
            }
        }

        // Initialize application when DOM is ready
        window.addEventListener("DOMContentLoaded", () => {
            window.app = new TlingEnglishApp();
        });
    </script>
</body>
</html>
