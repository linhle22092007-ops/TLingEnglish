<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TlingEnglish — Học Từ Vựng & Collocation Thông Minh Với AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        pinky: {
                            50: '#FDF2F8',
                            100: '#FCE7F3',
                            200: '#FBCFE8',
                            300: '#F9A8D4',
                            400: '#F472B6',
                            500: '#EC4899',
                            600: '#DB2777',
                            700: '#BE185D',
                            800: '#9D174D',
                            900: '#831843',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #FFF5F8 0%, #FFFFFF 48%, #FDF2F8 100%);
            min-height: 100vh;
            color: #1F2937;
            overflow-x: hidden;
        }
        /* 3D Flashcard Flip Mechanics */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FDF2F8;
        }
        ::-webkit-scrollbar-thumb {
            background: #F9A8D4;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #F472B6;
        }
        /* Pulse animation for recording mic */
        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.55); }
            70% { box-shadow: 0 0 0 16px rgba(225, 29, 72, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }
        .mic-pulse {
            animation: micPulse 1.5s infinite;
        }
        /* Soundwave bars */
        @keyframes waveBar {
            0%, 100% { height: 6px; }
            50% { height: 22px; }
        }
        .wave-bar {
            animation: waveBar 0.9s ease-in-out infinite;
        }
    </style>
</head>
<body class="antialiased selection:bg-pinky-200 selection:text-pinky-900">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 bg-white/85 backdrop-blur-md border-b border-pinky-100 shadow-2xs">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
            <!-- Brand Logo (Click to go Home) -->
            <button type="button" onclick="app.goHome()" class="flex items-center gap-2.5 shrink-0 text-left group cursor-pointer focus:outline-hidden">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-pinky-400 to-pinky-600 flex items-center justify-center text-white shadow-sm shadow-pinky-200 group-hover:scale-105 transition-transform">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </div>
                <div>
                    <span class="font-display font-extrabold text-xl tracking-tight bg-gradient-to-r from-pinky-600 to-rose-500 bg-clip-text text-transparent">
                        TlingEnglish
                    </span>
                    <span class="hidden sm:block text-[11px] font-medium text-pinky-500 -mt-1">
                        Học Collocation Thông Minh Với AI
                    </span>
                </div>
            </button>

            <!-- Active Deck Selector & API Key Button -->
            <div class="flex items-center gap-2 sm:gap-2.5 flex-1 justify-end min-w-0">
                <div class="relative flex-1 max-w-[220px]">
                    <select id="active-deck-select" onchange="app.selectDeck(this.value, true)"
                        class="w-full appearance-none bg-pinky-50/90 hover:bg-pinky-100/80 border border-pinky-200 text-pinky-900 text-xs sm:text-sm font-semibold rounded-2xl pl-3.5 pr-8 py-2 focus:outline-hidden focus:ring-2 focus:ring-pinky-400 transition-all cursor-pointer truncate">
                    </select>
                    <i data-lucide="chevron-down" class="w-4 h-4 text-pinky-500 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                </div>
                <button type="button" onclick="app.openApiKeyModal()" title="Cài đặt Gemini API Key"
                    class="px-3 py-2 rounded-2xl bg-pinky-50 hover:bg-pinky-100 border border-pinky-200 text-pinky-700 text-xs font-bold flex items-center gap-1.5 shrink-0 cursor-pointer">
                    <i data-lucide="key-round" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">API Key</span>
                </button>
            </div>
        </div>

        <!-- Mode Navigation Bar -->
        <nav class="bg-white/95 border-t border-pinky-50 overflow-x-auto">
            <div id="nav-tabs" class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center gap-1.5 py-2 whitespace-nowrap">
                <!-- Populated dynamically by JS -->
            </div>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main id="app-main" class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8 pb-20">
        <!-- Active view rendered here -->
    </main>

    <!-- Floating Toast Notification -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <script>
        // =========================================================================
        // GEMINI API HELPER WITH EXPONENTIAL BACKOFF
        // =========================================================================
        const apiKey = "";
        const GEMINI_MODEL = "gemini-3-flash-preview";

        function getEffectiveApiKey() {
            const saved = localStorage.getItem("tling_gemini_api_key");
            return (saved && saved.trim()) ? saved.trim() : apiKey;
        }

        async function callGeminiAPI({ contents, systemInstruction = "", responseSchema = null }) {
            const activeKey = getEffectiveApiKey();
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${activeKey}`;
            const payload = { contents };

            if (systemInstruction) {
                payload.systemInstruction = { parts: [{ text: systemInstruction }] };
            }
            if (responseSchema) {
                payload.generationConfig = {
                    responseMimeType: "application/json",
                    responseSchema: responseSchema
                };
            }

            const delays = [1000, 2000, 4000, 8000];
            let lastError = null;

            for (let attempt = 0; attempt <= delays.length; attempt++) {
                try {
                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errText}`);
                    }

                    const data = await response.json();
                    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) {
                        throw new Error("Empty response from Gemini");
                    }
                    return text;
                } catch (err) {
                    lastError = err;
                    if (attempt < delays.length) {
                        await new Promise(res => setTimeout(res, delays[attempt]));
                    }
                }
            }
            throw lastError;
        }

        // =========================================================================
        // SPACED REPETITION INTERVALS (1 -> 2 -> 5 -> 10 -> 20 DAYS)
        // =========================================================================
        const SRS_INTERVALS_DAYS = [1, 2, 5, 10, 20];
        const DAY_MS = 24 * 60 * 60 * 1000;

        // =========================================================================
        // APPLICATION STATE & CONTROLLER
        // =========================================================================
        class TlingEnglishApp {
            constructor() {
                this.STORAGE_KEY = "tling_english_decks_v1";
                this.state = this.loadState();
                this.currentTab = "home"; // 'home' | 'deck-hub' | 'creator' | 'srs' | 'flashcards' | 'quiz' | 'writing' | 'speaking'
                this.rawWordsInput = "";
                this.newDeckTitleInput = "";
                this.stagedCollocations = [];
                this.isGeneratingAI = false;

                // Flashcard state
                this.fcQueue = [];
                this.fcIndex = 0;
                this.fcFlipped = false;
                this.fcOnlyDue = false;
                this.fcShowPronunciationTip = false;
                this.fcLastDirectionHint = null;

                // Quiz state
                this.quizQueue = [];
                this.quizIndex = 0;
                this.quizScore = 0;
                this.quizAnswered = false;
                this.quizOptions = [];
                this.quizDirection = "en-to-vi";
                this.quizOnlyDue = false;
                this.quizShowPronunciationTip = false;

                // Writing state
                this.writeQueue = [];
                this.writeIndex = 0;
                this.writeScore = 0;
                this.writeAnswered = false;
                this.writeDirection = "vi-to-en";
                this.currentItemDirection = "vi-to-en";
                this.isCheckingWritingAI = false;
                this.writeOnlyDue = false;
                this.writeShowPronunciationTip = false;
                this.writeLastResult = null;

                // AI Speaking Tutor state
                this.speakingMessages = [];
                this.targetSpeakingCollocations = [];
                this.isSpeakingLoading = false;
                this.isRecording = false;
                this.recognition = null;
                this.recordingSeconds = 0;
                this.recordingTimer = null;
                this.finalTranscriptBuffer = "";

                this.initSpeechRecognition();
                this.initKeyboardShortcuts();
                this.render();
            }

            // =========================================================================
            // STATE PERSISTENCE & DEFAULT SAMPLE DECKS
            // =========================================================================
            getDefaultDecks() {
                const now = Date.now();
                return [
                    {
                        id: "deck-sample-ielts",
                        title: "IELTS Speaking & Writing Core Collocations",
                        createdAt: new Date().toISOString().split("T")[0],
                        items: [
                            {
                                id: "col-1",
                                rootWord: "decision",
                                collocation: "make an informed decision",
                                ipa: "/meɪk ən ɪnˈfɔːrmd dɪˈsɪʒ.ən/",
                                meaningVi: "đưa ra quyết định sáng suốt (dựa trên đầy đủ thông tin)",
                                exampleEn: "Students should research carefully before they make an informed decision about their major.",
                                exampleVi: "Sinh viên nên tìm hiểu kỹ trước khi đưa ra quyết định sáng suốt về chuyên ngành của mình.",
                                mastery: 0,
                                srsStep: 0,
                                nextReviewAt: now
                            },
                            {
                                id: "col-2",
                                rootWord: "advantage",
                                collocation: "take full advantage of",
                                ipa: "/teɪk fʊl ədˈvæn.tɪdʒ əv/",
                                meaningVi: "tận dụng triệt để, khai thác tối đa",
                                exampleEn: "Young people should take full advantage of online resources to learn English.",
                                exampleVi: "Người trẻ nên tận dụng tối đa các nguồn tài nguyên trực tuyến để học tiếng Anh.",
                                mastery: 0,
                                srsStep: 0,
                                nextReviewAt: now
                            },
                            {
                                id: "col-3",
                                rootWord: "awareness",
                                collocation: "raise public awareness of",
                                ipa: "/reɪz ˈpʌb.lɪk əˈwer.nəs əv/",
                                meaningVi: "nâng cao nhận thức cộng đồng về",
                                exampleEn: "Social media campaigns can effectively raise public awareness of environmental protection.",
                                exampleVi: "Các chiến dịch truyền thông xã hội có thể nâng cao nhận thức cộng đồng về bảo vệ môi trường.",
                                mastery: 0,
                                srsStep: 0,
                                nextReviewAt: now
                            },
                            {
                                id: "col-4",
                                rootWord: "effort",
                                collocation: "make a concerted effort",
                                ipa: "/meɪk ə kənˈsɜːr.t̬ɪd ˈef.ɚt/",
                                meaningVi: "nỗ lực hết mình, chung sức đồng lòng",
                                exampleEn: "Governments and citizens must make a concerted effort to reduce plastic waste.",
                                exampleVi: "Chính phủ và người dân phải nỗ lực chung tay để giảm thiểu rác thải nhựa.",
                                mastery: 0,
                                srsStep: 0,
                                nextReviewAt: now
                            }
                        ]
                    }
                ];
            }

            normalizeSrsItem(item) {
                return {
                    ...item,
                    mastery: typeof item.mastery === "number" ? item.mastery : 0,
                    srsStep: typeof item.srsStep === "number" ? item.srsStep : 0,
                    nextReviewAt: typeof item.nextReviewAt === "number" ? item.nextReviewAt : Date.now()
                };
            }

            loadState() {
                try {
                    const raw = localStorage.getItem(this.STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed && Array.isArray(parsed.decks)) {
                            parsed.decks = parsed.decks.map(deck => ({
                                ...deck,
                                items: (deck.items || []).map(item => this.normalizeSrsItem(item))
                            }));
                            return parsed;
                        }
                    }
                } catch (e) {
                    console.warn("Failed to load state:", e);
                }
                const defaults = this.getDefaultDecks();
                return { decks: defaults, activeDeckId: defaults[0]?.id || null };
            }

            saveState() {
                try {
                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.state));
                } catch (e) {
                    console.warn("Could not save state:", e);
                }
            }

            // =========================================================================
            // SPACED REPETITION ENGINE (1 -> 2 -> 5 -> 10 -> 20 DAYS)
            // =========================================================================
            getDueItemsForDeck(deck) {
                if (!deck || !Array.isArray(deck.items)) return [];
                const now = Date.now();
                return deck.items.filter(item => (item.nextReviewAt || 0) <= now);
            }

            getTotalDueAcrossAllDecks() {
                return (this.state.decks || []).reduce((sum, deck) => sum + this.getDueItemsForDeck(deck).length, 0);
            }

            updateItemSrsSchedule(deckId, itemId, isSuccess) {
                const deck = this.state.decks.find(d => d.id === deckId);
                if (!deck) return;
                const item = deck.items.find(i => i.id === itemId);
                if (!item) return;

                const now = Date.now();
                if (isSuccess) {
                    const nextStep = Math.min((item.srsStep || 0) + 1, SRS_INTERVALS_DAYS.length);
                    const days = SRS_INTERVALS_DAYS[nextStep - 1];
                    item.srsStep = nextStep;
                    item.mastery = Math.min((item.mastery || 0) + 1, 5);
                    item.nextReviewAt = now + days * DAY_MS;
                } else {
                    item.srsStep = 1;
                    item.nextReviewAt = now + SRS_INTERVALS_DAYS[0] * DAY_MS;
                }
                this.saveState();
            }

            simulateAdvanceOneDay(deckId) {
                const deck = this.state.decks.find(d => d.id === deckId);
                if (!deck) return;
                deck.items.forEach(item => {
                    item.nextReviewAt = (item.nextReviewAt || Date.now()) - DAY_MS;
                });
                this.saveState();
                this.render();
                this.showToast(`Đã tua nhanh +1 ngày cho bộ "${deck.title}"!`);
            }

            startDueReviewForDeck(deckId, mode) {
                this.state.activeDeckId = deckId;
                this.saveState();
                this.currentTab = mode;
                if (mode === "flashcards") {
                    this.initFlashcards(true);
                } else if (mode === "quiz") {
                    this.initQuiz(true);
                } else if (mode === "writing") {
                    this.initWriting(true);
                }
                this.render();
            }

            // =========================================================================
            // NAVIGATION, DECK HUB, DELETE MODAL, IMPORT/EXPORT & API KEY MODAL
            // =========================================================================
            getActiveDeck() {
                if (!this.state.decks || this.state.decks.length === 0) return null;
                let found = this.state.decks.find(d => d.id === this.state.activeDeckId);
                if (!found) {
                    found = this.state.decks[0];
                    this.state.activeDeckId = found.id;
                }
                return found;
            }

            goHome() {
                this.stopRecording();
                this.currentTab = "home";
                this.render();
            }

            selectDeck(deckId, openHub = false) {
                this.stopRecording();
                this.state.activeDeckId = deckId;
                this.saveState();
                this.fcQueue = [];
                this.quizQueue = [];
                this.writeQueue = [];
                this.speakingMessages = [];
                if (openHub) {
                    this.currentTab = "deck-hub";
                }
                this.render();
            }

            openDeckHub(deckId) {
                this.stopRecording();
                this.state.activeDeckId = deckId;
                this.saveState();
                this.currentTab = "deck-hub";
                this.render();
            }

            switchTab(tabId) {
                this.stopRecording();
                this.currentTab = tabId;
                if (tabId === "flashcards" && this.fcQueue.length === 0) {
                    this.initFlashcards(false);
                } else if (tabId === "quiz" && this.quizQueue.length === 0) {
                    this.initQuiz(false);
                } else if (tabId === "writing" && this.writeQueue.length === 0) {
                    this.initWriting(false);
                } else if (tabId === "speaking" && this.speakingMessages.length === 0) {
                    this.initSpeakingSession();
                }
                this.render();
            }

            deleteDeck(deckId) {
                const deck = this.state.decks.find(d => d.id === deckId);
                if (!deck) return;
                const container = document.getElementById("modal-container");
                if (!container) return;
                container.innerHTML = `
                    <div class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
                        <div class="bg-white rounded-3xl border border-pinky-200 max-w-md w-full p-6 shadow-xl space-y-4">
                            <div class="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center">
                                <i data-lucide="trash-2" class="w-6 h-6"></i>
                            </div>
                            <h3 class="font-display font-extrabold text-lg text-slate-900">Xóa file từ vựng này?</h3>
                            <p class="text-xs sm:text-sm text-slate-600">
                                Bạn có chắc chắn muốn xóa bộ <strong>"${this.escapeHtml(deck.title)}"</strong> (${deck.items.length} cụm từ) không? Hành động này không thể hoàn tác.
                            </p>
                            <div class="flex justify-end gap-2.5 pt-2">
                                <button type="button" onclick="document.getElementById('modal-container').innerHTML = ''"
                                    class="px-4 py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold cursor-pointer">
                                    Hủy
                                </button>
                                <button type="button" onclick="app.confirmDeleteDeck('${deck.id}')"
                                    class="px-4 py-2.5 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-extrabold cursor-pointer">
                                    Xóa vĩnh viễn
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                if (window.lucide) lucide.createIcons();
            }

            confirmDeleteDeck(deckId) {
                this.state.decks = this.state.decks.filter(d => d.id !== deckId);
                if (this.state.activeDeckId === deckId) {
                    this.state.activeDeckId = this.state.decks[0]?.id || null;
                }
                this.saveState();
                const container = document.getElementById("modal-container");
                if (container) container.innerHTML = "";
                if (this.currentTab === "deck-hub") {
                    this.currentTab = "home";
                }
                this.render();
                this.showToast("Đã xóa bộ từ vựng!");
            }

            exportDeckToJson(deckId) {
                const deck = this.state.decks.find(d => d.id === deckId) || this.getActiveDeck();
                if (!deck) return;
                const blob = new Blob([JSON.stringify(deck, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `${deck.title.replace(/[^a-zA-Z0-9_\u00C0-\u1EF9-]+/g, "_")}.json`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
                this.showToast(`Đã xuất file "${deck.title}.json"!`);
            }

            importDeckFromJson(event) {
                const file = event?.target?.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        const items = Array.isArray(parsed.items) ? parsed.items : (Array.isArray(parsed) ? parsed : null);
                        if (!items || items.length === 0) {
                            this.showToast("File JSON không đúng định dạng bộ từ TlingEnglish!");
                            return;
                        }
                        const now = Date.now();
                        const importedDeck = {
                            id: "deck-" + now,
                            title: parsed.title || file.name.replace(/\.json$/i, ""),
                            createdAt: new Date().toISOString().split("T")[0],
                            items: items.map((it, idx) => this.normalizeSrsItem({
                                id: "col-" + now + "-" + idx,
                                rootWord: it.rootWord || it.collocation || "",
                                collocation: it.collocation || it.word || "",
                                ipa: it.ipa || "",
                                meaningVi: it.meaningVi || it.meaning || "",
                                exampleEn: it.exampleEn || "",
                                exampleVi: it.exampleVi || ""
                            }))
                        };
                        this.state.decks.unshift(importedDeck);
                        this.state.activeDeckId = importedDeck.id;
                        this.saveState();
                        this.render();
                        this.showToast(`Đã nhập thành công bộ "${importedDeck.title}"!`);
                    } catch (err) {
                        this.showToast("Lỗi đọc file JSON, vui lòng kiểm tra lại file.");
                    }
                };
                reader.readAsText(file);
                event.target.value = "";
            }

            openApiKeyModal() {
                const currentKey = localStorage.getItem("tling_gemini_api_key") || "";
                const container = document.getElementById("modal-container");
                if (!container) return;
                container.innerHTML = `
                    <div class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
                        <div class="bg-white rounded-3xl border border-pinky-200 max-w-md w-full p-6 shadow-xl space-y-4">
                            <div class="flex items-center justify-between">
                                <h3 class="font-display font-extrabold text-lg text-slate-900 flex items-center gap-2">
                                    <i data-lucide="key-round" class="w-5 h-5 text-pinky-600"></i>
                                    Cài đặt Gemini API Key
                                </h3>
                                <button type="button" onclick="document.getElementById('modal-container').innerHTML = ''" class="text-slate-400 hover:text-slate-700">
                                    <i data-lucide="x" class="w-5 h-5"></i>
                                </button>
                            </div>
                            <p class="text-xs text-slate-600 leading-relaxed">
                                Dán mã khóa <strong>Gemini API Key (AIzaSy...)</strong> của bạn vào đây để dùng tính năng AI ghép Collocation, dịch tiếng Việt tự động và chấm Speaking trên GitHub Pages. Mã được lưu riêng trên trình duyệt của bạn, không bao giờ lộ lên GitHub.
                            </p>

            // =========================================================================
            speakEnglish(text, rate = 0.95, onEndCallback = null) {
                if (!text) {
                    if (onEndCallback) onEndCallback();
                    return;
                }
                if (!("speechSynthesis" in window)) {
                    if (onEndCallback) onEndCallback();
                    return;
                }

                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = "en-US";
                utter.rate = rate;

                const voices = window.speechSynthesis.getVoices();
                const preferred = voices.find(v => v.lang === "en-US" && (v.name.includes("Google") || v.name.includes("Natural") || v.name.includes("Samantha")))
                    || voices.find(v => v.lang.startsWith("en-"));
                if (preferred) utter.voice = preferred;

                let finished = false;
                const finishOnce = () => {
                    if (finished) return;
                    finished = true;
                    if (onEndCallback) onEndCallback();
                };

                utter.onend = finishOnce;
                utter.onerror = finishOnce;
                window.speechSynthesis.speak(utter);

                // Fallback timer in case browser speechSynthesis does not fire onend
                if (onEndCallback) {
                    const fallbackMs = Math.min(Math.max(text.length * 75, 900), 3500);
                    setTimeout(finishOnce, fallbackMs);
                }
            }

            togglePronunciationGuide(mode) {
                const deck = this.getActiveDeck();
                let currentItem = null;
                if (mode === "fc") {
                    this.fcShowPronunciationTip = !this.fcShowPronunciationTip;
                    currentItem = this.fcQueue[this.fcIndex];
                } else if (mode === "quiz") {
                    this.quizShowPronunciationTip = !this.quizShowPronunciationTip;
                    currentItem = this.quizQueue[this.quizIndex];
                } else if (mode === "write") {
                    this.writeShowPronunciationTip = !this.writeShowPronunciationTip;
                    currentItem = this.writeQueue[this.writeIndex];

                if (currentItem && (this.fcShowPronunciationTip || this.quizShowPronunciationTip || this.writeShowPronunciationTip)) {
                    this.speakEnglish(currentItem.collocation, 0.78);

                this.render();

                    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

                    if (this.currentTab === "flashcards" && this.fcQueue.length > 0 && this.fcIndex < this.fcQueue.length) {
                        const current = this.fcQueue[this.fcIndex];
                        if (e.code === "Space") {
                            e.preventDefault();
                            this.flipFlashcard();
                        } else if (e.key === "a" || e.key === "A") {
                            e.preventDefault();
                            if (current) this.speakEnglish(current.collocation);
                        } else if (e.key === "p" || e.key === "P") {
                            e.preventDefault();
                            this.togglePronunciationGuide("fc");
                        } else if (e.key === "ArrowLeft" || e.key === "<" || e.key === ",") {
                            e.preventDefault();
                            this.fcLastDirectionHint = "left";
                            this.rateFlashcard("hard");
                        } else if (e.key === "ArrowRight" || e.key === ">" || e.key === ".") {

            // =========================================================================
            // 1. CREATOR VIEW (AI COLLOCATION GENERATOR + AUTO VIETNAMESE TRANSLATION)
            // =========================================================================
            async translateRawItemsWithAI(rawLines) {
                const prompt = `Bạn là từ điển chuyên ngành Anh - Việt & chuyên gia Collocation.
Nhiệm vụ: Với mỗi từ hoặc cụm từ tiếng Anh người dùng nhập bên dưới:
1. Mở rộng từ đơn lẻ thành Collocation (cụm từ tự nhiên, chuẩn xác trong giao tiếp hoặc IELTS). Nếu người dùng đã nhập sẵn một cụm từ hoàn chỉnh, hãy giữ nguyên cụm đó và chuẩn hóa.
2. Cung cấp phiên âm IPA chuẩn Mỹ.
3. Dịch nghĩa tiếng Việt thật tự nhiên, chính xác, dễ hiểu (BẮT BUỘC phải có nghĩa tiếng Việt rõ ràng cho 100% các mục, tuyệt đối không để trống hay giữ nguyên tiếng Anh).
4. Viết 1 câu ví dụ tiếng Anh thực tế chứa cụm từ đó và dịch câu ví dụ sang tiếng Việt.

Danh sách từ vựng đầu vào:
${rawLines.map((line, i) => `${i + 1}. ${line}`).join("\n")}`;

                const schema = {
                    type: "ARRAY",
                    items: {
                        type: "OBJECT",
                        properties: {
                            rootWord: { type: "STRING" },
                            collocation: { type: "STRING" },
                            ipa: { type: "STRING" },
                            meaningVi: { type: "STRING" },
                            exampleEn: { type: "STRING" },
                            exampleVi: { type: "STRING" }
                        },
                        required: ["rootWord", "collocation", "ipa", "meaningVi", "exampleEn", "exampleVi"]
                    }
                };

                const jsonText = await callGeminiAPI({
                    contents: [{ role: "user", parts: [{ text: prompt }] }],
                    systemInstruction: "Bạn là chuyên gia ngôn ngữ Anh - Việt. Luôn mở rộng từ đơn thành Collocation tự nhiên và BẮT BUỘC dịch đầy đủ nghĩa tiếng Việt chuẩn xác cho từng cụm từ cùng câu ví dụ song ngữ Anh - Việt.",
                    responseSchema: schema
                });

                const parsed = JSON.parse(jsonText);
                return parsed.map((item, idx) => ({
                    id: "col-" + Date.now() + "-" + idx,
                    rootWord: (item.rootWord || rawLines[idx] || "").trim(),
                    collocation: (item.collocation || rawLines[idx] || "").trim(),
                    ipa: (item.ipa || "").trim(),
                    meaningVi: (item.meaningVi || "").trim(),
                    exampleEn: (item.exampleEn || "").trim(),
                    exampleVi: (item.exampleVi || "").trim()
                }));
            }

                const titleInput = document.getElementById("creator-deck-title");
                const wordsInput = document.getElementById("creator-raw-words");
                this.newDeckTitleInput = titleInput ? titleInput.value : this.newDeckTitleInput;
                this.rawWordsInput = wordsInput ? wordsInput.value : this.rawWordsInput;

                const rawLines = this.rawWordsInput
                    .split(/[\n,;]+/)
                    .map(s => s.trim())
                    .filter(Boolean);

                if (rawLines.length === 0) {
                    this.showToast("Vui lòng nhập ít nhất 1 từ vựng hoặc cụm từ tiếng Anh!");
                    return;
                }

                this.isGeneratingAI = true;
                this.render();

                try {
                    this.stagedCollocations = await this.translateRawItemsWithAI(rawLines);
                    this.showToast(`AI đã ghép Collocation & dịch nghĩa tiếng Việt xong cho ${this.stagedCollocations.length} từ!`);
                } catch (err) {
                    console.error(err);
                    this.showToast("Không kết nối được AI (hãy kiểm tra nút API Key góc trên), đã tạo danh sách tạm.");
                    this.stagedCollocations = rawLines.map((line, idx) => {
                        const parts = line.split(/[:\-–]/);
                        return {
                            id: "col-" + Date.now() + "-" + idx,
                            rootWord: (parts[0] || "").trim(),
                            collocation: (parts[0] || "").trim(),
                            ipa: "",
                            meaningVi: (parts[1] || "").trim(),
                            exampleEn: "",
                            exampleVi: ""
                        };
                    });
                } finally {
                    this.isGeneratingAI = false;
                    this.render();
                }
            }

            async translateSingleStagedItem(index) {
                const item = this.stagedCollocations[index];
                if (!item || !item.collocation.trim()) return;

                this.showToast(`AI đang dịch nghĩa cho "${item.collocation}"...`);
                try {
                    const result = await this.translateRawItemsWithAI([item.collocation]);
                    if (result && result[0]) {
                        this.stagedCollocations[index] = {
                            ...item,
                            ipa: result[0].ipa || item.ipa,
                            meaningVi: result[0].meaningVi || item.meaningVi,
                            exampleEn: result[0].exampleEn || item.exampleEn,
                            exampleVi: result[0].exampleVi || item.exampleVi
                        };
                        this.render();
                        this.showToast(`Đã dịch xong: "${this.stagedCollocations[index].meaningVi}"`);
                    }
                } catch (err) {
                    this.showToast("Không kết nối được AI để dịch, vui lòng kiểm tra API Key.");
                }
            }

            updateStagedField(index, field, value) {
                if (this.stagedCollocations[index]) {
                    this.stagedCollocations[index][field] = value;
                }
            }

            removeStagedItem(index) {
                this.stagedCollocations.splice(index, 1);
                this.render();
            }

            async saveStagedDeck(alsoExportJson = false) {
                if (this.isGeneratingAI) return;
                const titleInput = document.getElementById("creator-deck-title");
                const wordsInput = document.getElementById("creator-raw-words");
                const title = (titleInput ? titleInput.value : this.newDeckTitleInput).trim() || `Bộ từ ngày ${new Date().toLocaleDateString("vi-VN")}`;

                let itemsToSave = [...this.stagedCollocations];

                // If user typed English words and clicked Save directly, auto-translate Vietnamese via AI first!
                if (itemsToSave.length === 0) {
                    const rawText = (wordsInput ? wordsInput.value : this.rawWordsInput).trim();
                    const lines = rawText.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
                    if (lines.length === 0) {
                        this.showToast("Vui lòng nhập từ vựng trước khi lưu bộ từ!");
                        return;
                    }

                    // Check if any line lacks Vietnamese meaning after ':' or '-'
                    const hasUnTranslatedLines = lines.some(l => !/[:\-–]/.test(l));
                    if (hasUnTranslatedLines) {
                        this.isGeneratingAI = true;
                        this.render();
                        try {
                            itemsToSave = await this.translateRawItemsWithAI(lines);
                        } catch (err) {
                            itemsToSave = lines.map((line, idx) => {
                                const parts = line.split(/[:\-–]/);
                                const phrase = (parts[0] || "").trim();
                                const meaning = (parts.slice(1).join("-") || "Chưa dịch nghĩa tiếng Việt").trim();
                                return {
                                    id: "col-" + Date.now() + "-" + idx,
                                    rootWord: phrase,
                                    collocation: phrase,
                                    ipa: "",
                                    meaningVi: meaning,
                                    exampleEn: "",
                                    exampleVi: ""
                                };
                            });
                        } finally {
                            this.isGeneratingAI = false;
                        }
                    } else {
                        itemsToSave = lines.map((line, idx) => {
                            const parts = line.split(/[:\-–]/);
                            const phrase = (parts[0] || "").trim();
                            const meaning = (parts.slice(1).join("-") || "").trim();
                            return {
                                id: "col-" + Date.now() + "-" + idx,
                                rootWord: phrase,
                                collocation: phrase,
                                ipa: "",
                                meaningVi: meaning,
                                exampleEn: "",
                                exampleVi: ""
                            };
                        });
                    }
                } else {
                    // Translate any staged item that still has empty meaningVi
                    const missingIdx = itemsToSave
                        .map((it, i) => (!it.meaningVi || !it.meaningVi.trim() ? i : -1))
                        .filter(i => i !== -1);

                    if (missingIdx.length > 0) {
                        this.isGeneratingAI = true;
                        this.render();
                        try {
                            const translated = await this.translateRawItemsWithAI(missingIdx.map(i => itemsToSave[i].collocation));
                            missingIdx.forEach((origIdx, tIdx) => {
                                if (translated[tIdx]) {
                                    itemsToSave[origIdx] = {
                                        ...itemsToSave[origIdx],
                                        ipa: itemsToSave[origIdx].ipa || translated[tIdx].ipa,
                                        meaningVi: translated[tIdx].meaningVi,
                                        exampleEn: itemsToSave[origIdx].exampleEn || translated[tIdx].exampleEn,
                                        exampleVi: itemsToSave[origIdx].exampleVi || translated[tIdx].exampleVi
                                    };
                                }
                            });
                        } catch (e) {
                            // Keep existing values if offline
                        } finally {
                            this.isGeneratingAI = false;
                        }
                    }
                }

                const now = Date.now();
                const newDeck = {
                    id: "deck-" + now,
                    title: title,
                    createdAt: new Date().toISOString().split("T")[0],
                    items: itemsToSave.map((it, idx) => ({
                        ...it,
                        id: it.id || ("col-" + now + "-" + idx),
                        meaningVi: it.meaningVi || "Chưa có nghĩa tiếng Việt",
                        mastery: 0,
                        srsStep: 0,
                        nextReviewAt: now
                    }))
                };

                this.state.decks.unshift(newDeck);
                this.state.activeDeckId = newDeck.id;
                this.saveState();

                // Reset creator inputs
                this.rawWordsInput = "";
                this.newDeckTitleInput = "";
                this.stagedCollocations = [];

                if (alsoExportJson) {
                    this.exportDeckToJson(newDeck.id);
                }

                this.currentTab = "deck-hub";
                this.render();
                this.showToast(`Đã dịch tiếng Việt & lưu thành công bộ "${newDeck.title}"!`);
            }

            // =========================================================================
            // 3. FLASHCARDS VIEW (< / > KEYBOARD SHORTCUTS + PRONUNCIATION GUIDE)
            // =========================================================================
            initFlashcards(onlyDue = false) {
                const deck = this.getActiveDeck();
                if (!deck) return;
                this.fcOnlyDue = onlyDue;
                const pool = onlyDue ? this.getDueItemsForDeck(deck) : deck.items;
                this.fcQueue = this.shuffleArray(pool.length > 0 ? pool : deck.items);
                this.fcIndex = 0;
                this.fcFlipped = false;
                this.fcShowPronunciationTip = false;
                this.fcLastDirectionHint = null;
                if (this.fcQueue[0]) {
                    setTimeout(() => this.speakEnglish(this.fcQueue[0].collocation), 200);
                }
            }

            flipFlashcard() {
                this.fcFlipped = !this.fcFlipped;
                this.render();
            }

            rateFlashcard(rating) {
                const deck = this.getActiveDeck();
                const current = this.fcQueue[this.fcIndex];
                if (!deck || !current) return;

                const isMastered = rating === "easy" || rating === "good";
                this.updateItemSrsSchedule(deck.id, current.id, isMastered);

                if (!isMastered) {
                    // Re-queue near end of current session for active recall
                    this.fcQueue.push(current);
                }

                // Pronounce the current phrase once more before moving to the next card
                this.speakEnglish(current.collocation, 0.92, () => {
                    this.fcIndex++;
                    this.fcFlipped = false;
                    this.fcShowPronunciationTip = false;
                    this.fcLastDirectionHint = null;
                    this.render();
                    if (this.fcQueue[this.fcIndex]) {
                        setTimeout(() => this.speakEnglish(this.fcQueue[this.fcIndex].collocation), 220);
                    }
                });
            }

                const deck = this.getActiveDeck();
                if (!deck || deck.items.length === 0) {
                    return this.renderEmptyDeckPrompt("Flashcards");
                }
                if (this.fcQueue.length === 0) {
                    this.initFlashcards(false);
                }

                if (this.fcIndex >= this.fcQueue.length) {
                    return `
                        <div class="max-w-xl mx-auto bg-white rounded-3xl border border-pinky-200 p-8 text-center space-y-5 shadow-sm">
                            <div class="w-16 h-16 rounded-3xl bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto">

            // =========================================================================
            // 4. QUIZ VIEW (MULTIPLE CHOICE + EXAMPLE TRANSITION CARD)
            // =========================================================================
            initQuiz(onlyDue = false) {
                const deck = this.getActiveDeck();
                if (!deck) return;
                this.quizOnlyDue = onlyDue;
                const pool = onlyDue ? this.getDueItemsForDeck(deck) : deck.items;
                this.quizQueue = this.shuffleArray(pool.length > 0 ? pool : deck.items);
                this.quizIndex = 0;
                this.quizScore = 0;
                this.quizAnswered = false;
                this.quizSelectedOptionId = null;
                this.quizShowPronunciationTip = false;
                this.buildQuizOptions();
            }

            buildQuizOptions() {
                const deck = this.getActiveDeck();
                const current = this.quizQueue[this.quizIndex];
                if (!deck || !current) return;

                const distractors = this.shuffleArray(deck.items.filter(i => i.id !== current.id)).slice(0, 3);
                const fallbackDistractors = [
                    { id: "fb-1", collocation: "take into account", meaningVi: "xem xét, cân nhắc kỹ lưỡng" },
                    { id: "fb-2", collocation: "draw a conclusion", meaningVi: "rút ra kết luận" },
                    { id: "fb-3", collocation: "bridge the gap", meaningVi: "thu hẹp khoảng cách" }
                ];

                while (distractors.length < 3) {
                    distractors.push(fallbackDistractors[distractors.length]);
                }

                this.quizOptions = this.shuffleArray([current, ...distractors]);
            }

            answerQuiz(optionId) {
                if (this.quizAnswered) return;
                const deck = this.getActiveDeck();
                const current = this.quizQueue[this.quizIndex];
                if (!deck || !current) return;

                this.quizAnswered = true;
                this.quizSelectedOptionId = optionId;
                const isCorrect = optionId === current.id;
                if (isCorrect) this.quizScore++;

                this.updateItemSrsSchedule(deck.id, current.id, isCorrect);
                this.speakEnglish(current.collocation);
                this.render();
            }

            nextQuizQuestion() {
                const current = this.quizQueue[this.quizIndex];
                const advance = () => {
                    this.quizIndex++;
                    this.quizAnswered = false;
                    this.quizSelectedOptionId = null;
                    this.quizShowPronunciationTip = false;
                    this.buildQuizOptions();
                    this.render();
                };
                if (current) {
                    this.speakEnglish(current.collocation, 0.94, advance);
                } else {
                    advance();
                }
            }

                        <div class="bg-white rounded-3xl border border-pinky-200 p-6 sm:p-8 shadow-sm space-y-6">

                                </span>
                                <h2 class="font-display font-extrabold text-2xl sm:text-3xl text-slate-900">

                                </h2>
                                <div class="flex items-center justify-center gap-2 pt-1">
                                    ${isEnToVi ? `
                                        <button type="button" onclick="app.speakEnglish('${this.escapeJs(current.collocation)}')"
                                            class="px-3.5 py-1.5 rounded-xl bg-pinky-50 text-pinky-700 text-xs font-bold">
                                            🔊 Nghe phát âm
                                        </button>
                                    ` : ""}
                                    <button type="button" onclick="app.togglePronunciationGuide('quiz')"
                                        class="px-3.5 py-1.5 rounded-xl bg-white border border-pinky-200 text-pinky-700 text-xs font-bold">
                                        👂 Cách đọc
                                    </button>
                                </div>
                            </div>

                            ${this.quizShowPronunciationTip ? this.renderPronunciationGuideBox(current) : ""}

                            <div class="grid grid-cols-1 gap-2.5">
                                ${this.quizOptions.map(opt => {
                                    const label = isEnToVi ? opt.meaningVi : opt.collocation;
                                    let btnStyle = "bg-pinky-50/60 hover:bg-pinky-100 border-pinky-200 text-slate-800";
                                    if (this.quizAnswered) {
                                        if (opt.id === current.id) {
                                            btnStyle = "bg-emerald-100 border-emerald-500 text-emerald-950 font-extrabold";
                                        } else if (opt.id === this.quizSelectedOptionId) {
                                            btnStyle = "bg-rose-100 border-rose-500 text-rose-950";
                                        } else {
                                            btnStyle = "bg-slate-50 border-slate-200 text-slate-400";
                                        }
                                    }
                                    return `
                                        <button type="button" onclick="app.answerQuiz('${opt.id}')"
                                            class="w-full p-4 rounded-2xl border text-left text-xs sm:text-sm font-semibold transition-all cursor-pointer ${btnStyle}">
                                            ${this.escapeHtml(label)}
                                        </button>
                                    `;
                                }).join("")}
                            </div>

                            ${this.quizAnswered ? `
                                <div class="p-4 rounded-2xl bg-pinky-50 border border-pinky-200 space-y-3">
                                    <div class="flex items-center justify-between">

                                        <button type="button" onclick="app.speakEnglish('${this.escapeJs(current.exampleEn || current.collocation)}')"
                                            class="px-3 py-1 rounded-xl bg-white border border-pinky-200 text-pinky-700 text-xs font-bold">
                                            🔊 Nghe câu ví dụ

            // =========================================================================
            // 5. TWO-WAY WRITING VIEW (VI -> EN & EN -> VI)
            // =========================================================================
            initWriting(onlyDue = false) {
                const deck = this.getActiveDeck();
                if (!deck) return;
                this.writeOnlyDue = onlyDue;
                const pool = onlyDue ? this.getDueItemsForDeck(deck) : deck.items;
                this.writeQueue = this.shuffleArray(pool.length > 0 ? pool : deck.items);
                this.writeIndex = 0;
                this.writeScore = 0;
                this.writeAnswered = false;
                this.writeLastResult = null;
                this.writeShowPronunciationTip = false;
                this.setWritingItemDirection();
            }

            setWritingItemDirection() {
                if (this.writeDirection === "mixed") {
                    this.currentItemDirection = Math.random() < 0.5 ? "vi-to-en" : "en-to-vi";
                } else {
                    this.currentItemDirection = this.writeDirection;
                }
            }

            async submitWritingAnswer() {
                if (this.writeAnswered || this.isCheckingWritingAI) return;
                const deck = this.getActiveDeck();
                const current = this.writeQueue[this.writeIndex];
                const inputEl = document.getElementById("writing-answer-input");
                const userAns = (inputEl ? inputEl.value : "").trim();

                if (!deck || !current) return;
                if (!userAns) {
                    this.showToast("Hãy nhập câu trả lời của bạn trước khi kiểm tra nhé!");
                    return;
                }

                const isViToEn = this.currentItemDirection === "vi-to-en";
                const normalize = (s) => s.toLowerCase().replace(/[.,!?;:"'()]/g, "").replace(/\s+/g, " ").trim();

                if (isViToEn) {
                    const isExact = normalize(userAns) === normalize(current.collocation);
                    this.writeAnswered = true;
                    if (isExact) this.writeScore++;
                    this.writeLastResult = {
                        isCorrect: isExact,
                        userAnswer: userAns,
                        expectedAnswer: current.collocation,
                        feedbackVi: isExact
                            ? "Chính xác tuyệt đối! Bạn đã viết đúng cụm Collocation tiếng Anh."
                            : `Đáp án chuẩn là: "${current.collocation}". Hãy chú ý mạo từ và giới từ đi kèm nhé.`
                    };
                    this.updateItemSrsSchedule(deck.id, current.id, isExact);
                    this.speakEnglish(current.collocation);
                    this.render();
                } else {
                    // EN -> VI: allow flexible semantic check via Gemini AI
                    const quickMatch = normalize(userAns) === normalize(current.meaningVi);
                    if (quickMatch) {
                        this.writeAnswered = true;
                        this.writeScore++;
                        this.writeLastResult = {
                            isCorrect: true,
                            userAnswer: userAns,
                            expectedAnswer: current.meaningVi,
                            feedbackVi: "Dịch nghĩa tiếng Việt hoàn toàn chính xác!"
                        };
                        this.updateItemSrsSchedule(deck.id, current.id, true);
                        this.speakEnglish(current.collocation);
                        this.render();
                        return;
                    }

                    this.isCheckingWritingAI = true;
                    this.render();
                    try {
                        const prompt = `Cụm từ tiếng Anh: "${current.collocation}" (nghĩa tham khảo: "${current.meaningVi}").
Người học dịch sang tiếng Việt là: "${userAns}".
Hãy đánh giá xem bản dịch của người học có đúng ý nghĩa cốt lõi không.`;
                        const schema = {
                            type: "OBJECT",
                            properties: {
                                isCorrect: { type: "BOOLEAN" },
                                feedbackVi: { type: "STRING" }
                            },
                            required: ["isCorrect", "feedbackVi"]
                        };
                        const raw = await callGeminiAPI({
                            contents: [{ role: "user", parts: [{ text: prompt }] }],
                            systemInstruction: "Bạn là giáo viên tiếng Anh chấm bài dịch Anh - Việt linh hoạt theo ngữ nghĩa tự nhiên.",
                            responseSchema: schema
                        });
                        const parsed = JSON.parse(raw);
                        this.writeAnswered = true;
                        if (parsed.isCorrect) this.writeScore++;
                        this.writeLastResult = {
                            isCorrect: parsed.isCorrect,
                            userAnswer: userAns,
                            expectedAnswer: current.meaningVi,
                            feedbackVi: parsed.feedbackVi
                        };
                        this.updateItemSrsSchedule(deck.id, current.id, parsed.isCorrect);
                    } catch (e) {
                        const overlap = normalize(current.meaningVi).split(" ").some(w => w.length > 2 && normalize(userAns).includes(w));
                        this.writeAnswered = true;
                        if (overlap) this.writeScore++;
                        this.writeLastResult = {
                            isCorrect: overlap,
                            userAnswer: userAns,
                            expectedAnswer: current.meaningVi,
                            feedbackVi: `Nghĩa tham khảo chuẩn: "${current.meaningVi}".`
                        };
                        this.updateItemSrsSchedule(deck.id, current.id, overlap);
                    } finally {
                        this.isCheckingWritingAI = false;
                        this.speakEnglish(current.collocation);
                        this.render();
                    }
                }
            }

            nextWritingQuestion() {
                const current = this.writeQueue[this.writeIndex];
                const advance = () => {
                    this.writeIndex++;
                    this.writeAnswered = false;
                    this.writeLastResult = null;
                    this.writeShowPronunciationTip = false;
                    this.setWritingItemDirection();
                    this.render();
                };
                if (current) {
                    this.speakEnglish(current.collocation, 0.94, advance);
                } else {
                    advance();
                }
            }

                                    Về bộ từ

                            </div>

                return `

                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <button type="button" onclick="app.openDeckHub('${deck.id}')" class="text-xs font-bold text-pinky-700 hover:underline flex items-center gap-1">
                                <i data-lucide="arrow-left" class="w-4 h-4"></i> Bộ: ${this.escapeHtml(deck.title)}
                            </button>
                            <div class="flex items-center gap-1.5">
                                ${["vi-to-en", "en-to-vi", "mixed"].map(dir => `
                                    <button type="button" onclick="app.writeDirection = '${dir}'; app.setWritingItemDirection(); app.render()"
                                        class="px-2.5 py-1 rounded-xl text-[11px] font-bold border ${this.writeDirection === dir ? 'bg-pinky-600 text-white border-pinky-600' : 'bg-white text-slate-600 border-pinky-200'}">
                                        ${dir === "vi-to-en" ? "Việt → Anh" : dir === "en-to-vi" ? "Anh → Việt" : "Trộn 2 chiều"}
                                    </button>
                                `).join("")}
                            </div>
                        </div>

                        <div class="bg-white rounded-3xl border border-pinky-200 p-6 sm:p-8 shadow-sm space-y-5">
                            <div class="flex items-center justify-between">
                                <span class="px-3 py-1 rounded-full bg-pinky-100 text-pinky-800 text-xs font-extrabold">
                                    Câu ${this.writeIndex + 1} / ${this.writeQueue.length}
                                </span>
                                <button type="button" onclick="app.togglePronunciationGuide('write')"
                                    class="px-3 py-1 rounded-xl bg-pinky-50 text-pinky-700 text-xs font-bold">
                                    👂 Cách đọc

                                        🔊 Nghe phát âm
                                    </button>
                                ` : ""}
                            </div>

                            ${this.writeShowPronunciationTip ? this.renderPronunciationGuideBox(current) : ""}

                            ${!this.writeAnswered ? `
                                <div class="space-y-3">
                                    <input id="writing-answer-input" type="text"
                                        onkeydown="if(event.key==='Enter'){ event.preventDefault(); app.submitWritingAnswer(); }"

                                        class="w-full px-4 py-3.5 rounded-2xl border-2 border-pinky-200 focus:border-pinky-500 text-sm sm:text-base font-semibold outline-hidden">
                                    <button type="button" onclick="app.submitWritingAnswer()" ${this.isCheckingWritingAI ? "disabled" : ""}
                                        class="w-full py-3.5 rounded-2xl bg-pinky-600 hover:bg-pinky-700 disabled:opacity-60 text-white font-display font-extrabold text-sm shadow-sm cursor-pointer">

                                <div class="p-4 rounded-2xl ${this.writeLastResult?.isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'} border space-y-3">
                                    <div class="font-display font-extrabold text-sm ${this.writeLastResult?.isCorrect ? 'text-emerald-800' : 'text-rose-800'}">
                                        ${this.writeLastResult?.isCorrect ? "✓ Chính xác!" : "✕ Chưa chính xác"}
                                    </div>
                                    <p class="text-xs sm:text-sm text-slate-800">${this.escapeHtml(this.writeLastResult?.feedbackVi || "")}</p>
                                    <div class="p-3 rounded-xl bg-white/90 border border-pinky-100 space-y-1">
                                        <div class="flex items-center justify-between">
                                            <span class="text-[11px] font-bold text-pinky-700">Cụm từ &amp; Câu ví dụ gợi ý:</span>
                                            <button type="button" onclick="app.speakEnglish('${this.escapeJs(current.exampleEn || current.collocation)}')"
                                                class="text-[11px] font-bold text-pinky-600 underline">🔊 Nghe ví dụ</button>
                                        </div>
                                        <p class="text-xs font-extrabold text-slate-900">${this.escapeHtml(current.collocation)} — ${this.escapeHtml(current.meaningVi)}</p>
                                        ${current.exampleEn ? `<p class="text-xs text-slate-600 italic">"${this.escapeHtml(current.exampleEn)}"</p>` : ""}
                                    </div>
                                    <button type="button" onclick="app.nextWritingQuestion()"
                                        class="w-full py-3 rounded-2xl bg-pinky-600 hover:bg-pinky-700 text-white text-xs sm:text-sm font-extrabold cursor-pointer">
                                        Phát âm lại &amp; Sang từ tiếp theo →
                                    </button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            }

            // =========================================================================
            // 6. AI SPEAKING TUTOR VIEW (CONTINUOUS RECORDING + BAND 6.5 - 7.5+ UPGRADE)
            // =========================================================================
            initSpeechRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) return;

                const rec = new SpeechRecognition();
                rec.lang = "en-US";
                rec.continuous = true;
                rec.interimResults = true;

                rec.onresult = (event) => {
                    let interim = "";
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            this.finalTranscriptBuffer += (this.finalTranscriptBuffer ? " " : "") + transcript.trim();
                        } else {
                            interim += transcript;
                        }
                    }
                    const inputEl = document.getElementById("speaking-user-input");
                    if (inputEl) {
                        inputEl.value = (this.finalTranscriptBuffer + (interim ? " " + interim : "")).trim();
                    }
                };

                rec.onend = () => {
                    // Automatically restart if user has NOT clicked Stop button yet
                    if (this.isRecording) {
                        try {
                            rec.start();
                        } catch (e) {
                            // Ignore rapid restart error
                        }
                    }
                };

                rec.onerror = (event) => {
                    if (event.error === "not-allowed") {
                        this.isRecording = false;
                        clearInterval(this.recordingTimer);
                        this.showToast("Trình duyệt chưa được cấp quyền Micro!");
                        this.render();
                    }
                };

                this.recognition = rec;
            }

            toggleRecording() {
                if (this.isRecording) {
                    this.stopRecording();
                    this.render();
                } else {
                    this.startRecording();
                }
            }

            startRecording() {
                if (!this.recognition) {
                    this.showToast("Trình duyệt này không hỗ trợ nhận diện giọng nói, bạn có thể nhập chữ trực tiếp.");
                    return;
                }
                const inputEl = document.getElementById("speaking-user-input");
                this.finalTranscriptBuffer = inputEl ? inputEl.value.trim() : "";
                this.isRecording = true;
                this.recordingSeconds = 0;

                clearInterval(this.recordingTimer);
                this.recordingTimer = setInterval(() => {
                    this.recordingSeconds++;
                    const timerEl = document.getElementById("recording-timer-text");
                    if (timerEl) {
                        timerEl.textContent = this.formatSeconds(this.recordingSeconds);
                    }
                }, 1000);

                try {
                    this.recognition.start();
                } catch (e) {
                    // Already started
                }
                this.render();
            }

            stopRecording() {
                this.isRecording = false;
                clearInterval(this.recordingTimer);
                if (this.recognition) {
                    try {
                        this.recognition.stop();
                    } catch (e) {
                        // Ignore
                    }
                }
            }

            formatSeconds(sec) {
                const m = String(Math.floor(sec / 60)).padStart(2, "0");
                const s = String(sec % 60).padStart(2, "0");
                return `${m}:${s}`;
            }

            initSpeakingSession() {
                const deck = this.getActiveDeck();
                if (!deck || deck.items.length === 0) return;

                const picked = this.shuffleArray(deck.items).slice(0, Math.min(2, deck.items.length));
                this.targetSpeakingCollocations = picked.map(i => i.collocation);

                const firstTarget = picked[0];
                const starterQuestion = `Hi! Let's practice speaking together. Can you tell me about a situation in your life or society where people need to "${firstTarget.collocation}"?`;
                this.speakingMessages = [
                    {
                        role: "ai",
                        questionEn: starterQuestion,
                        questionVi: `Chào bạn! Hãy cùng luyện nói nhé. Bạn có thể kể về một tình huống trong cuộc sống hoặc xã hội mà mọi người cần "${firstTarget.collocation}" (${firstTarget.meaningVi}) không?`,
                        feedback: null
                    }
                ];
            }

            async sendSpeakingResponse() {
                if (this.isSpeakingLoading) return;
                this.stopRecording();

                const inputEl = document.getElementById("speaking-user-input");
                const userText = (inputEl ? inputEl.value : "").trim();
                if (!userText) {
                    this.showToast("Vui lòng nói hoặc nhập câu trả lời tiếng Anh của bạn nhé!");
                    return;
                }

                const deck = this.getActiveDeck();
                if (!deck) return;

                this.speakingMessages.push({
                    role: "user",
                    text: userText
                });
                if (inputEl) inputEl.value = "";
                this.finalTranscriptBuffer = "";
                this.isSpeakingLoading = true;
                this.render();

                try {
                    const targetsStr = this.targetSpeakingCollocations.join(", ");
                    const nextPicked = this.shuffleArray(deck.items).slice(0, Math.min(2, deck.items.length));
                    const nextTargets = nextPicked.map(i => i.collocation);

                    const prompt = `Người học vừa trả lời câu hỏi Speaking tiếng Anh với mục tiêu sử dụng các cụm từ chỉ định: [${targetsStr}].
Câu trả lời của người học: "${userText}"
Hãy phân tích câu trả lời này và đặt câu hỏi tiếp theo khuyến khích họ dùng cụm: [${nextTargets.join(", ")}].`;

                    const schema = {
                        type: "OBJECT",
                        properties: {
                            usedTargetWell: { type: "BOOLEAN" },
                            correctedSentence: { type: "STRING" },
                            correctionExplanationVi: { type: "STRING" },
                            bandUpgradeSentence: { type: "STRING" },
                            bandUpgradeExplanationVi: { type: "STRING" },
                            nextQuestionEn: { type: "STRING" },
                            nextQuestionVi: { type: "STRING" }
                        },
                        required: [
                            "usedTargetWell",
                            "correctedSentence",
                            "correctionExplanationVi",
                            "bandUpgradeSentence",
                            "bandUpgradeExplanationVi",
                            "nextQuestionEn",
                            "nextQuestionVi"
                        ]
                    };

                    const raw = await callGeminiAPI({
                        contents: [{ role: "user", parts: [{ text: prompt }] }],
                        systemInstruction: "Bạn là giám khảo IELTS Speaking 8.5 tận tâm. Hãy sửa lỗi ngữ pháp tự nhiên cho câu của người học (correctedSentence), nâng cấp ý đó lên chuẩn Band 6.5 - 7.5+ có lồng ghép cụm từ chỉ định (bandUpgradeSentence), giải thích ngắn gọn bằng tiếng Việt và đặt câu hỏi tiếp theo bằng tiếng Anh.",
                        responseSchema: schema
                    });

                    const parsed = JSON.parse(raw);
                    this.targetSpeakingCollocations = nextTargets;
                    this.speakingMessages.push({
                        role: "ai",
                        questionEn: parsed.nextQuestionEn,
                        questionVi: parsed.nextQuestionVi,
                        feedback: {
                            usedTargetWell: parsed.usedTargetWell,
                            correctedSentence: parsed.correctedSentence,
                            correctionExplanationVi: parsed.correctionExplanationVi,
                            bandUpgradeSentence: parsed.bandUpgradeSentence,
                            bandUpgradeExplanationVi: parsed.bandUpgradeExplanationVi
                        }
                    });
                    this.speakEnglish(parsed.nextQuestionEn);
                } catch (err) {
                    console.error(err);
                    const fallbackTarget = this.targetSpeakingCollocations[0] || "make a decision";
                    this.speakingMessages.push({
                        role: "ai",
                        questionEn: `Good effort! Can you give another example using "${fallbackTarget}"?`,
                        questionVi: `Cố gắng tốt lắm! Bạn có thể cho thêm một ví dụ khác sử dụng cụm "${fallbackTarget}" không?`,
                        feedback: {
                            usedTargetWell: userText.toLowerCase().includes(fallbackTarget.toLowerCase()),
                            correctedSentence: userText,
                            correctionExplanationVi: "AI tạm thời bận, hãy kiểm tra lại thì của động từ và mạo từ nhé.",
                            bandUpgradeSentence: `From my perspective, individuals should carefully ${fallbackTarget} in order to achieve long-term success.`,
                            bandUpgradeExplanationVi: "Sử dụng cụm mở đầu 'From my perspective' và cấu trúc mục đích 'in order to' giúp nâng câu lên Band 6.5 - 7.0."
                        }
                    });
                } finally {
                    this.isSpeakingLoading = false;
                    this.render();
                }
            }

            renderSpeakingView() {
                const deck = this.getActiveDeck();
                if (!deck || deck.items.length === 0) {
                    return this.renderEmptyDeckPrompt("Luyện nói AI");
                }
                if (this.speakingMessages.length === 0) {

                }

                return `
                    <div class="max-w-3xl mx-auto space-y-5">
                        <div class="flex flex-wrap items-center justify-between gap-2">

                            </button>
                        </div>

                        <!-- Target Collocations Banner -->
                        <div class="bg-gradient-to-r from-pinky-500 to-rose-500 rounded-3xl p-5 text-white shadow-sm space-y-2">
                            <div class="text-xs font-bold uppercase tracking-wider text-pinky-100">🎯 Cụm từ chỉ định cần dùng trong câu trả lời:</div>

                            </div>

                        <!-- Conversation Feed -->

                                return `
                                    <div class="space-y-3">

                                                <div class="flex items-center justify-between">
