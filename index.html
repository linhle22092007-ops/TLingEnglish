            // =========================================================================
            // 4. MULTIPLE CHOICE QUIZ VIEW
            // =========================================================================
            initQuiz(onlyDue = false) {
                const deck = this.getActiveDeck();
                if (!deck) return;
                this.quizOnlyDue = onlyDue;
                const pool = onlyDue ? this.getDueItemsForDeck(deck) : deck.items;
                this.quizQueue = this.shuffleArray(pool);
                this.quizIndex = 0;
                this.quizScore = 0;
                this.quizAnswered = false;
                this.quizShowPronunciationTip = false;
                this.buildQuizOptions();
            }

            buildQuizOptions() {
                const deck = this.getActiveDeck();
                const current = this.quizQueue[this.quizIndex];
                if (!deck || !current) return;

                const allItems = deck.items.length >= 4 ? deck.items : [...deck.items, ...this.getDefaultDecks()[0].items];
                const distractors = this.shuffleArray(allItems.filter(i => i.id !== current.id)).slice(0, 3);
                this.quizOptions = this.shuffleArray([current, ...distractors]);
                this.quizSelectedId = null;
                this.quizAnswered = false;
                this.quizShowPronunciationTip = false;

                if (this.quizDirection === "en-to-vi") {
                    setTimeout(() => this.speakEnglish(current.collocation), 200);
                }
            }

            selectQuizOption(optionId) {
                if (this.quizAnswered) return;
                const deck = this.getActiveDeck();
                const current = this.quizQueue[this.quizIndex];
                if (!deck || !current) return;

                this.quizSelectedId = optionId;
                this.quizAnswered = true;
                const isCorrect = optionId === current.id;
                if (isCorrect) {
                    this.quizScore++;
                    this.updateItemSrsSchedule(deck.id, current.id, "advance");
                } else {
                    this.updateItemSrsSchedule(deck.id, current.id, "reset");
                }
                this.speakEnglish(current.collocation);
                this.render();
            }

            nextQuizQuestion() {
                const current = this.quizQueue[this.quizIndex];
                const advance = () => {
                    this.quizIndex++;
                    if (this.quizIndex < this.quizQueue.length) {
                        this.buildQuizOptions();
                    }
                    this.render();
                };
                if (current) {
                    this.speakEnglish(current.collocation, 0.95, advance);
                } else {
                    advance();
                }
            }

            renderQuizView() {
                const deck = this.getActiveDeck();
                if (!deck || deck.items.length === 0) return `<div class="bg-white rounded-3xl p-8 text-center">Bộ từ trống.</div>`;

                if (this.quizIndex >= this.quizQueue.length) {
                    return `
                        <div class="max-w-xl mx-auto bg-white rounded-3xl border border-pinky-200 p-8 text-center space-y-4 shadow-sm">
                            <h2 class="font-display font-extrabold text-2xl text-slate-900">Hoàn thành Trắc nghiệm!</h2>
                            <p class="text-lg font-extrabold text-pinky-600">Điểm số: ${this.quizScore} / ${this.quizQueue.length}</p>
                            <div class="flex justify-center gap-3 pt-2">
                                <button type="button" onclick="app.initQuiz(false); app.render()"
                                    class="px-5 py-3 rounded-2xl bg-pinky-600 text-white text-xs sm:text-sm font-bold cursor-pointer">
                                    Làm lại
                                </button>
                                <button type="button" onclick="app.openDeckHub('${deck.id}')"
                                    class="px-5 py-3 rounded-2xl bg-pinky-50 text-pinky-700 text-xs sm:text-sm font-bold cursor-pointer">
                                    Về trang bộ từ
                                </button>
                            </div>
                        </div>
                    `;
                }

                const current = this.quizQueue[this.quizIndex];
                const isEnToVi = this.quizDirection === "en-to-vi";

                return `
                    <div class="max-w-2xl mx-auto space-y-5">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <button type="button" onclick="app.openDeckHub('${deck.id}')" class="text-xs font-bold text-pinky-700 hover:underline flex items-center gap-1 cursor-pointer">
                                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> ${this.escapeHtml(deck.title)}
                            </button>
                            <div class="flex items-center gap-1.5 bg-white p-1 rounded-2xl border border-pinky-200">
                                <button type="button" onclick="app.quizDirection='en-to-vi'; app.buildQuizOptions(); app.render()"
                                    class="px-3 py-1 rounded-xl text-xs font-bold ${isEnToVi ? 'bg-pinky-600 text-white' : 'text-slate-600'} cursor-pointer">
                                    Anh → Việt
                                </button>
                                <button type="button" onclick="app.quizDirection='vi-to-en'; app.buildQuizOptions(); app.render()"
                                    class="px-3 py-1 rounded-xl text-xs font-bold ${!isEnToVi ? 'bg-pinky-600 text-white' : 'text-slate-600'} cursor-pointer">
                                    Việt → Anh
                                </button>
                            </div>
                        </div>

                        <div class="bg-white rounded-3xl border border-pinky-200 p-6 sm:p-8 shadow-sm space-y-5">
                            <div class="flex items-center justify-between text-xs font-bold text-slate-500">
                                <span>Câu ${this.quizIndex + 1} / ${this.quizQueue.length}</span>
                                <span>Đúng: ${this.quizScore}</span>
                            </div>

                            <div class="text-center space-y-3 py-2">
                                <h2 class="font-display font-extrabold text-xl sm:text-3xl text-slate-900">
                                    ${this.escapeHtml(isEnToVi ? current.collocation : current.meaningVi)}
                                </h2>
                                ${isEnToVi ? `
                                    <div class="flex justify-center gap-2">
                                        <button type="button" onclick="app.speakEnglish('${this.escapeJs(current.collocation)}')"
                                            class="px-3.5 py-1.5 rounded-xl bg-pinky-100 text-pinky-800 text-xs font-bold cursor-pointer">
                                            🔊 Nghe phát âm
                                        </button>
                                        <button type="button" onclick="app.togglePronunciationGuide('quiz')"
                                            class="px-3.5 py-1.5 rounded-xl bg-amber-100 text-amber-900 text-xs font-bold cursor-pointer">
                                            🗣️ Cách đọc
                                        </button>
                                    </div>
                                ` : ""}
                            </div>

                            ${this.quizShowPronunciationTip ? this.renderPronunciationGuideBox(current) : ""}

                            <div class="grid grid-cols-1 gap-2.5">
                                ${this.quizOptions.map(opt => {
                                    let btnClass = "bg-pinky-50/60 hover:bg-pinky-100 border-pinky-200 text-slate-800";
                                    if (this.quizAnswered) {
                                        if (opt.id === current.id) {
                                            btnClass = "bg-emerald-100 border-emerald-500 text-emerald-950 font-extrabold";
                                        } else if (opt.id === this.quizSelectedId) {
                                            btnClass = "bg-rose-100 border-rose-500 text-rose-950";
                                        } else {
                                            btnClass = "bg-slate-50 border-slate-200 text-slate-400";
                                        }
                                    }
                                    return `
                                        <button type="button" onclick="app.selectQuizOption('${opt.id}')"
                                            class="w-full p-4 rounded-2xl border text-left text-xs sm:text-sm font-semibold transition-all ${btnClass} cursor-pointer">
                                            ${this.escapeHtml(isEnToVi ? opt.meaningVi : opt.collocation)}
                                        </button>
                                    `;
                                }).join("")}
                            </div>

                            ${this.quizAnswered ? `
                                <div class="p-4 rounded-2xl bg-pinky-50 border border-pinky-200 space-y-2">
                                    <div class="flex items-center justify-between">
                                        <span class="text-xs font-extrabold text-pinky-800">💡 Gợi ý câu ví dụ thực tế:</span>
                                        <button type="button" onclick="app.speakEnglish('${this.escapeJs(current.exampleEn || current.collocation)}')"
                                            class="text-xs font-bold text-pinky-700 underline cursor-pointer">
                                            🔊 Nghe ví dụ
                                        </button>
                                    </div>
                                    <p class="text-xs sm:text-sm font-semibold text-slate-800">"${this.escapeHtml(current.exampleEn || current.collocation)}"</p>
                                    ${current.exampleVi ? `<p class="text-xs text-slate-600">${this.escapeHtml(current.exampleVi)}</p>` : ""}
                                    <div class="pt-2 flex justify-end">
                                        <button type="button" onclick="app.nextQuizQuestion()"
                                            class="px-5 py-2.5 rounded-2xl bg-pinky-600 hover:bg-pinky-700 text-white text-xs font-extrabold cursor-pointer">
                                            Câu tiếp theo →
                                        </button>
                                    </div>
                                </div>
                            ` : ""}
                        </div>
                    </div>
                `;
            }

            // =========================================================================
            // 5. TWO-WAY WRITING PRACTICE VIEW (VI -> EN & EN -> VI)
            // =========================================================================
            initWriting(onlyDue = false) {
                const deck = this.getActiveDeck();
                if (!deck) return;
                this.writeOnlyDue = onlyDue;
                const pool = onlyDue ? this.getDueItemsForDeck(deck) : deck.items;
                this.writeQueue = this.shuffleArray(pool);
                this.writeIndex = 0;
                this.writeScore = 0;
                this.writeAnswered = false;
                this.writeUserAnswer = "";
                this.writeFeedback = null;
                this.writeShowPronunciationTip = false;
                this.setWritingItemDirection();
            }

            setWritingItemDirection() {
                if (this.writeDirection === "mixed") {
                    this.currentItemDirection = Math.random() < 0.5 ? "vi-to-en" : "en-to-vi";
                } else {
                    this.currentItemDirection = this.writeDirection;
                }
                const current = this.writeQueue[this.writeIndex];
                if (current && this.currentItemDirection === "en-to-vi") {
                    setTimeout(() => this.speakEnglish(current.collocation), 200);
                }
            }

            async checkWritingAnswer() {
                if (this.writeAnswered || this.isCheckingWritingAI) return;
                const deck = this.getActiveDeck();
                const current = this.writeQueue[this.writeIndex];
                const input = document.getElementById("writing-answer-input");
                const ans = (input ? input.value : "").trim();
                if (!deck || !current || !ans) {
                    this.showToast("Vui lòng nhập câu trả lời của bạn!");
                    return;
                }

                this.writeUserAnswer = ans;
                const normUser = ans.toLowerCase().replace(/[.,!?]/g, "").trim();

                if (this.currentItemDirection === "vi-to-en") {
                    const normTarget = current.collocation.toLowerCase().replace(/[.,!?]/g, "").trim();
                    const isCorrect = normUser === normTarget;
                    this.writeAnswered = true;
                    if (isCorrect) {
                        this.writeScore++;
                        this.updateItemSrsSchedule(deck.id, current.id, "advance");
                    } else {
                        this.updateItemSrsSchedule(deck.id, current.id, "reset");
                    }
                    this.writeFeedback = {
                        isCorrect,
                        explanation: isCorrect
                            ? "Chính xác tuyệt đối! Bạn đã viết đúng cụm Collocation tiếng Anh."
                            : `Đáp án chuẩn là: "${current.collocation}".`
                    };
                    this.speakEnglish(current.collocation);
                    this.render();
                } else {
                    const normTargetVi = current.meaningVi.toLowerCase();
                    if (normTargetVi.includes(normUser) && normUser.length >= 3) {
                        this.writeAnswered = true;
                        this.writeScore++;
                        this.updateItemSrsSchedule(deck.id, current.id, "advance");
                        this.writeFeedback = {
                            isCorrect: true,
                            explanation: `Chính xác! Nghĩa đầy đủ: "${current.meaningVi}".`
                        };
                        this.speakEnglish(current.collocation);
                        this.render();
                        return;
                    }

                    this.isCheckingWritingAI = true;
                    this.render();
                    try {
                        const prompt = `Cụm từ tiếng Anh: "${current.collocation}". Nghĩa chuẩn: "${current.meaningVi}".
Người học dịch sang tiếng Việt là: "${ans}".
Hãy đánh giá xem bản dịch của người học có đúng nghĩa không (trả về JSON).`;
                        const raw = await callGeminiAPI({
                            contents: [{ role: "user", parts: [{ text: prompt }] }],
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    isCorrect: { type: "BOOLEAN" },
                                    explanation: { type: "STRING" }
                                },
                                required: ["isCorrect", "explanation"]
                            }
                        });
                        const res = JSON.parse(raw);
                        this.writeAnswered = true;
                        if (res.isCorrect) {
                            this.writeScore++;
                            this.updateItemSrsSchedule(deck.id, current.id, "advance");
                        } else {
                            this.updateItemSrsSchedule(deck.id, current.id, "reset");
                        }
                        this.writeFeedback = res;
                    } catch (_) {
                        this.writeAnswered = true;
                        this.writeFeedback = {
                            isCorrect: false,
                            explanation: `Nghĩa tham khảo chuẩn: "${current.meaningVi}".`
                        };
                    } finally {
                        this.isCheckingWritingAI = false;
                        this.speakEnglish(current.collocation);
                        this.render();
                    }
                }
            }

            nextWritingQuestion() {
                const current = this.writeQueue[this.writeIndex];
                const advance = () => {
                    this.writeIndex++;
                    this.writeAnswered = false;
                    this.writeUserAnswer = "";
                    this.writeFeedback = null;
                    this.writeShowPronunciationTip = false;
                    if (this.writeIndex < this.writeQueue.length) {
                        this.setWritingItemDirection();
                    }
                    this.render();
                };
                if (current) {
                    this.speakEnglish(current.collocation, 0.95, advance);
                } else {
                    advance();
                }
            }

            renderWritingView() {
                const deck = this.getActiveDeck();
                if (!deck || deck.items.length === 0) return `<div class="bg-white rounded-3xl p-8 text-center">Bộ từ trống.</div>`;

                if (this.writeIndex >= this.writeQueue.length) {
                    return `
                        <div class="max-w-xl mx-auto bg-white rounded-3xl border border-pinky-200 p-8 text-center space-y-4 shadow-sm">
                            <h2 class="font-display font-extrabold text-2xl text-slate-900">Hoàn thành Tập viết 2 chiều!</h2>
                            <p class="text-lg font-extrabold text-emerald-600">Đúng: ${this.writeScore} / ${this.writeQueue.length}</p>
                            <div class="flex justify-center gap-3 pt-2">
                                <button type="button" onclick="app.initWriting(false); app.render()"
                                    class="px-5 py-3 rounded-2xl bg-pinky-600 text-white text-xs sm:text-sm font-bold cursor-pointer">
                                    Luyện lại
                                </button>
                                <button type="button" onclick="app.openDeckHub('${deck.id}')"
                                    class="px-5 py-3 rounded-2xl bg-pinky-50 text-pinky-700 text-xs sm:text-sm font-bold cursor-pointer">
                                    Về trang bộ từ
                                </button>
                            </div>
                        </div>
                    `;
                }

                const current = this.writeQueue[this.writeIndex];
                const isViToEn = this.currentItemDirection === "vi-to-en";

                return `
                    <div class="max-w-2xl mx-auto space-y-5">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <button type="button" onclick="app.openDeckHub('${deck.id}')" class="text-xs font-bold text-pinky-700 hover:underline flex items-center gap-1 cursor-pointer">
                                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> ${this.escapeHtml(deck.title)}
                            </button>
                            <div class="flex items-center gap-1 bg-white p-1 rounded-2xl border border-pinky-200">
                                <button type="button" onclick="app.writeDirection='vi-to-en'; app.setWritingItemDirection(); app.render()"
                                    class="px-2.5 py-1 rounded-xl text-xs font-bold ${this.writeDirection === 'vi-to-en' ? 'bg-pinky-600 text-white' : 'text-slate-600'} cursor-pointer">
                                    Việt → Anh
                                </button>
                                <button type="button" onclick="app.writeDirection='en-to-vi'; app.setWritingItemDirection(); app.render()"
                                    class="px-2.5 py-1 rounded-xl text-xs font-bold ${this.writeDirection === 'en-to-vi' ? 'bg-pinky-600 text-white' : 'text-slate-600'} cursor-pointer">
                                    Anh → Việt
                                </button>
                                <button type="button" onclick="app.writeDirection='mixed'; app.setWritingItemDirection(); app.render()"
                                    class="px-2.5 py-1 rounded-xl text-xs font-bold ${this.writeDirection === 'mixed' ? 'bg-pinky-600 text-white' : 'text-slate-600'} cursor-pointer">
                                    Trộn 2 chiều
                                </button>
                            </div>
                        </div>

                        <div class="bg-white rounded-3xl border border-pinky-200 p-6 sm:p-8 shadow-sm space-y-5">
                            <div class="flex items-center justify-between text-xs font-bold text-slate-500">
                                <span>Câu ${this.writeIndex + 1} / ${this.writeQueue.length} • ${isViToEn ? "Viết sang Tiếng Anh" : "Dịch sang Tiếng Việt"}</span>
                                <span>Điểm: ${this.writeScore}</span>
                            </div>

                            <div class="text-center space-y-2 py-2">
                                <h2 class="font-display font-extrabold text-xl sm:text-3xl text-slate-900">
                                    ${this.escapeHtml(isViToEn ? current.meaningVi : current.collocation)}
                                </h2>
                                ${!isViToEn ? `
                                    <div class="flex justify-center gap-2 pt-1">
                                        <button type="button" onclick="app.speakEnglish('${this.escapeJs(current.collocation)}')"
                                            class="px-3.5 py-1.5 rounded-xl bg-pinky-100 text-pinky-800 text-xs font-bold cursor-pointer">
                                            🔊 Nghe phát âm
                                        </button>
                                        <button type="button" onclick="app.togglePronunciationGuide('write')"
                                            class="px-3.5 py-1.5 rounded-xl bg-amber-100 text-amber-900 text-xs font-bold cursor-pointer">
                                            🗣️ Cách đọc
                                        </button>
                                    </div>
                                ` : ""}
                            </div>

                            ${this.writeShowPronunciationTip ? this.renderPronunciationGuideBox(current) : ""}

                            <div class="space-y-3">
                                <input id="writing-answer-input" type="text"
                                    value="${this.escapeHtml(this.writeUserAnswer)}"
                                    ${this.writeAnswered ? "disabled" : ""}
                                    onkeydown="if(event.key==='Enter'){ event.preventDefault(); ${this.writeAnswered ? 'app.nextWritingQuestion()' : 'app.checkWritingAnswer()'}; }"
                                    placeholder="${isViToEn ? 'Nhập cụm Collocation tiếng Anh...' : 'Nhập nghĩa tiếng Việt...'}"
                                    class="w-full px-4 py-3.5 rounded-2xl border border-pinky-200 focus:border-pinky-500 text-sm sm:text-base font-semibold outline-hidden">

                                ${!this.writeAnswered ? `
                                    <button type="button" onclick="app.checkWritingAnswer()" ${this.isCheckingWritingAI ? "disabled" : ""}
                                        class="w-full py-3.5 rounded-2xl bg-pinky-600 hover:bg-pinky-700 text-white text-xs sm:text-sm font-extrabold cursor-pointer">
                                        ${this.isCheckingWritingAI ? "AI đang chấm nghĩa tiếng Việt..." : "Kiểm tra đáp án"}
                                    </button>
                                ` : `
                                    <div class="p-4 rounded-2xl ${this.writeFeedback?.isCorrect ? 'bg-emerald-50 border border-emerald-200 text-emerald-900' : 'bg-rose-50 border border-rose-200 text-rose-900'} space-y-2">
                                        <div class="font-extrabold text-sm">
                                            ${this.writeFeedback?.isCorrect ? "✅ Chính xác!" : "❌ Chưa đúng rồi!"}
                                        </div>
                                        <p class="text-xs sm:text-sm">${this.escapeHtml(this.writeFeedback?.explanation || "")}</p>
                                        ${current.exampleEn ? `
                                            <div class="pt-2 border-t border-black/10 text-xs">
                                                <span class="font-bold">Ví dụ:</span> "${this.escapeHtml(current.exampleEn)}"
                                            </div>
                                        ` : ""}
                                        <div class="pt-2 flex justify-end">
                                            <button type="button" onclick="app.nextWritingQuestion()"
                                                class="px-5 py-2.5 rounded-2xl bg-slate-900 text-white text-xs font-extrabold cursor-pointer">
                                                Tiếp theo →
                                            </button>
                                        </div>
                                    </div>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            }

            // =========================================================================
            // 6. AI SPEAKING TUTOR VIEW (CONTINUOUS MANUAL-STOP MIC + IELTS 6.5-7.5+)
            // =========================================================================
            initSpeechRecognition() {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) return;

                this.recognition = new SpeechRec();
                this.recognition.lang = "en-US";
                this.recognition.continuous = true;
                this.recognition.interimResults = true;

                this.recognition.onresult = (event) => {
                    let interim = "";
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            this.finalTranscriptBuffer += (this.finalTranscriptBuffer ? " " : "") + transcript.trim();
                        } else {
                            interim += transcript;
                        }
                    }
                    const input = document.getElementById("speaking-user-input");
                    if (input) {
                        input.value = (this.finalTranscriptBuffer + (interim ? " " + interim : "")).trim();
                    }
                };

                this.recognition.onend = () => {
                    if (this.isRecording) {
                        try {
                            this.recognition.start();
                        } catch (_) {}
                    }
                };
            }

            toggleRecording() {
                if (this.isRecording) {
                    this.stopRecording();
                } else {
                    this.startRecording();
                }
            }

            startRecording() {
                if (!this.recognition) {
                    this.showToast("Trình duyệt này chưa hỗ trợ thu âm giọng nói. Hãy dùng Google Chrome!");
                    return;
                }
                const input = document.getElementById("speaking-user-input");
                this.finalTranscriptBuffer = input ? input.value.trim() : "";
                this.isRecording = true;
                this.recordingSeconds = 0;

                try {
                    this.recognition.start();
                } catch (_) {}

                this.recordingTimer = setInterval(() => {
                    this.recordingSeconds++;
                    const timerEl = document.getElementById("recording-timer-text");
                    if (timerEl) {
                        const mins = String(Math.floor(this.recordingSeconds / 60)).padStart(2, "0");
                        const secs = String(this.recordingSeconds % 60).padStart(2, "0");
                        timerEl.textContent = `${mins}:${secs}`;
                    }
                }, 1000);

                this.render();
            }

            stopRecording() {
                if (!this.isRecording) return;
                this.isRecording = false;
                if (this.recordingTimer) {
                    clearInterval(this.recordingTimer);
                    this.recordingTimer = null;
                }
                if (this.recognition) {
                    try {
                        this.recognition.stop();
                    } catch (_) {}
                }
                this.render();
            }

            async initSpeakingSession() {
                const deck = this.getActiveDeck();
                if (!deck || deck.items.length === 0) return;

                this.stopRecording();
                const picked = this.shuffleArray(deck.items).slice(0, 2);
                this.targetSpeakingCollocations = picked.map(i => i.collocation);
                this.speakingMessages = [];
                this.isSpeakingLoading = true;
                this.render();

                const fallbackQuestion = `Can you tell me about a recent situation where you had to ${this.targetSpeakingCollocations[0]}?`;

                try {
                    const prompt = `Bạn là giám khảo luyện nói tiếng Anh thân thiện. Hãy đặt 1 câu hỏi giao tiếp hoặc IELTS Speaking Part 1/2 ngắn gọn, tự nhiên bằng tiếng Anh để người học có cơ hội sử dụng 1 hoặc cả 2 cụm từ chỉ định sau:
- "${this.targetSpeakingCollocations.join('"\n- "')}"
Chỉ trả về câu hỏi tiếng Anh (1-2 câu).`;
                    const question = await callGeminiAPI({
                        contents: [{ role: "user", parts: [{ text: prompt }] }]
                    });
                    this.speakingMessages.push({
                        role: "ai",
                        questionEn: question.trim()
                    });
                    this.speakEnglish(question.trim());
                } catch (_) {
                    this.speakingMessages.push({
                        role: "ai",
                        questionEn: fallbackQuestion
                    });
                    this.speakEnglish(fallbackQuestion);
                } finally {
                    this.isSpeakingLoading = false;
                    this.render();
                }
            }

            async sendSpeakingReply() {
                if (this.isRecording) this.stopRecording();
                const input = document.getElementById("speaking-user-input");
                const userText = (input ? input.value : "").trim();
                if (!userText || this.isSpeakingLoading) {
                    this.showToast("Hãy nói hoặc nhập câu trả lời tiếng Anh của bạn!");
                    return;
                }

                const lastAiMsg = [...this.speakingMessages].reverse().find(m => m.role === "ai");
                const questionAsked = lastAiMsg ? lastAiMsg.questionEn : "";

                this.speakingMessages.push({
                    role: "user",
                    text: userText
                });
                this.finalTranscriptBuffer = "";
                this.isSpeakingLoading = true;
                this.render();

                try {
                    const prompt = `Câu hỏi AI đã hỏi: "${questionAsked}"
Các cụm Collocation chỉ định cần luyện: ${this.targetSpeakingCollocations.map(c => `"${c}"`).join(", ")}
Câu trả lời của học viên: "${userText}"

Hãy phản hồi bằng JSON gồm:
1. "usedTargets": mảng các cụm từ chỉ định học viên đã dùng được.
2. "correctedSentence": sửa lại chính xác lỗi ngữ pháp/từ vựng ngay trên câu của học viên sao cho tự nhiên.
3. "correctionNoteVi": giải thích ngắn gọn bằng tiếng Việt những chỗ đã sửa.
4. "upgradedBandSentence": viết lại ý của học viên lên trình độ IELTS Band 6.5 - 7.5+ (tự nhiên, mạch lạc, có dùng khéo léo cụm từ chỉ định).
5. "upgradeNoteVi": phân tích bằng tiếng Việt các từ vựng/cấu trúc ăn điểm trong câu Band 6.5 - 7.5+.
6. "nextQuestionEn": đặt 1 câu hỏi tiếp theo bằng tiếng Anh để tiếp tục hội thoại.`;

                    const raw = await callGeminiAPI({
                        contents: [{ role: "user", parts: [{ text: prompt }] }],
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                usedTargets: { type: "ARRAY", items: { type: "STRING" } },
                                correctedSentence: { type: "STRING" },
                                correctionNoteVi: { type: "STRING" },
                                upgradedBandSentence: { type: "STRING" },
                                upgradeNoteVi: { type: "STRING" },
                                nextQuestionEn: { type: "STRING" }
                            },
                            required: ["usedTargets", "correctedSentence", "correctionNoteVi", "upgradedBandSentence", "upgradeNoteVi", "nextQuestionEn"]
                        }
                    });

                    const feedback = JSON.parse(raw);
                    this.speakingMessages.push({
                        role: "ai",
                        feedback,
                        questionEn: feedback.nextQuestionEn
                    });
                    this.speakEnglish(feedback.nextQuestionEn);
                } catch (err) {
                    this.speakingMessages.push({
                        role: "ai",
                        questionEn: `That's interesting! Could you give me another example using "${this.targetSpeakingCollocations[0]}"?`,
                        errorNote: `Không kết nối được AI để chấm chi tiết (${err.message}). Hãy kiểm tra nút API Key góc trên!`
                    });
                } finally {
                    this.isSpeakingLoading = false;
                    this.render();
                }
            }

            renderSpeakingView() {
                const deck = this.getActiveDeck();
                if (!deck) return "";

                const mins = String(Math.floor(this.recordingSeconds / 60)).padStart(2, "0");
                const secs = String(this.recordingSeconds % 60).padStart(2, "0");

                return `
                    <div class="max-w-4xl mx-auto space-y-5">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <button type="button" onclick="app.openDeckHub('${deck.id}')" class="text-xs font-bold text-pinky-700 hover:underline flex items-center gap-1 cursor-pointer">
                                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> ${this.escapeHtml(deck.title)}
                            </button>
                            <button type="button" onclick="app.initSpeakingSession()"
                                class="px-3.5 py-2 rounded-2xl bg-pinky-100 hover:bg-pinky-200 text-pinky-800 text-xs font-extrabold cursor-pointer">
                                🔄 Đổi từ chỉ định &amp; Câu hỏi mới
                            </button>
                        </div>

                        <!-- Target Collocations Banner -->
                        <div class="bg-white rounded-3xl border border-pinky-200 p-5 shadow-2xs flex flex-wrap items-center justify-between gap-3">
                            <div>
                                <div class="text-xs font-extrabold text-pinky-700">🎯 Thử thách dùng Collocation chỉ định khi nói:</div>
                                <div class="flex flex-wrap gap-2 mt-2">
                                    ${this.targetSpeakingCollocations.map(col => `
                                        <span class="px-3 py-1.5 rounded-2xl bg-pinky-50 border border-pinky-200 text-xs sm:text-sm font-extrabold text-pinky-900">
                                            ${this.escapeHtml(col)}
                                        </span>
                                    `).join("")}
                                </div>
                            </div>
                        </div>

                        <!-- Chat & Feedback Feed -->
                        <div class="bg-white rounded-3xl border border-pinky-200 p-5 sm:p-6 shadow-sm space-y-4 min-h-[300px]">
                            ${this.speakingMessages.map(msg => {
                                if (msg.role === "user") {
                                    return `
                                        <div class="flex justify-end">
                                            <div class="max-w-xl p-4 rounded-3xl rounded-br-md bg-pinky-600 text-white text-xs sm:text-sm leading-relaxed">
                                                ${this.escapeHtml(msg.text)}
                                            </div>
                                        </div>
                                    `;
                                }
                                return `
                                    <div class="space-y-3">
                                        ${msg.feedback ? `
                                            <div class="p-4 sm:p-5 rounded-3xl bg-pinky-50/70 border border-pinky-200 space-y-3">
                                                <!-- Sentence Correction -->
                                                <div class="p-3.5 rounded-2xl bg-white border border-pinky-100 space-y-1.5">
                                                    <div class="flex items-center justify-between">
                                                        <span class="text-xs font-extrabold text-slate-800">✍️ Sửa lỗi câu của bạn:</span>
                                                        <button type="button" onclick="app.speakEnglish('${this.escapeJs(msg.feedback.correctedSentence)}')"
                                                            class="text-xs font-bold text-pinky-600 cursor-pointer">🔊 Nghe</button>
                                                    </div>
                                                    <p class="text-xs sm:text-sm font-bold text-slate-900">${this.escapeHtml(msg.feedback.correctedSentence)}</p>
                                                    <p class="text-xs text-slate-600">${this.escapeHtml(msg.feedback.correctionNoteVi)}</p>
                                                </div>

                                                <!-- Band 6.5 - 7.5+ Upgrade -->
                                                <div class="p-3.5 rounded-2xl bg-gradient-to-r from-amber-50 to-pinky-50 border border-amber-200 space-y-1.5">
                                                    <div class="flex items-center justify-between">
                                                        <span class="text-xs font-extrabold text-amber-900">🚀 Gợi ý nâng cấp chuẩn IELTS Band 6.5 – 7.5+:</span>
                                                        <button type="button" onclick="app.speakEnglish('${this.escapeJs(msg.feedback.upgradedBandSentence)}')"
                                                            class="px-2.5 py-1 rounded-xl bg-amber-600 text-white text-[11px] font-bold cursor-pointer">🔊 Nghe mẫu Band 7.0+</button>
                                                    </div>
                                                    <p class="text-xs sm:text-sm font-extrabold text-slate-900">${this.escapeHtml(msg.feedback.upgradedBandSentence)}</p>
                                                    <p class="text-xs text-amber-900">${this.escapeHtml(msg.feedback.upgradeNoteVi)}</p>
                                                </div>
                                            </div>
                                        ` : ""}

                                        ${msg.errorNote ? `<p class="text-xs text-rose-600 font-semibold">${this.escapeHtml(msg.errorNote)}</p>` : ""}

                                        ${msg.questionEn ? `
                                            <div class="flex items-start gap-2.5 max-w-2xl">
                                                <div class="w-8 h-8 rounded-2xl bg-pinky-100 text-pinky-700 flex items-center justify-center shrink-0 mt-1">
                                                    <i data-lucide="bot" class="w-4 h-4"></i>
                                                </div>
                                                <div class="p-4 rounded-3xl rounded-tl-md bg-slate-100 text-slate-900 text-xs sm:text-sm space-y-2">
                                                    <p class="font-semibold">${this.escapeHtml(msg.questionEn)}</p>
                                                    <button type="button" onclick="app.speakEnglish('${this.escapeJs(msg.questionEn)}')"
                                                        class="text-xs font-bold text-pinky-700 hover:underline cursor-pointer">
                                                        🔊 Nghe lại câu hỏi
                                                    </button>
                                                </div>
                                            </div>
                                        ` : ""}
                                    </div>
                                `;
                            }).join("")}

                            ${this.isSpeakingLoading ? `
                                <div class="text-xs font-bold text-pinky-600 animate-pulse">
                                    ⏳ AI đang phân tích câu nói &amp; gợi ý nâng cấp Band 6.5 - 7.5+...
                                </div>
                            ` : ""}
                        </div>

                        <!-- Continuous Manual-Stop Voice Recorder & Text Box -->
                        <div class="bg-white rounded-3xl border border-pinky-200 p-5 shadow-sm space-y-3">
                            ${this.isRecording ? `
                                <div class="p-3.5 rounded-2xl bg-rose-50 border border-rose-200 flex items-center justify-between gap-3">
                                    <div class="flex items-center gap-3">
                                        <span class="w-3 h-3 rounded-full bg-rose-600 animate-ping"></span>
                                        <span class="text-xs sm:text-sm font-extrabold text-rose-800">
                                            Đang ghi âm liên tục... (<span id="recording-timer-text">${mins}:${secs}</span>) — Chỉ dừng khi bạn ấn nút Dừng!
                                        </span>
                                    </div>
                                    <button type="button" onclick="app.stopRecording()"
                                        class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-extrabold cursor-pointer">
                                        ⏹ Dừng ghi âm
                                    </button>
                                </div>
                            ` : ""}

                            <textarea id="speaking-user-input" rows="3"
                                placeholder="Bấm nút Bắt đầu nói (Micro) để ghi âm dài không giới hạn thời gian, hoặc gõ câu trả lời của bạn tại đây..."
                                class="w-full p-3.5 rounded-2xl border border-pinky-200 focus:border-pinky-500 text-xs sm:text-sm outline-hidden"></textarea>

                            <div class="flex flex-wrap items-center justify-between gap-2">
                                <button type="button" onclick="app.toggleRecording()"
                                    class="px-4 py-3 rounded-2xl ${this.isRecording ? 'bg-rose-600 text-white mic-pulse' : 'bg-pinky-100 hover:bg-pinky-200 text-pinky-900'} text-xs sm:text-sm font-extrabold flex items-center gap-2 cursor-pointer">
                                    <i data-lucide="${this.isRecording ? 'square' : 'mic'}" class="w-4 h-4"></i>
                                    <span>${this.isRecording ? "Dừng ghi âm" : "🎙️ Bắt đầu nói (Ấn dừng mới tắt)"}</span>
                                </button>

                                <button type="button" onclick="app.sendSpeakingReply()" ${this.isSpeakingLoading ? "disabled" : ""}
                                    class="px-5 py-3 rounded-2xl bg-pinky-600 hover:bg-pinky-700 disabled:opacity-60 text-white text-xs sm:text-sm font-extrabold flex items-center gap-2 cursor-pointer">
                                    <span>Gửi &amp; Nâng Band 6.5 - 7.5+</span>
                                    <i data-lucide="send" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // =========================================================================
            // MASTER RENDER & UTILITIES
            // =========================================================================
            renderNavigation() {
                const navEl = document.getElementById("nav-tabs");
                const selectEl = document.getElementById("active-deck-select");
                const totalDue = this.getTotalDueAcrossAllDecks();

                if (selectEl) {
                    selectEl.innerHTML = (this.state.decks || []).map(d => `
                        <option value="${d.id}" ${d.id === this.state.activeDeckId ? "selected" : ""}>
                            ${this.escapeHtml(d.title)} (${d.items.length})
                        </option>
                    `).join("");
                }

                if (navEl) {
                    const tabs = [
                        { id: "home", label: "🏠 Trang chủ" },
                        { id: "creator", label: "✨ Tạo bộ từ & File" },
                        { id: "srs", label: `🔔 Lịch ôn (1-2-5-10d)${totalDue > 0 ? ` (${totalDue})` : ""}` },
                        { id: "flashcards", label: "🗂️ Flashcards" },
                        { id: "quiz", label: "📝 Trắc nghiệm" },
                        { id: "writing", label: "✍️ Tập viết 2 chiều" },
                        { id: "speaking", label: "🎙️ Luyện nói AI" }
                    ];

                    navEl.innerHTML = tabs.map(t => {
                        const active = this.currentTab === t.id || (t.id === "home" && this.currentTab === "deck-hub");
                        return `
                            <button type="button" onclick="app.switchTab('${t.id}')"
                                class="px-3.5 py-2 rounded-2xl text-xs font-extrabold transition-all cursor-pointer ${active ? 'bg-pinky-600 text-white shadow-2xs' : 'text-slate-600 hover:bg-pinky-50 hover:text-pinky-700'}">
                                ${t.label}
                            </button>
                        `;
                    }).join("");
                }
            }

            render() {
                this.renderNavigation();
                const mainEl = document.getElementById("app-main");
                if (!mainEl) return;

                switch (this.currentTab) {
                    case "creator":
                        mainEl.innerHTML = this.renderCreatorView();
                        break;
                    case "srs":
                        mainEl.innerHTML = this.renderSrsScheduleView();
                        break;
                    case "flashcards":
                        mainEl.innerHTML = this.renderFlashcardsView();
                        break;
                    case "quiz":
                        mainEl.innerHTML = this.renderQuizView();
                        break;
                    case "writing":
                        mainEl.innerHTML = this.renderWritingView();
                        break;
                    case "speaking":
                        mainEl.innerHTML = this.renderSpeakingView();
                        break;
                    case "deck-hub":
                        mainEl.innerHTML = this.renderDeckHubView();
                        break;
                    case "home":
                    default:
                        mainEl.innerHTML = this.renderHomeView();
                        break;
                }

                if (window.lucide) {
                    lucide.createIcons();
                }
            }

            showToast(message) {
                const container = document.getElementById("toast-container");
                if (!container) return;
                const toast = document.createElement("div");
                toast.className = "bg-slate-900/95 text-white text-xs sm:text-sm font-medium px-4 py-3 rounded-2xl shadow-lg border border-pinky-400/30 transition-opacity duration-300";
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.classList.add("opacity-0");
                    setTimeout(() => toast.remove(), 300);
                }, 3200);
            }

            shuffleArray(arr) {
                const copy = [...arr];
                for (let i = copy.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            escapeHtml(str) {
                return String(str ?? "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            escapeJs(str) {
                return String(str ?? "")
                    .replace(/\\/g, "\\\\")
                    .replace(/'/g, "\\'")
                    .replace(/\n/g, " ");
            }
        }

        // Boot Application
        const app = new TlingEnglishApp();
        window.app = app;
    </script>
</body>
</html>
