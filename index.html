<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TlingEnglish — Học Từ Vựng & Collocation Thông Minh Với AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        pinky: {
                            50: '#FDF2F8',
                            100: '#FCE7F3',
                            200: '#FBCFE8',
                            300: '#F9A8D4',
                            400: '#F472B6',
                            500: '#EC4899',
                            600: '#DB2777',
                            700: '#BE185D',
                            800: '#9D174D',
                            900: '#831843',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #FFF5F8 0%, #FFFFFF 48%, #FDF2F8 100%);
            min-height: 100vh;
            color: #1F2937;
            overflow-x: hidden;
        }
        /* 3D Flashcard Flip Mechanics */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FDF2F8;
        }
        ::-webkit-scrollbar-thumb {
            background: #F9A8D4;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #F472B6;
        }
        /* Pulse animation for recording mic */
        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.55); }
            70% { box-shadow: 0 0 0 16px rgba(225, 29, 72, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }
        .mic-pulse {
            animation: micPulse 1.5s infinite;
        }
        /* Soundwave bars */
        @keyframes waveBar {
            0%, 100% { height: 6px; }
            50% { height: 22px; }
        }
        .wave-bar {
            animation: waveBar 0.9s ease-in-out infinite;
        }
    </style>
</head>
<body class="antialiased selection:bg-pinky-200 selection:text-pinky-900">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 bg-white/85 backdrop-blur-md border-b border-pinky-100 shadow-2xs">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
            <!-- Brand Logo (Click to go Home) -->
            <button type="button" onclick="app.goHome()" class="flex items-center gap-2.5 shrink-0 text-left group cursor-pointer focus:outline-hidden">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-pinky-400 to-pinky-600 flex items-center justify-center text-white shadow-sm shadow-pinky-200 group-hover:scale-105 transition-transform">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </div>
                <div>
                    <span class="font-display font-extrabold text-xl tracking-tight bg-gradient-to-r from-pinky-600 to-rose-500 bg-clip-text text-transparent">
                        TlingEnglish
                    </span>
                    <span class="hidden sm:block text-[11px] font-medium text-pinky-500 -mt-1">
                        Collocation &amp; AI Speaking Studio
                    </span>
                </div>
            </button>

            <!-- Active Deck Selector -->
            <div class="flex items-center gap-2 sm:gap-2.5 flex-1 justify-end min-w-0">
                <div class="relative flex-1 max-w-[240px]">
                    <select id="active-deck-select" onchange="app.selectDeck(this.value, true)"
                        class="w-full appearance-none bg-pinky-50/90 hover:bg-pinky-100/80 border border-pinky-200 text-pinky-900 text-xs sm:text-sm font-semibold rounded-2xl pl-3.5 pr-8 py-2 focus:outline-hidden focus:ring-2 focus:ring-pinky-400 transition-all cursor-pointer truncate">
                    </select>
                    <i data-lucide="chevron-down" class="w-4 h-4 text-pinky-500 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                </div>
            </div>
        </div>

        <!-- Mode Navigation Bar -->
        <nav class="bg-white/95 border-t border-pinky-50 overflow-x-auto">
            <div id="nav-tabs" class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center gap-1.5 py-2 whitespace-nowrap">
                <!-- Populated dynamically by JS -->
            </div>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main id="app-main" class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8 pb-20">
        <!-- Active view rendered here -->
    </main>

    <!-- Floating Toast Notification -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <script>
        // =========================================================================
        // GEMINI API HELPER WITH EXPONENTIAL BACKOFF
        // =========================================================================
        const apiKey = "AQ.Ab8RN6KVtge803BnpV_2RGcVv9qrc8YRrFr_jbvvVaocR0-tIg";
        const GEMINI_MODEL = "gemini-3-flash-preview";

        async function callGeminiAPI({ contents, systemInstruction = "", responseSchema = null }) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
            const payload = { contents };

            if (systemInstruction) {
                payload.systemInstruction = { parts: [{ text: systemInstruction }] };
            }
            if (responseSchema) {
                payload.generationConfig = {
                    responseMimeType: "application/json",
                    responseSchema: responseSchema
                };
            }

            const delays = [1000, 2000, 4000, 8000];
            let lastError = null;

            for (let attempt = 0; attempt <= delays.length; attempt++) {
                try {
                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errText}`);
                    }

                    const data = await response.json();
                    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) {
                        throw new Error("Empty response from Gemini");
                    }
                    return text;
                } catch (err) {
                    lastError = err;
                    if (attempt < delays.length) {
                        await new Promise(res => setTimeout(res, delays[attempt]));
                    }
                }
            }
            throw lastError;
        }

        // =========================================================================
        // SPACED REPETITION INTERVALS (1 -> 2 -> 5 -> 10 -> 20 DAYS)
        // =========================================================================
        const SRS_INTERVALS_DAYS = [1, 2, 5, 10, 20];
        const DAY_MS = 24 * 60 * 60 * 1000;

        // =========================================================================
        // APPLICATION STATE & CONTROLLER
        // =========================================================================
        class TlingEnglishApp {
            constructor() {
                this.STORAGE_KEY = "tling_english_decks_v1";
                this.state = this.loadState();
                this.currentTab = "home"; // 'home' | 'deck-hub' | 'creator' | 'srs' | 'flashcards' | 'quiz' | 'writing' | 'speaking'
                this.rawWordsInput = "";
                this.newDeckTitleInput = "";
                this.stagedCollocations = [];
                this.isGeneratingAI = false;

                // Flashcard state
                this.fcQueue = [];
                this.fcIndex = 0;
                this.fcFlipped = false;
                this.fcOnlyDue = false;
                this.fcShowPronunciationTip = false;
                this.fcLastDirectionHint = null;

                // Quiz state
                this.quizQueue = [];
                this.quizIndex = 0;
                this.quizScore = 0;
                this.quizAnswered = false;
                this.quizOptions = [];
                this.quizDirection = "en-to-vi";
                this.quizOnlyDue = false;
                this.quizShowPronunciationTip = false;

                // Writing state
                this.writeQueue = [];
                this.writeIndex = 0;
                this.writeScore = 0;
                this.writeAnswered = false;
                this.writeDirection = "vi-to-en";
                this.currentItemDirection = "vi-to-en";
                this.isCheckingWritingAI = false;
                this.writeOnlyDue = false;
                this.writeShowPronunciationTip = false;
                this.writeLastResult = null;

                // AI Speaking Tutor state
                this.speakingMessages = [];
                this.targetSpeakingCollocations = [];
                this.isSpeakingLoading = false;
                this.isRecording = false;
                this.recognition = null;
                this.recordingSeconds = 0;
                this.recordingTimer = null;
                this.finalTranscriptBuffer = "";

                this.initSpeechRecognition();
                this.initKeyboardShortcuts();
                this.render();
            }

            // =========================================================================
            // DATA STORAGE & DEFAULT SAMPLE DECKS
            // =========================================================================
            getDefaultDecks() {
                const now = Date.now();
                return [
                    {
                        id: "deck-sample-ielts",
                        title: "IELTS Speaking & Writing Collocations",
                        createdAt: new Date().toISOString().split("T")[0],
                        items: [
                            {
                                id: "col-1",
                                rootWord: "decision",
                                collocation: "make a crucial decision",
                                ipa: "/meɪk ə ˈkruːʃl dɪˈsɪʒn/",
                                meaningVi: "đưa ra một quyết định mang tính bước ngoặt",
                                exampleEn: "Graduating from university forced me to make a crucial decision about my future career.",
                                exampleVi: "Việc tốt nghiệp đại học buộc tôi phải đưa ra một quyết định quan trọng về sự nghiệp tương lai.",
                                mastery: 0,
                                srsStep: 0,
                                nextReviewAt: now
                            },
                            {
                                id: "col-2",
                                rootWord: "role",
                                collocation: "play a vital role in",
                                ipa: "/pleɪ ə ˈvaɪtl rəʊl ɪn/",
                                meaningVi: "đóng một vai trò thiết yếu trong việc gì",
                                exampleEn: "Technology plays a vital role in modern education and remote collaboration.",
                                exampleVi: "Công nghệ đóng một vai trò thiết yếu trong giáo dục hiện đại và làm việc từ xa.",
                                mastery: 0,
                                srsStep: 0,
                                nextReviewAt: now
                            },
                            {
                                id: "col-3",
                                rootWord: "awareness",
                                collocation: "raise public awareness of",
                                ipa: "/reɪz ˈpʌblɪk əˈweənəs əv/",
                                meaningVi: "nâng cao nhận thức cộng đồng về",
                                exampleEn: "Social media campaigns can effectively raise public awareness of environmental protection.",
                                exampleVi: "Các chiến dịch mạng xã hội có thể nâng cao nhận thức cộng đồng một cách hiệu quả về bảo vệ môi trường.",
                                mastery: 0,
                                srsStep: 0,
                                nextReviewAt: now
                            },
                            {
                                id: "col-4",
                                rootWord: "effort",
                                collocation: "make a concerted effort",
                                ipa: "/meɪk ə kənˈsɜːtɪd ˈefət/",
                                meaningVi: "nỗ lực hết mình / chung sức đồng lòng",
                                exampleEn: "Governments and citizens must make a concerted effort to reduce plastic waste.",
                                exampleVi: "Chính phủ và người dân phải nỗ lực chung tay để giảm thiểu rác thải nhựa.",
                                mastery: 0,
                                srsStep: 0,
                                nextReviewAt: now
                            }
                        ]
                    }
                ];
            }

            loadState() {
                try {
                    const raw = localStorage.getItem(this.STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed && Array.isArray(parsed.decks)) {
                            parsed.decks = parsed.decks.map(deck => ({
                                ...deck,
                                items: (deck.items || []).map(item => this.normalizeSrsItem(item))
                            }));
                            return parsed;
                        }
                    }
                } catch (e) {
                    console.warn("Failed to load state:", e);
                }
                const defaults = this.getDefaultDecks();
                return {
                    decks: defaults,
                    activeDeckId: defaults[0]?.id || null
                };
            }

            saveState() {
                try {
                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.state));
                } catch (e) {
                    console.warn("Could not save state:", e);
                }
            }

            // =========================================================================
            // NAVIGATION, DECK MANAGEMENT & DELETE MODAL
            // =========================================================================
            getActiveDeck() {
                if (!this.state.decks || this.state.decks.length === 0) return null;
                let found = this.state.decks.find(d => d.id === this.state.activeDeckId);
                if (!found) {
                    found = this.state.decks[0];
                    this.state.activeDeckId = found.id;
                }
                return found;
            }

            goHome() {
                this.stopRecording();
                this.currentTab = "home";
                this.render();
            }

            selectDeck(deckId, openHub = false) {
                this.stopRecording();
                this.state.activeDeckId = deckId;
                this.saveState();
                this.fcQueue = [];
                this.quizQueue = [];
                this.writeQueue = [];
                this.speakingMessages = [];
                if (openHub) {
                    this.currentTab = "deck-hub";
                }
                this.render();
            }

            openDeckHub(deckId) {
                this.stopRecording();
                this.state.activeDeckId = deckId;
                this.saveState();
                this.currentTab = "deck-hub";
                this.render();
            }

            switchTab(tabId) {
                this.stopRecording();
                this.currentTab = tabId;
                if (tabId === "flashcards" && this.fcQueue.length === 0) {
                    this.initFlashcards(false);
                } else if (tabId === "quiz" && this.quizQueue.length === 0) {
                    this.initQuiz(false);
                } else if (tabId === "writing" && this.writeQueue.length === 0) {
                    this.initWriting(false);
                } else if (tabId === "speaking" && this.speakingMessages.length === 0) {
                    this.initSpeakingSession();
                }
                this.render();
            }

            deleteDeck(deckId) {
                const deck = this.state.decks.find(d => d.id === deckId);
                if (!deck) return;

                const container = document.getElementById("modal-container");
                if (!container) return;

                container.innerHTML = `
                    <div class="fixed inset-0 z-50 bg-slate-900/45 backdrop-blur-xs flex items-center justify-center p-4">
                        <div class="bg-white rounded-3xl border border-pinky-200 max-w-md w-full p-6 shadow-xl space-y-4">
                            <div class="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center">
                                <i data-lucide="trash-2" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h3 class="font-display font-extrabold text-lg text-slate-900">Xóa file từ vựng này?</h3>
                                <p class="text-xs sm:text-sm text-slate-500 mt-1">
                                    Bạn có chắc muốn xóa bộ <strong>"${this.escapeHtml(deck.title)}"</strong> (${deck.items.length} cụm từ)? Hành động này không thể hoàn tác.
                                </p>
                            </div>
                            <div class="flex items-center justify-end gap-2 pt-2">
                                <button type="button" onclick="app.closeModal()"
                                    class="px-4 py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold">
                                    Hủy bỏ
                                </button>
                                <button type="button" onclick="app.confirmDeleteDeck('${deck.id}')"
                                    class="px-4 py-2.5 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold">
                                    Xác nhận xóa
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                if (window.lucide) lucide.createIcons();
            }

            confirmDeleteDeck(deckId) {
                this.state.decks = this.state.decks.filter(d => d.id !== deckId);
                if (this.state.activeDeckId === deckId) {
                    this.state.activeDeckId = this.state.decks[0]?.id || null;
                }
                this.saveState();
                this.closeModal();
                this.currentTab = "home";
                this.render();
                this.showToast("Đã xóa file từ vựng!");
            }

            closeModal() {
                const container = document.getElementById("modal-container");
                if (container) container.innerHTML = "";
            }

            exportDeckToJson(deckId) {
                const deck = this.state.decks.find(d => d.id === deckId) || this.getActiveDeck();
                if (!deck) {
                    this.showToast("Không tìm thấy bộ từ để xuất file!");
                    return;
                }
                const blob = new Blob([JSON.stringify(deck, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `${deck.title.replace(/[^a-z0-9\u00C0-\u1EF9]+/gi, "_").toLowerCase()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                this.showToast(`Đã xuất file "${deck.title}.json"!`);
            }

            importDeckFromJson(event) {
                const file = event.target?.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (!parsed || !Array.isArray(parsed.items)) {
                            throw new Error("Invalid format");
                        }
                        const importedDeck = {
                            id: "deck-" + Date.now(),
                            title: parsed.title || file.name.replace(/\.json$/i, ""),
                            createdAt: new Date().toISOString().split("T")[0],
                            items: parsed.items.map((item, idx) => this.normalizeSrsItem({
                                ...item,
                                id: item.id || ("col-" + Date.now() + "-" + idx)
                            }))
                        };
                        this.state.decks.unshift(importedDeck);
                        this.state.activeDeckId = importedDeck.id;
                        this.saveState();
                        this.currentTab = "deck-hub";
                        this.render();
                        this.showToast(`Đã nhập thành công bộ "${importedDeck.title}"!`);
                    } catch (err) {
                        this.showToast("File JSON không đúng định dạng bộ từ TlingEnglish!");
                    }
                };
                reader.readAsText(file);
            }

            // =========================================================================
            // SPACED REPETITION (1 - 2 - 5 - 10 - 20 DAYS PER DECK)
            // =========================================================================
            normalizeSrsItem(item) {
                return {
                    ...item,
                    srsStep: typeof item.srsStep === "number" ? item.srsStep : 0,
                    nextReviewAt: typeof item.nextReviewAt === "number" ? item.nextReviewAt : Date.now()
                };
            }

            getDueItemsForDeck(deck) {
                if (!deck || !Array.isArray(deck.items)) return [];
                const now = Date.now();
                return deck.items.filter(item => (item.nextReviewAt || 0) <= now);
            }

            getTotalDueAcrossAllDecks() {
                return (this.state.decks || []).reduce((sum, deck) => sum + this.getDueItemsForDeck(deck).length, 0);
            }

            getSrsStageLabel(item) {
                const step = item.srsStep || 0;
                if (step <= 0) return "Mới • Chưa học";
                const days = SRS_INTERVALS_DAYS[Math.min(step - 1, SRS_INTERVALS_DAYS.length - 1)];
                return `Mốc ${days} ngày`;
            }

            updateItemSrsSchedule(deckId, itemId, isSuccess) {
                const deck = this.state.decks.find(d => d.id === deckId);
                if (!deck) return;
                const item = deck.items.find(i => i.id === itemId);
                if (!item) return;

                if (isSuccess) {
                    const nextStep = Math.min((item.srsStep || 0) + 1, SRS_INTERVALS_DAYS.length);
                    const days = SRS_INTERVALS_DAYS[nextStep - 1];
                    item.srsStep = nextStep;
                    item.nextReviewAt = Date.now() + days * DAY_MS;
                } else {
                    item.srsStep = 1;
                    item.nextReviewAt = Date.now() + 1 * DAY_MS;
                }
                this.saveState();
            }

            simulateAdvanceOneDay(deckId) {
                const deck = this.state.decks.find(d => d.id === deckId);
                if (!deck) return;
                deck.items.forEach(item => {
                    item.nextReviewAt = (item.nextReviewAt || Date.now()) - DAY_MS;
                });
                this.saveState();
                this.render();
                this.showToast(`Đã tua nhanh +1 ngày cho bộ "${deck.title}"!`);
            }

            startDueReviewForDeck(deckId, mode) {
                this.state.activeDeckId = deckId;
                this.saveState();
                this.currentTab = mode;
                if (mode === "flashcards") {
                    this.initFlashcards(true);
                } else if (mode === "quiz") {
                    this.initQuiz(true);
                } else if (mode === "writing") {
                    this.initWriting(true);
                }
                this.render();
            }

            // =========================================================================
            // KEYBOARD SHORTCUTS, TTS & PRONUNCIATION HELPER
            // =========================================================================
            initKeyboardShortcuts() {
                document.addEventListener("keydown", (e) => {
                    const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : "";
                    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

                    if (this.currentTab === "flashcards" && this.fcQueue.length > 0 && this.fcIndex < this.fcQueue.length) {
                        const current = this.fcQueue[this.fcIndex];
                        if (e.code === "Space") {
                            e.preventDefault();
                            this.flipFlashcard();
                        } else if (e.key === "a" || e.key === "A") {
                            e.preventDefault();
                            if (current) this.speakEnglish(current.collocation);
                        } else if (e.key === "p" || e.key === "P") {
                            e.preventDefault();
                            this.togglePronunciationGuide("fc");
                        } else if (e.key === "ArrowLeft" || e.key === "<" || e.key === ",") {
                            e.preventDefault();
                            this.fcLastDirectionHint = "left";
                            this.rateFlashcard("hard");
                        } else if (e.key === "ArrowRight" || e.key === ">" || e.key === ".") {
                            e.preventDefault();
                            this.fcLastDirectionHint = "right";
                            this.rateFlashcard("easy");
                        }
                    }
                });
            }

            speakEnglish(text, rate = 0.94, onDone = null) {
                if (!text) {
                    if (onDone) onDone();
                    return;
                }
                if (!("speechSynthesis" in window)) {
                    if (onDone) onDone();
                    return;
                }

                try {
                    window.speechSynthesis.cancel();
                    const utter = new SpeechSynthesisUtterance(text);
                    utter.lang = "en-US";
                    utter.rate = rate;

                    let finished = false;
                    const completeOnce = () => {
                        if (finished) return;
                        finished = true;
                        if (onDone) onDone();
                    };

                    utter.onend = completeOnce;
                    utter.onerror = completeOnce;
                    window.speechSynthesis.speak(utter);

                    if (onDone) {
                        setTimeout(completeOnce, Math.min(2600, Math.max(950, text.length * 85)));
                    }
                } catch (e) {
                    if (onDone) onDone();
                }
            }

            togglePronunciationGuide(mode) {

            // =========================================================================
            // 1. CREATOR VIEW (AI COLLOCATION GENERATOR + INSTANT SAVE)
            // =========================================================================
            async generateCollocationsWithAI() {
                const titleInput = document.getElementById("creator-deck-title");
                const wordsInput = document.getElementById("creator-raw-words");
                this.newDeckTitleInput = titleInput ? titleInput.value : this.newDeckTitleInput;
                this.rawWordsInput = wordsInput ? wordsInput.value : this.rawWordsInput;

                const rawLines = this.rawWordsInput
                    .split(/[\n,;]+/)
                    .map(s => s.trim())
                    .filter(Boolean);

                if (rawLines.length === 0) {
                    this.showToast("Vui lòng nhập ít nhất 1 từ vựng hoặc cụm từ!");
                    return;
                }

                this.isGeneratingAI = true;
                this.render();

                try {
                    const prompt = `Hãy chuyển đổi danh sách các từ/cụm từ tiếng Anh sau đây thành các Collocation (cụm từ tự nhiên, chuẩn xác trong giao tiếp hoặc IELTS) kèm phiên âm IPA, nghĩa tiếng Việt tự nhiên và 1 câu ví dụ song ngữ Anh - Việt cho mỗi từ.
Danh sách từ đầu vào: ${rawLines.join(", ")}`;

                    const schema = {
                        type: "ARRAY",
                        items: {
                            type: "OBJECT",
                            properties: {
                                rootWord: { type: "STRING" },
                                collocation: { type: "STRING" },
                                ipa: { type: "STRING" },
                                meaningVi: { type: "STRING" },
                                exampleEn: { type: "STRING" },
                                exampleVi: { type: "STRING" }
                            },
                            required: ["rootWord", "collocation", "ipa", "meaningVi", "exampleEn", "exampleVi"]
                        }
                    };

                    const jsonText = await callGeminiAPI({
                        contents: [{ role: "user", parts: [{ text: prompt }] }],
                        systemInstruction: "Bạn là chuyên gia ngôn ngữ Anh - Việt. Không bao giờ để từ đơn lẻ; luôn mở rộng thành cụm từ Collocation tự nhiên kèm phiên âm IPA chuẩn Mỹ và nghĩa tiếng Việt dễ hiểu.",
                        responseSchema: schema
                    });

                    const parsed = JSON.parse(jsonText);
                    this.stagedCollocations = parsed.map((item, idx) => ({
                        id: "col-" + Date.now() + "-" + idx,
                        rootWord: item.rootWord || rawLines[idx] || "",
                        collocation: item.collocation || rawLines[idx] || "",
                        ipa: item.ipa || "",
                        meaningVi: item.meaningVi || "",
                        exampleEn: item.exampleEn || "",
                        exampleVi: item.exampleVi || ""
                    }));
                    this.showToast(`AI đã tạo xong ${this.stagedCollocations.length} cụm Collocation!`);
                } catch (err) {
                    console.error(err);
                    this.showToast("Không kết nối được AI, đã tạo danh sách cơ bản để bạn chỉnh sửa.");
                    this.stagedCollocations = rawLines.map((line, idx) => {
                        const parts = line.split(/[:\-–]/);
                        return {
                            id: "col-" + Date.now() + "-" + idx,
                            rootWord: (parts[0] || "").trim(),
                            collocation: (parts[0] || "").trim(),
                            ipa: "",
                            meaningVi: (parts[1] || "Chưa có nghĩa tiếng Việt").trim(),
                            exampleEn: "",
                            exampleVi: ""
                        };
                    });
                } finally {
                    this.isGeneratingAI = false;
                    this.render();
                }
            }

            updateStagedField(index, field, value) {
                if (this.stagedCollocations[index]) {
                    this.stagedCollocations[index][field] = value;
                }
            }

            removeStagedItem(index) {
                this.stagedCollocations.splice(index, 1);
                this.render();
            }

            saveStagedDeck(alsoExportJson = false) {
                const titleInput = document.getElementById("creator-deck-title");
                const wordsInput = document.getElementById("creator-raw-words");
                const title = (titleInput ? titleInput.value : this.newDeckTitleInput).trim() || `Bộ từ ngày ${new Date().toLocaleDateString("vi-VN")}`;

                let itemsToSave = [...this.stagedCollocations];

                // If user hasn't clicked AI generate yet, parse directly from raw textarea
                if (itemsToSave.length === 0) {
                    const rawText = (wordsInput ? wordsInput.value : this.rawWordsInput).trim();
                    const lines = rawText.split(/\n+/).map(s => s.trim()).filter(Boolean);
                    if (lines.length === 0) {
                        this.showToast("Vui lòng nhập từ vựng trước khi lưu bộ từ!");
                        return;
                    }
                    itemsToSave = lines.map((line, idx) => {
                        const parts = line.split(/[:\-–]/);
                        const phrase = (parts[0] || "").trim();
                        const meaning = (parts.slice(1).join("-") || "Nghĩa tiếng Việt (bấm sửa nếu cần)").trim();
                        return {
                            id: "col-" + Date.now() + "-" + idx,
                            rootWord: phrase,
                            collocation: phrase,

            // =========================================================================

            initFlashcards(onlyDue = false) {
                const deck = this.getActiveDeck();
                if (!deck) return;
                this.fcOnlyDue = onlyDue;
                const pool = onlyDue ? this.getDueItemsForDeck(deck) : deck.items;
                this.fcQueue = this.shuffleArray(pool.length > 0 ? pool : deck.items);
                this.fcIndex = 0;
                this.fcFlipped = false;
                this.fcShowPronunciationTip = false;
                this.fcLastDirectionHint = null;
                if (this.fcQueue[0]) {
                    setTimeout(() => this.speakEnglish(this.fcQueue[0].collocation), 200);
                }
            }

            flipFlashcard() {
                this.fcFlipped = !this.fcFlipped;
                this.render();
            }

            rateFlashcard(rating) {
                const deck = this.getActiveDeck();
                const current = this.fcQueue[this.fcIndex];
                if (!deck || !current) return;

                const isMastered = rating === "easy" || rating === "good";
                this.updateItemSrsSchedule(deck.id, current.id, isMastered);

                if (!isMastered) {
                    // Re-queue near end of current session for active recall
                    this.fcQueue.push(current);
                }

                // Pronounce the current phrase once more before moving to the next card
                this.speakEnglish(current.collocation, 0.92, () => {
                    this.fcIndex++;
                    this.fcFlipped = false;
                    this.fcShowPronunciationTip = false;
                    this.fcLastDirectionHint = null;
                    this.render();
                    if (this.fcQueue[this.fcIndex]) {
                        setTimeout(() => this.speakEnglish(this.fcQueue[this.fcIndex].collocation), 220);
                    }
                });
            }

            initQuiz(onlyDue = false) {

                this.quizOnlyDue = onlyDue;
                const pool = onlyDue ? this.getDueItemsForDeck(deck) : deck.items;
                this.quizQueue = this.shuffleArray(pool.length > 0 ? pool : deck.items);
                this.quizIndex = 0;
                this.quizScore = 0;

                this.quizSelectedOptionId = null;

                this.buildQuizOptions();
            }

            buildQuizOptions() {
                const deck = this.getActiveDeck();
                const current = this.quizQueue[this.quizIndex];
                if (!deck || !current) return;

                const distractors = this.shuffleArray(deck.items.filter(i => i.id !== current.id)).slice(0, 3);
                const fallbackDistractors = [
                    { id: "fb-1", collocation: "take into account", meaningVi: "xem xét, cân nhắc kỹ lưỡng" },
                    { id: "fb-2", collocation: "draw a conclusion", meaningVi: "rút ra kết luận" },
                    { id: "fb-3", collocation: "bridge the gap", meaningVi: "thu hẹp khoảng cách" }
                ];

                while (distractors.length < 3) {
                    distractors.push(fallbackDistractors[distractors.length]);
                }

                this.quizOptions = this.shuffleArray([current, ...distractors]);
            }

            answerQuiz(optionId) {
                if (this.quizAnswered) return;
                const deck = this.getActiveDeck();
                const current = this.quizQueue[this.quizIndex];
                if (!deck || !current) return;

                this.quizAnswered = true;
                this.quizSelectedOptionId = optionId;
                const isCorrect = optionId === current.id;
                if (isCorrect) this.quizScore++;

                this.updateItemSrsSchedule(deck.id, current.id, isCorrect);
                this.speakEnglish(current.collocation);
                this.render();
            }

                const current = this.quizQueue[this.quizIndex];

                    this.quizIndex++;
                    this.quizAnswered = false;
                    this.quizSelectedOptionId = null;
                    this.quizShowPronunciationTip = false;
                    this.buildQuizOptions();
                    this.render();
                };
                if (current) {
                    this.speakEnglish(current.collocation, 0.94, advance);
                } else {
                    advance();
                }
            }

            initWriting(onlyDue = false) {

                const pool = onlyDue ? this.getDueItemsForDeck(deck) : deck.items;
                this.writeQueue = this.shuffleArray(pool.length > 0 ? pool : deck.items);
                this.writeIndex = 0;
                this.writeScore = 0;
                this.writeAnswered = false;
                this.writeLastResult = null;
                this.writeShowPronunciationTip = false;
                this.setWritingItemDirection();

            setWritingItemDirection() {
                if (this.writeDirection === "mixed") {
                    this.currentItemDirection = Math.random() < 0.5 ? "vi-to-en" : "en-to-vi";

            async submitWritingAnswer() {
                if (this.writeAnswered || this.isCheckingWritingAI) return;
                const deck = this.getActiveDeck();
                const current = this.writeQueue[this.writeIndex];
                const inputEl = document.getElementById("writing-answer-input");
                const userAns = (inputEl ? inputEl.value : "").trim();

                if (!deck || !current) return;
                if (!userAns) {
                    this.showToast("Hãy nhập câu trả lời của bạn trước khi kiểm tra nhé!");
                    return;
                }

                const isViToEn = this.currentItemDirection === "vi-to-en";
                const normalize = (s) => s.toLowerCase().replace(/[.,!?;:"'()]/g, "").replace(/\s+/g, " ").trim();

                if (isViToEn) {
                    const isExact = normalize(userAns) === normalize(current.collocation);
                    this.writeAnswered = true;
                    if (isExact) this.writeScore++;
                    this.writeLastResult = {
                        isCorrect: isExact,
                        userAnswer: userAns,
                        expectedAnswer: current.collocation,
                        feedbackVi: isExact
                            ? "Chính xác tuyệt đối! Bạn đã viết đúng cụm Collocation tiếng Anh."
                            : `Đáp án chuẩn là: "${current.collocation}". Hãy chú ý mạo từ và giới từ đi kèm nhé.`
                    };
                    this.updateItemSrsSchedule(deck.id, current.id, isExact);
                    this.speakEnglish(current.collocation);
                    this.render();
                } else {
                    // EN -> VI: allow flexible semantic check via Gemini AI
                    const quickMatch = normalize(userAns) === normalize(current.meaningVi);
                    if (quickMatch) {
                        this.writeAnswered = true;
                        this.writeScore++;
                        this.writeLastResult = {
                            isCorrect: true,
                            userAnswer: userAns,
                            expectedAnswer: current.meaningVi,
                            feedbackVi: "Dịch nghĩa tiếng Việt hoàn toàn chính xác!"
                        };
                        this.updateItemSrsSchedule(deck.id, current.id, true);
                        this.speakEnglish(current.collocation);
                        this.render();
                        return;
                    }

                    this.isCheckingWritingAI = true;
                    this.render();
                    try {
                        const prompt = `Cụm từ tiếng Anh: "${current.collocation}" (nghĩa tham khảo: "${current.meaningVi}").
Người học dịch sang tiếng Việt là: "${userAns}".
Hãy đánh giá xem bản dịch của người học có đúng ý nghĩa cốt lõi không.`;
                        const schema = {
                            type: "OBJECT",
                            properties: {
                                isCorrect: { type: "BOOLEAN" },
                                feedbackVi: { type: "STRING" }
                            },
                            required: ["isCorrect", "feedbackVi"]
                        };
                        const raw = await callGeminiAPI({
                            contents: [{ role: "user", parts: [{ text: prompt }] }],
                            systemInstruction: "Bạn là giáo viên tiếng Anh chấm bài dịch Anh - Việt linh hoạt theo ngữ nghĩa tự nhiên.",
                            responseSchema: schema
                        });
                        const parsed = JSON.parse(raw);
                        this.writeAnswered = true;
                        if (parsed.isCorrect) this.writeScore++;
                        this.writeLastResult = {
                            isCorrect: parsed.isCorrect,
                            userAnswer: userAns,
                            expectedAnswer: current.meaningVi,
                            feedbackVi: parsed.feedbackVi
                        };
                        this.updateItemSrsSchedule(deck.id, current.id, parsed.isCorrect);
                    } catch (e) {
                        const overlap = normalize(current.meaningVi).split(" ").some(w => w.length > 2 && normalize(userAns).includes(w));
                        this.writeAnswered = true;
                        if (overlap) this.writeScore++;
                        this.writeLastResult = {
                            isCorrect: overlap,
                            userAnswer: userAns,
                            expectedAnswer: current.meaningVi,
                            feedbackVi: `Nghĩa tham khảo chuẩn: "${current.meaningVi}".`
                        };
                        this.updateItemSrsSchedule(deck.id, current.id, overlap);
                    } finally {
                        this.isCheckingWritingAI = false;
                        this.speakEnglish(current.collocation);
                        this.render();
                    }
                }
            }

            // =========================================================================
            // 6. AI SPEAKING TUTOR VIEW (CONTINUOUS RECORDING + BAND 6.5 - 7.5+ UPGRADE)
            // =========================================================================
            initSpeechRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) return;

                const rec = new SpeechRecognition();
                rec.lang = "en-US";
                rec.continuous = true;
                rec.interimResults = true;

                rec.onresult = (event) => {
                    let interim = "";
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            this.finalTranscriptBuffer += (this.finalTranscriptBuffer ? " " : "") + transcript.trim();
                        } else {
                            interim += transcript;
                        }
                    }
                    const inputEl = document.getElementById("speaking-user-input");
                    if (inputEl) {
                        inputEl.value = (this.finalTranscriptBuffer + (interim ? " " + interim : "")).trim();
                    }
                };

                rec.onend = () => {
                    // Automatically restart if user has NOT clicked Stop button yet
                    if (this.isRecording) {
                        try {
                            rec.start();
                        } catch (e) {
                            // Ignore rapid restart error
                        }
                    }
                };

                rec.onerror = (event) => {
                    if (event.error === "not-allowed") {
                        this.isRecording = false;
                        clearInterval(this.recordingTimer);
                        this.showToast("Trình duyệt chưa được cấp quyền Micro!");
                        this.render();
                    }
                };

                this.recognition = rec;
            }

            toggleRecording() {
                if (this.isRecording) {
                    this.stopRecording();
                    this.render();
                } else {
                    this.startRecording();
                }
            }

            startRecording() {
                if (!this.recognition) {
                    this.showToast("Trình duyệt này không hỗ trợ nhận diện giọng nói, bạn có thể nhập chữ trực tiếp.");
                    return;
                }
                const inputEl = document.getElementById("speaking-user-input");
                this.finalTranscriptBuffer = inputEl ? inputEl.value.trim() : "";
                this.isRecording = true;
                this.recordingSeconds = 0;

                clearInterval(this.recordingTimer);
                this.recordingTimer = setInterval(() => {
                    this.recordingSeconds++;
                    const timerEl = document.getElementById("recording-timer-text");
                    if (timerEl) {
                        timerEl.textContent = this.formatSeconds(this.recordingSeconds);
                    }
                }, 1000);

                try {
                    this.recognition.start();
                } catch (e) {
                    // Already started
                }
                this.render();
            }

            stopRecording() {
                this.isRecording = false;
                clearInterval(this.recordingTimer);
                if (this.recognition) {
                    try {
                        this.recognition.stop();
                    } catch (e) {
                        // Ignore
                    }
                }
            }

            formatSeconds(sec) {
                const m = String(Math.floor(sec / 60)).padStart(2, "0");
                const s = String(sec % 60).padStart(2, "0");
                return `${m}:${s}`;
            }

            initSpeakingSession() {
                const deck = this.getActiveDeck();
                if (!deck || deck.items.length === 0) return;

                const picked = this.shuffleArray(deck.items).slice(0, Math.min(2, deck.items.length));
                this.targetSpeakingCollocations = picked.map(i => i.collocation);

                const firstTarget = picked[0];
                const starterQuestion = `Hi! Let's practice speaking together. Can you tell me about a situation in your life or society where people need to "${firstTarget.collocation}"?`;
                this.speakingMessages = [
                    {
                        role: "ai",
                        questionEn: starterQuestion,
                        questionVi: `Chào bạn! Hãy cùng luyện nói nhé. Bạn có thể kể về một tình huống trong cuộc sống hoặc xã hội mà mọi người cần "${firstTarget.collocation}" (${firstTarget.meaningVi}) không?`,
                        feedback: null
                    }
                ];
            }

            async sendSpeakingResponse() {
                if (this.isSpeakingLoading) return;
                this.stopRecording();

                const inputEl = document.getElementById("speaking-user-input");
                const userText = (inputEl ? inputEl.value : "").trim();
                if (!userText) {
                    this.showToast("Vui lòng nói hoặc nhập câu trả lời tiếng Anh của bạn nhé!");
                    return;
                }

                const deck = this.getActiveDeck();
                if (!deck) return;

                this.speakingMessages.push({
                    role: "user",
                    text: userText
                });
                if (inputEl) inputEl.value = "";
                this.finalTranscriptBuffer = "";
                this.isSpeakingLoading = true;
                this.render();

                try {
                    const targetsStr = this.targetSpeakingCollocations.join(", ");
                    const nextPicked = this.shuffleArray(deck.items).slice(0, Math.min(2, deck.items.length));
                    const nextTargets = nextPicked.map(i => i.collocation);

                    const prompt = `Người học vừa trả lời câu hỏi Speaking tiếng Anh với mục tiêu sử dụng các cụm từ chỉ định: [${targetsStr}].
Câu trả lời của người học: "${userText}"
Hãy phân tích câu trả lời này và đặt câu hỏi tiếp theo khuyến khích họ dùng cụm: [${nextTargets.join(", ")}].`;

                    const schema = {
                        type: "OBJECT",
                        properties: {
                            usedTargetWell: { type: "BOOLEAN" },
                            correctedSentence: { type: "STRING" },
                            correctionExplanationVi: { type: "STRING" },
                            bandUpgradeSentence: { type: "STRING" },
                            bandUpgradeExplanationVi: { type: "STRING" },
                            nextQuestionEn: { type: "STRING" },
                            nextQuestionVi: { type: "STRING" }
                        },
                        required: [
                            "usedTargetWell",
                            "correctedSentence",
                            "correctionExplanationVi",
                            "bandUpgradeSentence",
                            "bandUpgradeExplanationVi",
                            "nextQuestionEn",
                            "nextQuestionVi"
                        ]
                    };

                    const raw = await callGeminiAPI({
                        contents: [{ role: "user", parts: [{ text: prompt }] }],
                        systemInstruction: "Bạn là giám khảo IELTS Speaking 8.5 tận tâm. Hãy sửa lỗi ngữ pháp tự nhiên cho câu của người học (correctedSentence), nâng cấp ý đó lên chuẩn Band 6.5 - 7.5+ có lồng ghép cụm từ chỉ định (bandUpgradeSentence), giải thích ngắn gọn bằng tiếng Việt và đặt câu hỏi tiếp theo bằng tiếng Anh.",
                        responseSchema: schema
                    });

                    const parsed = JSON.parse(raw);
                    this.targetSpeakingCollocations = nextTargets;
                    this.speakingMessages.push({
                        role: "ai",
                        questionEn: parsed.nextQuestionEn,
                        questionVi: parsed.nextQuestionVi,
                        feedback: {
                            usedTargetWell: parsed.usedTargetWell,
                            correctedSentence: parsed.correctedSentence,
                            correctionExplanationVi: parsed.correctionExplanationVi,
                            bandUpgradeSentence: parsed.bandUpgradeSentence,
                            bandUpgradeExplanationVi: parsed.bandUpgradeExplanationVi
                        }
                    });
                    this.speakEnglish(parsed.nextQuestionEn);
                } catch (err) {
                    console.error(err);
                    const fallbackTarget = this.targetSpeakingCollocations[0] || "make a decision";
                    this.speakingMessages.push({
                        role: "ai",
                        questionEn: `Good effort! Can you give another example using "${fallbackTarget}"?`,
                        questionVi: `Cố gắng tốt lắm! Bạn có thể cho thêm một ví dụ khác sử dụng cụm "${fallbackTarget}" không?`,
                        feedback: {
                            usedTargetWell: userText.toLowerCase().includes(fallbackTarget.toLowerCase()),
                            correctedSentence: userText,
                            correctionExplanationVi: "AI tạm thời bận, hãy kiểm tra lại thì của động từ và mạo từ nhé.",
                            bandUpgradeSentence: `From my perspective, individuals should carefully ${fallbackTarget} in order to achieve long-term success.`,
                            bandUpgradeExplanationVi: "Sử dụng cụm mở đầu 'From my perspective' và cấu trúc mục đích 'in order to' giúp nâng câu lên Band 6.5 - 7.0."
                        }
                    });
                } finally {
                    this.isSpeakingLoading = false;
                    this.render();
                }
            }

            renderSpeakingView() {
                const deck = this.getActiveDeck();
                if (!deck || deck.items.length === 0) {
                    return this.renderEmptyDeckPrompt("Luyện nói AI");
                }
                if (this.speakingMessages.length === 0) {
                    this.initSpeakingSession();
                }

                return `
                    <div class="max-w-3xl mx-auto space-y-5">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <button type="button" onclick="app.openDeckHub('${deck.id}')" class="text-xs font-bold text-pinky-700 hover:underline flex items-center gap-1">
                                <i data-lucide="arrow-left" class="w-4 h-4"></i> Bộ: ${this.escapeHtml(deck.title)}
                            </button>
                            <button type="button" onclick="app.initSpeakingSession(); app.render()"
                                class="px-3.5 py-1.5 rounded-xl bg-white border border-pinky-200 text-pinky-700 hover:bg-pinky-50 text-xs font-bold flex items-center gap-1.5">
                                <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Đổi câu hỏi &amp; từ chỉ định
                            </button>
                        </div>

                        <!-- Target Collocations Banner -->
                        <div class="bg-gradient-to-r from-pinky-500 to-rose-500 rounded-3xl p-5 text-white shadow-sm space-y-2">
                            <div class="text-xs font-bold uppercase tracking-wider text-pinky-100">🎯 Cụm từ chỉ định cần dùng trong câu trả lời:</div>
                            <div class="flex flex-wrap items-center gap-2">
                                ${this.targetSpeakingCollocations.map(col => `
                                    <button type="button" onclick="app.speakEnglish('${this.escapeJs(col)}')"
                                        class="px-3.5 py-1.5 rounded-2xl bg-white text-pinky-700 font-display font-extrabold text-xs sm:text-sm shadow-2xs flex items-center gap-1.5">
                                        <span>${this.escapeHtml(col)}</span>
                                        <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
                                    </button>
                                `).join("")}
                            </div>
                        </div>

                        <!-- Conversation Feed -->
                        <div class="space-y-4">
                            ${this.speakingMessages.map(msg => {
                                if (msg.role === "user") {
                                    return `
                                        <div class="flex justify-end">
                                            <div class="max-w-xl bg-pinky-600 text-white rounded-3xl rounded-tr-md px-5 py-3.5 shadow-xs text-xs sm:text-sm leading-relaxed">
                                                ${this.escapeHtml(msg.text)}
                                            </div>
                                        </div>
                                    `;
                                }

                                return `
                                    <div class="space-y-3">
                                        ${msg.feedback ? `
                                            <div class="bg-white rounded-3xl border border-pinky-200 p-5 shadow-xs space-y-4">
                                                <div class="flex items-center justify-between">
                                                    <span class="px-3 py-1 rounded-full ${msg.feedback.usedTargetWell ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'} text-xs font-extrabold">
                                                        ${msg.feedback.usedTargetWell ? "✓ Đã dùng đúng cụm từ chỉ định!" : "💡 Gợi ý lồng ghép cụm từ chỉ định"}
                                                    </span>
                                                </div>

                                                <!-- Corrected Sentence -->
                                                <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 space-y-1.5">
                                                    <div class="flex items-center justify-between">
                                                        <span class="text-xs font-extrabold text-slate-700">1. Chỉnh sửa câu tự nhiên hơn:</span>
                                                        <button type="button" onclick="app.speakEnglish('${this.escapeJs(msg.feedback.correctedSentence)}')"
                                                            class="px-2.5 py-1 rounded-xl bg-white border border-slate-200 text-slate-700 text-[11px] font-bold">
                                                            🔊 Nghe câu sửa
                                                        </button>
                                                    </div>
                                                    <p class="text-xs sm:text-sm font-bold text-slate-900">"${this.escapeHtml(msg.feedback.correctedSentence)}"</p>
                                                    <p class="text-xs text-slate-600">${this.escapeHtml(msg.feedback.correctionExplanationVi)}</p>
                                                </div>

                                                <!-- Band 6.5 - 7.5+ Upgrade -->
                                                <div class="p-4 rounded-2xl bg-gradient-to-br from-pinky-50 to-purple-50 border border-pinky-200 space-y-1.5">
                                                    <div class="flex items-center justify-between">
                                                        <span class="text-xs font-extrabold text-pinky-700">2. Gợi ý nâng cấp chuẩn IELTS Band 6.5 - 7.5+:</span>
                                                        <button type="button" onclick="app.speakEnglish('${this.escapeJs(msg.feedback.bandUpgradeSentence)}')"
                                                            class="px-2.5 py-1 rounded-xl bg-pinky-600 text-white text-[11px] font-bold">
                                                            🔊 Nghe mẫu Band 7.0+
                                                        </button>
                                                    </div>
                                                    <p class="text-xs sm:text-sm font-extrabold text-pinky-950">"${this.escapeHtml(msg.feedback.bandUpgradeSentence)}"</p>
                                                    <p class="text-xs text-slate-700">${this.escapeHtml(msg.feedback.bandUpgradeExplanationVi)}</p>
                                                </div>
                                            </div>
                                        ` : ""}

                                        <!-- AI Question Bubble -->
                                        <div class="bg-white rounded-3xl rounded-tl-md border border-pinky-200 p-5 shadow-xs space-y-2">
                                            <div class="flex items-center justify-between">
                                                <span class="text-xs font-extrabold text-pinky-600">🤖 AI Examiner hỏi:</span>
                                                <button type="button" onclick="app.speakEnglish('${this.escapeJs(msg.questionEn)}')"
                                                    class="px-2.5 py-1 rounded-xl bg-pinky-50 text-pinky-700 text-xs font-bold">
                                                    🔊 Nghe câu hỏi
                                                </button>
                                            </div>
                                            <p class="font-display font-bold text-sm sm:text-base text-slate-900">${this.escapeHtml(msg.questionEn)}</p>
                                            ${msg.questionVi ? `<p class="text-xs text-slate-500">${this.escapeHtml(msg.questionVi)}</p>` : ""}
                                        </div>
                                    </div>
                                `;
                            }).join("")}
                        </div>

                        <!-- Continuous Manual-Stop Recording & Text Input Box -->
                        <div class="bg-white rounded-3xl border border-pinky-200 p-4 sm:p-5 shadow-sm space-y-3">
                            ${this.isRecording ? `
                                <div class="flex items-center justify-between px-4 py-2.5 rounded-2xl bg-rose-50 border border-rose-200">
                                    <div class="flex items-center gap-3">
                                        <span class="relative flex h-3 w-3">
                                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                                            <span class="relative inline-flex rounded-full h-3 w-3 bg-rose-600"></span>
                                        </span>
                                        <span class="text-xs font-extrabold text-rose-700">Đang ghi âm liên tục (Chỉ dừng khi bạn bấm Dừng)</span>
                                        <div class="flex items-end gap-0.5 h-5">
                                            <span class="wave-bar w-1 bg-rose-500 rounded-full" style="animation-delay:0s"></span>
                                            <span class="wave-bar w-1 bg-rose-500 rounded-full" style="animation-delay:0.2s"></span>
                                            <span class="wave-bar w-1 bg-rose-500 rounded-full" style="animation-delay:0.4s"></span>
                                        </div>
                                    </div>
                                    <span id="recording-timer-text" class="font-mono text-xs font-extrabold text-rose-700">${this.formatSeconds(this.recordingSeconds)}</span>
                                </div>
                            ` : ""}

                            <textarea id="speaking-user-input" rows="3"
                                placeholder="Bấm nút Bắt đầu nói (hoặc gõ trực tiếp câu trả lời tiếng Anh của bạn tại đây)..."
                                class="w-full p-3.5 rounded-2xl border border-pinky-200 focus:border-pinky-500 text-xs sm:text-sm outline-hidden"></textarea>

                            <div class="flex flex-wrap items-center justify-between gap-2">
                                <button type="button" onclick="app.toggleRecording()"
                                    class="px-5 py-3 rounded-2xl ${this.isRecording ? 'bg-rose-600 hover:bg-rose-700 text-white mic-pulse' : 'bg-pinky-100 hover:bg-pinky-200 text-pinky-800'} font-bold text-xs sm:text-sm flex items-center gap-2 transition-all cursor-pointer">
                                    <i data-lucide="${this.isRecording ? 'square' : 'mic'}" class="w-4 h-4"></i>
                                    ${this.isRecording ? "Dừng ghi âm" : "Bắt đầu nói (Ghi âm dài)"}
                                </button>

                                <button type="button" onclick="app.sendSpeakingResponse()" ${this.isSpeakingLoading ? "disabled" : ""}
                                    class="px-6 py-3 rounded-2xl bg-pinky-600 hover:bg-pinky-700 disabled:opacity-60 text-white font-bold text-xs sm:text-sm shadow-sm flex items-center gap-2 cursor-pointer">
                                    <i data-lucide="send" class="w-4 h-4"></i>
                                    ${this.isSpeakingLoading ? "AI đang chấm & gợi ý Band 7.0+..." : "Gửi câu trả lời"}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // =========================================================================
            // UTILITIES & MAIN RENDER LOOP
            // =========================================================================
            renderEmptyDeckPrompt(featureName) {
                return `
                    <div class="max-w-lg mx-auto bg-white rounded-3xl border border-pinky-200 p-8 text-center space-y-4">
                        <h3 class="font-display font-extrabold text-xl text-slate-900">Chưa có bộ từ vựng để mở ${featureName}</h3>
                        <p class="text-xs sm:text-sm text-slate-500">Hãy quay lại Trang chủ để tạo một bộ file từ vựng mới nhé!</p>
                        <button type="button" onclick="app.switchTab('creator')"
                            class="px-5 py-2.5 rounded-2xl bg-pinky-600 text-white font-bold text-sm">
                            Tạo file từ mới ngay
                        </button>
                    </div>
                `;
            }

            shuffleArray(arr) {
                const copy = [...arr];
                for (let i = copy.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            escapeHtml(str) {
                return String(str || "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            escapeJs(str) {
                return String(str || "")
                    .replace(/\\/g, "\\\\")
                    .replace(/'/g, "\\'")
                    .replace(/\n/g, " ");
            }

            showToast(message) {
                const container = document.getElementById("toast-container");
                if (!container) return;
                const toast = document.createElement("div");
                toast.className = "bg-slate-900/95 text-white text-xs font-semibold px-4 py-3 rounded-2xl shadow-lg border border-pinky-400/30 transition-opacity duration-300";
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = "0";
                    setTimeout(() => toast.remove(), 300);
                }, 3200);
            }

            render() {
                // 1. Update Top Deck Selector
                const deckSelect = document.getElementById("active-deck-select");
                if (deckSelect) {
                    if (this.state.decks.length === 0) {
                        deckSelect.innerHTML = `<option value="">Chưa có file từ</option>`;
                    } else {
                        deckSelect.innerHTML = this.state.decks.map(d =>
                            `<option value="${d.id}" ${d.id === this.state.activeDeckId ? "selected" : ""}>${this.escapeHtml(d.title)} (${d.items.length})</option>`
                        ).join("");
                    }
                }

                // 2. Render Navigation Pills
                const navTabs = document.getElementById("nav-tabs");
                const totalDueAll = this.getTotalDueAcrossAllDecks();
                if (navTabs) {
                    const tabs = [
                        { id: "home", label: "Trang chủ", icon: "home" },
                        { id: "creator", label: "1. Tạo từ & File", icon: "plus-circle" },
                        { id: "srs", label: `2. Lịch ôn (1-2-5-10d)${totalDueAll > 0 ? ` (${totalDueAll})` : ""}`, icon: "calendar-clock" },
                        { id: "flashcards", label: "3. Flashcards", icon: "layers" },
                        { id: "quiz", label: "4. Trắc nghiệm", icon: "check-circle-2" },
                        { id: "writing", label: "5. Tập viết", icon: "pen-tool" },
                        { id: "speaking", label: "6. Luyện nói AI", icon: "mic" }
                    ];

                    navTabs.innerHTML = tabs.map(t => {
                        const isActive = this.currentTab === t.id || (t.id === "home" && this.currentTab === "deck-hub");
                        return `
                            <button type="button" onclick="app.switchTab('${t.id}')"
                                class="px-3.5 py-2 rounded-2xl text-xs font-bold flex items-center gap-1.5 transition-all cursor-pointer ${
                                    isActive
                                        ? "bg-pinky-600 text-white shadow-xs"
                                        : "text-slate-600 hover:bg-pinky-50 hover:text-pinky-700"
                                }">
                                <i data-lucide="${t.icon}" class="w-3.5 h-3.5"></i>
                                <span>${t.label}</span>
                            </button>
                        `;
                    }).join("");
                }

                // 3. Render Active View
                const mainEl = document.getElementById("app-main");
                if (mainEl) {
                    if (this.currentTab === "home") {
                        mainEl.innerHTML = this.renderHomeView();
                    } else if (this.currentTab === "deck-hub") {
                        mainEl.innerHTML = this.renderDeckHubView();
                    } else if (this.currentTab === "creator") {
                        mainEl.innerHTML = this.renderCreatorView();
                    } else if (this.currentTab === "srs") {
                        mainEl.innerHTML = this.renderSrsScheduleView();
                    } else if (this.currentTab === "flashcards") {
                        mainEl.innerHTML = this.renderFlashcardsView();
                    } else if (this.currentTab === "quiz") {
                        mainEl.innerHTML = this.renderQuizView();
                    } else if (this.currentTab === "writing") {
                        mainEl.innerHTML = this.renderWritingView();
                    } else if (this.currentTab === "speaking") {
                        mainEl.innerHTML = this.renderSpeakingView();
                    }
                }

                if (window.lucide) {
                    lucide.createIcons();
                }
            }
        }

        // Initialize application when DOM is ready
        window.addEventListener("DOMContentLoaded", () => {
            window.app = new TlingEnglishApp();
        });
    </script>
</body>
</html>
