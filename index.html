    <script>
        /**
         * Gemini API Helper with Exponential Backoff
         */
        async function callGeminiAPI({ contents, systemInstruction = null, responseSchema = null }) {
            const apiKey = "AQ.Ab8RN6KVtge803BnpV_2RGcVv9qrc8YRrFr_jbvvVaocR0-tIg";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = { contents };
            if (systemInstruction) {
                payload.systemInstruction = { parts: [{ text: systemInstruction }] };
            }
            if (responseSchema) {
                payload.generationConfig = {
                    responseMimeType: "application/json",
                    responseSchema: responseSchema
                };
            }

            const delays = [1000, 2000, 4000, 8000];
            for (let attempt = 0; attempt <= delays.length; attempt++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) throw new Error("Empty model response");
                    return text;
                } catch (err) {
                    if (attempt === delays.length) {
                        throw err;
                    }
                    await new Promise(res => setTimeout(res, delays[attempt]));
                }
            }
        }

        // Chu kỳ lặp lại ngắt quãng chuẩn (ngày): Mốc 1 ngày -> 2 ngày -> 5 ngày -> 10 ngày -> 20 ngày
        const SRS_INTERVALS_DAYS = [1, 2, 5, 10, 20];
        const DAY_MS = 24 * 60 * 60 * 1000;

        /**
         * Main TlingEnglish Application Class
         */
        class TlingEnglishApp {
            constructor() {
                this.STORAGE_KEY = "tling_english_decks_v1";
                this.state = this.loadState();
                // Default main view is 'home' (Trang chủ danh sách bộ từ & nút tạo bộ từ)
                // Other views: 'creator' | 'deck-hub' | 'srs' | 'flashcards' | 'quiz' | 'writing' | 'speaking'
                this.currentTab = "home";

                // Creator & Staging State
                this.rawWordsInput = "";
                this.newDeckTitleInput = "";
                this.stagedCollocations = [];
                this.isGeneratingAI = false;

                // Flashcard State
                this.fcQueue = [];
                this.fcIndex = 0;
                this.fcFlipped = false;
                this.fcOnlyDue = false;
                this.fcShowPronunciationTip = false;
                this.fcLastDirectionHint = null;

                // Quiz State
                this.quizQueue = [];
                this.quizIndex = 0;
                this.quizScore = 0;
                this.quizAnswered = false;
                this.quizOptions = [];
                this.quizDirection = "en-to-vi";
                this.quizOnlyDue = false;
                this.quizShowPronunciationTip = false;

                // Two-Way Writing State
                this.writeQueue = [];
                this.writeIndex = 0;
                this.writeScore = 0;
                this.writeAnswered = false;
                this.writeLastResult = null;
                this.writeDirection = "vi-to-en";
                this.currentItemDirection = "vi-to-en";
                this.isCheckingWritingAI = false;
                this.writeOnlyDue = false;
                this.writeShowPronunciationTip = false;

                // AI Speaking Tutor State
                this.speakingMessages = [];
                this.targetSpeakingCollocations = [];
                this.isSpeakingLoading = false;
                this.isRecording = false;
                this.recognition = null;
                this.recordingSeconds = 0;
                this.recordingTimer = null;
                this.finalTranscriptBuffer = "";

                this.initSpeechRecognition();
                this.initKeyboardShortcuts();
                this.render();
            }

            // =========================================================================
            // KEYBOARD SHORTCUTS & SPEECH SYNTHESIS (TTS) + PRONUNCIATION GUIDE
            // =========================================================================
            initKeyboardShortcuts() {
                document.addEventListener("keydown", (e) => {
                    const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : "";
                    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

                    if (this.currentTab === "flashcards" && this.fcQueue.length > 0 && this.fcIndex < this.fcQueue.length) {
                        const current = this.fcQueue[this.fcIndex];
                        if (e.code === "Space") {
                            e.preventDefault();
                            this.flipFlashcard();
                        } else if (e.key === "a" || e.key === "A") {
                            e.preventDefault();
                            if (current) this.speakEnglish(current.collocation);
                        } else if (e.key === "p" || e.key === "P") {
                            e.preventDefault();
                            this.togglePronunciationGuide("fc");
                        } else if (e.key === "ArrowLeft" || e.key === "<" || e.key === ",") {
                            e.preventDefault();
                            this.fcLastDirectionHint = "left";
                            this.rateFlashcard("hard");
                        } else if (e.key === "ArrowRight" || e.key === ">" || e.key === ".") {
                            e.preventDefault();
                            this.fcLastDirectionHint = "right";
                            this.rateFlashcard("easy");
                        } else if (e.key === "1") {
                            this.fcLastDirectionHint = "left";
                            this.rateFlashcard("hard");
                        } else if (e.key === "2") {
                            this.rateFlashcard("good");
                        } else if (e.key === "3") {
                            this.fcLastDirectionHint = "right";
                            this.rateFlashcard("easy");
                        }
                    } else if (this.currentTab === "quiz" && this.quizAnswered && (e.key === "Enter" || e.key === "ArrowRight")) {
                        e.preventDefault();
                        this.nextQuizQuestion();
                    } else if (this.currentTab === "writing" && this.writeAnswered && (e.key === "Enter" || e.key === "ArrowRight")) {
                        e.preventDefault();
                        this.nextWritingQuestion();
                    }
                });
            }

            speakEnglish(text, rate = 0.92, onEndCallback = null) {
                if (!text || !("speechSynthesis" in window)) {
                    if (typeof onEndCallback === "function") onEndCallback();
                    return;
                }
                try {
                    window.speechSynthesis.cancel();
                    const utter = new SpeechSynthesisUtterance(text);
                    utter.lang = "en-US";
                    utter.rate = rate;
                    const voices = window.speechSynthesis.getVoices();
                    const enVoice = voices.find(v => v.lang.includes("en-US") && (v.name.includes("Google") || v.name.includes("Natural") || v.name.includes("Samantha")))
                        || voices.find(v => v.lang.startsWith("en"));
                    if (enVoice) utter.voice = enVoice;
                    if (typeof onEndCallback === "function") {
                        let finished = false;
                        const finishOnce = () => {
                            if (finished) return;
                            finished = true;
                            onEndCallback();
                        };
                        utter.onend = finishOnce;
                        utter.onerror = finishOnce;
                        setTimeout(finishOnce, 2200);
                    }
                    window.speechSynthesis.speak(utter);
                } catch (err) {
                    console.warn("TTS unavailable:", err);
                    if (typeof onEndCallback === "function") onEndCallback();
                }
            }

            togglePronunciationGuide(scope = "fc") {
                const current = scope === "fc"
                    ? this.fcQueue[this.fcIndex]
                    : scope === "quiz"
                        ? this.quizQueue[this.quizIndex]
                        : this.writeQueue[this.writeIndex];

                if (scope === "fc") this.fcShowPronunciationTip = !this.fcShowPronunciationTip;
                if (scope === "quiz") this.quizShowPronunciationTip = !this.quizShowPronunciationTip;
                if (scope === "writing") this.writeShowPronunciationTip = !this.writeShowPronunciationTip;

                if (current) {
                    this.speakEnglish(current.collocation, 0.78);
                }
                this.render();
            }

            buildPronunciationBreakdown(item) {
                if (!item) return "";
                const words = (item.collocation || "").trim().split(/\s+/).filter(Boolean);
                const ipa = item.ipa || "/ˈkɒl.ə.keɪ.ʃən/";
                const wordChunksHtml = words.map((w) => `
                    <button type="button" onclick="event.stopPropagation(); app.speakEnglish('${this.escapeHtml(w).replace(/'/g, "\\'")}', 0.8)"
                            class="px-2.5 py-1 rounded-xl bg-white hover:bg-pinky-100 border border-pinky-200 text-xs font-bold text-pinky-800 flex items-center gap-1 transition-colors"
                            title="Bấm để nghe riêng từ '${this.escapeHtml(w)}'">
                        <span>${this.escapeHtml(w)}</span>
                        <i data-lucide="volume-1" class="w-3 h-3 text-pinky-500"></i>
                    </button>
                `).join("");

                return `
                    <div onclick="event.stopPropagation()" class="mt-3 p-3.5 rounded-2xl bg-pinky-50/90 border border-pinky-200 text-left space-y-2.5">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <span class="text-[11px] font-extrabold uppercase tracking-wider text-pinky-700 flex items-center gap-1.5">
                                <i data-lucide="ear" class="w-3.5 h-3.5"></i> Hướng dẫn phát âm & Nối âm
                            </span>
                            <button type="button" onclick="event.stopPropagation(); app.speakEnglish('${this.escapeHtml(item.collocation).replace(/'/g, "\\'")}', 0.68)"
                                    class="px-2.5 py-1 rounded-lg bg-pinky-600 hover:bg-pinky-700 text-white text-[11px] font-bold flex items-center gap-1 transition-colors">
                                <i data-lucide="turtle" class="w-3 h-3"></i> Đọc chậm từng âm
                            </button>
                        </div>
                        <div class="text-sm font-mono font-bold text-slate-800 bg-white px-3 py-1.5 rounded-xl border border-pinky-100 inline-block">
                            ${this.escapeHtml(ipa)}
                        </div>
                        <div>
                            <span class="text-[11px] font-semibold text-slate-500 block mb-1.5">Bấm từng từ riêng lẻ để luyện rõ âm cuối:</span>
                            <div class="flex flex-wrap gap-1.5">
                                ${wordChunksHtml}
                            </div>
                        </div>
                    </div>
                `;
            }

            buildTransitionExampleBox(item, nextFnCall, nextBtnLabel = "Chuyển sang từ tiếp theo") {
                if (!item) return "";
                const safeCol = this.escapeHtml(item.collocation).replace(/'/g, "\\'");
                const safeEx = this.escapeHtml(item.exampleEn || "").replace(/'/g, "\\'");
                return `
                    <div class="mt-4 p-4 sm:p-5 rounded-3xl bg-gradient-to-br from-pinky-50 via-white to-rose-50/70 border-2 border-pinky-200 shadow-xs space-y-3">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <span class="text-[11px] font-extrabold uppercase tracking-wider text-pinky-700 flex items-center gap-1.5">
                                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Gợi ý câu ví dụ thực tế trước khi qua từ mới
                            </span>
                            <div class="flex items-center gap-1.5">
                                <button type="button" onclick="app.speakEnglish('${safeCol}', 0.85)"
                                        class="px-2.5 py-1 rounded-xl bg-white hover:bg-pinky-100 text-pinky-700 border border-pinky-200 text-xs font-bold flex items-center gap-1 transition-colors">
                                    <i data-lucide="volume-2" class="w-3.5 h-3.5"></i> Nghe lại cụm từ
                                </button>
                                ${item.exampleEn ? `
                                    <button type="button" onclick="app.speakEnglish('${safeEx}', 0.92)"
                                            class="px-2.5 py-1 rounded-xl bg-white hover:bg-pinky-100 text-pinky-700 border border-pinky-200 text-xs font-bold flex items-center gap-1 transition-colors">
                                        <i data-lucide="play-circle" class="w-3.5 h-3.5"></i> Nghe câu ví dụ
                                    </button>
                                ` : ""}
                            </div>
                        </div>

                        <div class="p-3 rounded-2xl bg-white border border-pinky-100">
                            <div class="flex flex-wrap items-baseline gap-2 mb-1">
                                <span class="font-display font-extrabold text-pinky-700 text-sm">${this.escapeHtml(item.collocation)}</span>
                                <span class="text-xs font-mono text-slate-400">${this.escapeHtml(item.ipa || "")}</span>
                            </div>
                            <p class="text-sm font-semibold text-slate-800 italic">"${this.escapeHtml(item.exampleEn || `We should ${item.collocation} in our daily life.`)}"</p>
                            ${item.exampleVi ? `<p class="text-xs text-slate-500 mt-1">→ ${this.escapeHtml(item.exampleVi)}</p>` : ""}
                        </div>

                        <button type="button" onclick="${nextFnCall}"
                                class="w-full py-3.5 px-5 rounded-2xl bg-pinky-600 hover:bg-pinky-700 text-white font-bold text-sm shadow-sm flex items-center justify-center gap-2 transition-all">
                            <i data-lucide="volume-2" class="w-4 h-4"></i>
                            <span>${nextBtnLabel} (Phát âm lại & Tiếp tục)</span>
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
            }

            // =========================================================================
            // STATE & DECK MANAGEMENT + SPACED REPETITION (1 - 2 - 5 - 10 - 20 DAYS)
            // =========================================================================
            loadState() {
                try {
                    const saved = localStorage.getItem(this.STORAGE_KEY);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed && Array.isArray(parsed.decks) && parsed.decks.length > 0) {
                            parsed.decks.forEach(deck => {
                                deck.items = (deck.items || []).map(item => this.normalizeItemSRS(item));
                            });
                            return parsed;
                        }
                    }
                } catch (e) {
                    console.warn("Could not load state:", e);
                }

                const now = Date.now();
                return {
                    activeDeckId: "deck-sample-ielts",
                    decks: [
                        {
                            id: "deck-sample-ielts",
                            title: "IELTS & Giao Tiếp Tự Nhiên (Mẫu)",
                            createdAt: new Date().toISOString().split("T")[0],
                            items: [
                                {
                                    id: "c1",
                                    baseWord: "decision",
                                    collocation: "make an informed decision",
                                    ipa: "/meɪk ən ɪnˈfɔːmd dɪˈsɪʒ.ən/",
                                    meaning: "đưa ra quyết định sáng suốt (dựa trên đầy đủ thông tin)",
                                    exampleEn: "Reading reviews helps consumers make an informed decision before buying.",
                                    exampleVi: "Đọc đánh giá giúp người tiêu dùng đưa ra quyết định sáng suốt trước khi mua.",
                                    mastery: "learning",
                                    srsStage: 1,
                                    intervalDays: 1,
                                    nextReviewAt: now - 3600000,
                                    lastReviewedAt: now - DAY_MS
                                },
                                {
                                    id: "c2",
                                    baseWord: "habit",
                                    collocation: "break a bad habit",
                                    ipa: "/breɪk ə bæd ˈhæb.ɪt/",
                                    meaning: "từ bỏ một thói quen xấu",
                                    exampleEn: "It takes patience and self-discipline to break a bad habit.",
                                    exampleVi: "Cần sự kiên nhẫn và kỷ luật bản thân để từ bỏ một thói quen xấu.",
                                    mastery: "new",
                                    srsStage: 0,
                                    intervalDays: 0,
                                    nextReviewAt: now,
                                    lastReviewedAt: null
                                },
                                {
                                    id: "c3",
                                    baseWord: "balance",
                                    collocation: "strike a healthy balance",
                                    ipa: "/straɪk ə ˈhel.θi ˈbæl.əns/",
                                    meaning: "đạt được sự cân bằng lành mạnh",
                                    exampleEn: "Young professionals often struggle to strike a healthy balance between work and life.",
                                    exampleVi: "Người trẻ đi làm thường chật vật để đạt được sự cân bằng lành mạnh giữa công việc và cuộc sống.",
                                    mastery: "learning",
                                    srsStage: 2,
                                    intervalDays: 2,
                                    nextReviewAt: now - 7200000,
                                    lastReviewedAt: now - 2 * DAY_MS
                                },
                                {
                                    id: "c4",
                                    baseWord: "attention",
                                    collocation: "pay close attention to",
                                    ipa: "/peɪ kləʊs əˈten.ʃən tuː/",
                                    meaning: "chú ý kỹ lưỡng tới điều gì",
                                    exampleEn: "You should pay close attention to subtle details in the contract.",
                                    exampleVi: "Bạn nên chú ý kỹ lưỡng tới những chi tiết tinh tế trong hợp đồng.",
                                    mastery: "learning",
                                    srsStage: 3,
                                    intervalDays: 5,
                                    nextReviewAt: now + 3 * DAY_MS,
                                    lastReviewedAt: now - 2 * DAY_MS
                                },
                                {
                                    id: "c5",
                                    baseWord: "effort",
                                    collocation: "make a concerted effort",
                                    ipa: "/meɪk ə kənˈsɜː.tɪd ˈef.ət/",
                                    meaning: "nỗ lực hết mình, đồng lòng cố gắng",
                                    exampleEn: "The team made a concerted effort to launch the product on schedule.",
                                    exampleVi: "Cả nhóm đã nỗ lực hết mình để ra mắt sản phẩm đúng tiến độ.",
                                    mastery: "mastered",
                                    srsStage: 4,
                                    intervalDays: 10,
                                    nextReviewAt: now + 8 * DAY_MS,
                                    lastReviewedAt: now - 2 * DAY_MS
                                }
                            ]
                        }
                    ]
                };
            }

            normalizeItemSRS(item) {
                const now = Date.now();
                const stage = typeof item.srsStage === "number"
                    ? item.srsStage
                    : (item.mastery === "mastered" ? 3 : item.mastery === "learning" ? 1 : 0);
                const intervalDays = typeof item.intervalDays === "number"
                    ? item.intervalDays
                    : (stage === 0 ? 0 : SRS_INTERVALS_DAYS[Math.min(stage - 1, SRS_INTERVALS_DAYS.length - 1)]);
                const nextReviewAt = typeof item.nextReviewAt === "number"
                    ? item.nextReviewAt
                    : now;

                return {
                    ...item,
                    srsStage: stage,
                    intervalDays,
                    nextReviewAt,
                    lastReviewedAt: item.lastReviewedAt || null
                };
            }

            getNextIntervalDays(currentStage, rating) {
                const stage = typeof currentStage === "number" ? currentStage : 0;
                if (rating === "hard") return 1;
                if (rating === "easy") {
                    const targetStage = Math.min(stage + 2, SRS_INTERVALS_DAYS.length);
                    return SRS_INTERVALS_DAYS[targetStage - 1];
                }
                const targetStage = Math.min(stage + 1, SRS_INTERVALS_DAYS.length);
                return SRS_INTERVALS_DAYS[targetStage - 1];
            }

            advanceItemSRS(deckId, itemId, rating) {
                const deck = this.state.decks.find(d => d.id === deckId);
                if (!deck) return null;
                const item = deck.items.find(i => i.id === itemId);
                if (!item) return null;

                const now = Date.now();
                let newStage = item.srsStage || 0;
                if (rating === "hard") {
                    newStage = 1;
                    item.mastery = "learning";
                } else if (rating === "easy") {
                    newStage = Math.min(newStage + 2, SRS_INTERVALS_DAYS.length);
                    item.mastery = newStage >= 3 ? "mastered" : "learning";
                } else {
                    newStage = Math.min(newStage + 1, SRS_INTERVALS_DAYS.length);
                    item.mastery = newStage >= 3 ? "mastered" : "learning";
                }

                const intervalDays = SRS_INTERVALS_DAYS[newStage - 1];
                item.srsStage = newStage;
                item.intervalDays = intervalDays;
                item.lastReviewedAt = now;
                item.nextReviewAt = now + intervalDays * DAY_MS;

                this.saveState();
                return { item, newStage, intervalDays };
            }

            getDueItemsForDeck(deck) {
                if (!deck || !Array.isArray(deck.items)) return [];
                const now = Date.now();
                return deck.items.filter(item => (item.nextReviewAt || 0) <= now);
            }

            getTotalDueAcrossAllDecks() {
                return this.state.decks.reduce((acc, deck) => acc + this.getDueItemsForDeck(deck).length, 0);
            }

            formatRelativeDueText(nextReviewAt) {
                const now = Date.now();
                const diffMs = (nextReviewAt || now) - now;
                if (diffMs <= 0) return "Đến hạn ôn ngay";
                const diffHours = Math.round(diffMs / (60 * 60 * 1000));
                if (diffHours < 24) return `Còn ${Math.max(1, diffHours)} giờ nữa`;
                const diffDays = Math.ceil(diffMs / DAY_MS);
                return `Còn ${diffDays} ngày nữa`;
            }

            simulateNextDayForDeck(deckId) {
                const deck = this.state.decks.find(d => d.id === deckId);
                if (!deck) return;
                deck.items.forEach(item => {
                    item.nextReviewAt = (item.nextReviewAt || Date.now()) - DAY_MS;
                });
                this.saveState();
                this.showToast(`Đã tua nhanh +1 ngày cho bộ "${deck.title}"!`);
                this.render();
            }

            resetDeckSRSSchedule(deckId) {
                const deck = this.state.decks.find(d => d.id === deckId);
                if (!deck) return;
                const now = Date.now();
                deck.items.forEach(item => {
                    item.srsStage = 0;
                    item.intervalDays = 0;
                    item.mastery = "new";
                    item.nextReviewAt = now;
                    item.lastReviewedAt = null;
                });
                this.saveState();
                this.showToast(`Đã đặt lại toàn bộ lịch ôn tập của "${deck.title}" về hôm nay!`);
                this.render();
            }

            startDueReviewForDeck(deckId, targetMode = "flashcards") {
                this.state.activeDeckId = deckId;
                this.saveState();
                const deck = this.getActiveDeck();
                const dueCount = this.getDueItemsForDeck(deck).length;

                if (dueCount === 0) {
                    this.showToast("Bộ này hiện chưa có từ nào đến hạn! Bắt đầu ôn toàn bộ từ.");
                } else {
                    this.showToast(`Bắt đầu ôn ${dueCount} từ đến hạn của bộ "${deck.title}"!`);
                }

                this.currentTab = targetMode;
                if (targetMode === "flashcards") this.initFlashcards(true);
                if (targetMode === "quiz") this.initQuiz(true);
                if (targetMode === "writing") this.initWriting(true);
                this.render();
            }

            saveState() {
                try {
                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.state));
                } catch (e) {
                    console.warn("Could not save state:", e);
                }
            }

            getActiveDeck() {
                return this.state.decks.find(d => d.id === this.state.activeDeckId) || this.state.decks[0] || null;
            }

            goHome() {
                if (this.isRecording) this.stopRecording(true);
                this.currentTab = "home";
                this.render();
            }

            openDeckHub(deckId) {
                if (this.isRecording) this.stopRecording(true);
                if (deckId) {
                    this.state.activeDeckId = deckId;
                    this.saveState();
                    this.initFlashcards(false);
                    this.initQuiz(false);
                    this.initWriting(false);
                    this.resetSpeakingSession();
                }
                this.currentTab = "deck-hub";
                this.render();
            }

            selectDeck(deckId, openHub = false) {
                this.state.activeDeckId = deckId;
                this.saveState();
                this.initFlashcards(false);
                this.initQuiz(false);
                this.initWriting(false);
                this.resetSpeakingSession();
                if (openHub && (this.currentTab === "home" || this.currentTab === "creator")) {
                    this.currentTab = "deck-hub";
                }
                this.render();
                this.showToast(`Đã chọn bộ: ${this.getActiveDeck()?.title}`);
            }

            switchTab(tab) {
                if (this.isRecording) {
                    this.stopRecording();
                }
                this.currentTab = tab;
                if (tab === "flashcards" && this.fcQueue.length === 0) this.initFlashcards(false);
                if (tab === "quiz" && this.quizQueue.length === 0) this.initQuiz(false);
                if (tab === "writing" && this.writeQueue.length === 0) this.initWriting(false);
                if (tab === "speaking" && this.speakingMessages.length === 0) this.initSpeakingSession();
                this.render();
            }

            showToast(message) {
                const container = document.getElementById("toast-container");
                if (!container) return;
                const el = document.createElement("div");
                el.className = "bg-slate-900/95 text-white text-xs sm:text-sm font-medium px-4 py-3 rounded-2xl shadow-lg border border-pinky-400/30 flex items-center gap-2 transition-all duration-300 translate-y-2 opacity-0";
                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-pinky-400 shrink-0"></span><span>${this.escapeHtml(message)}</span>`;
                container.appendChild(el);
                requestAnimationFrame(() => {
                    el.classList.remove("translate-y-2", "opacity-0");
                });
                setTimeout(() => {
                    el.classList.add("opacity-0", "translate-y-2");
                    setTimeout(() => el.remove(), 300);
                }, 3000);
            }

            // =========================================================================
            // FEATURE 1: AI COLLOCATION GENERATOR & FILE EXPORT / IMPORT
            // =========================================================================
            async generateCollocationsWithAI() {
                const rawInputEl = document.getElementById("raw-words-textarea");
                const titleInputEl = document.getElementById("new-deck-title");
                if (rawInputEl) this.rawWordsInput = rawInputEl.value;
                if (titleInputEl) this.newDeckTitleInput = titleInputEl.value;

                const words = this.rawWordsInput
                    .split(/[\n,;]+/)
                    .map(w => w.trim())
                    .filter(Boolean);

                if (words.length === 0) {
                    this.showToast("Vui lòng nhập ít nhất 1 từ vựng tiếng Anh trước nhé!");
                    return;
                }

                this.isGeneratingAI = true;
                this.render();

                const systemInstruction = `Bạn là chuyên gia ngôn ngữ học tiếng Anh (IELTS & giao tiếp bản xứ).
Nhiệm vụ: Nhận danh sách các từ đơn lẻ từ người dùng và biến MỖI từ thành 1-2 cụm từ cố định (Collocations) tự nhiên, đắt giá nhất trong tiếng Anh (không để từ đứng lẻ).
Yêu cầu đầu ra JSON chuẩn xác:
- baseWord: từ gốc người dùng nhập
- collocation: cụm từ collocation tự nhiên chứa từ đó (ví dụ: 'decision' -> 'make a tough decision', 'pressure' -> 'cope with immense pressure')
- ipa: phiên âm IPA của cả cụm
- meaning: nghĩa tiếng Việt tự nhiên, dễ hiểu
- exampleEn: 1 câu ví dụ tiếng Anh thực tế chứa cụm collocation đó
- exampleVi: bản dịch tiếng Việt của câu ví dụ`;

                const schema = {
                    type: "ARRAY",
                    items: {
                        type: "OBJECT",
                        properties: {
                            baseWord: { type: "STRING" },
                            collocation: { type: "STRING" },
                            ipa: { type: "STRING" },
                            meaning: { type: "STRING" },
                            exampleEn: { type: "STRING" },
                            exampleVi: { type: "STRING" }
                        },
                        required: ["baseWord", "collocation", "ipa", "meaning", "exampleEn", "exampleVi"]
                    }
                };

                try {
                    const prompt = `Hãy tạo các cụm Collocation tự nhiên kèm nghĩa tiếng Việt cho danh sách từ sau: ${words.join(", ")}`;
                    const rawJson = await callGeminiAPI({
                        contents: [{ role: "user", parts: [{ text: prompt }] }],
                        systemInstruction,
                        responseSchema: schema
                    });

                    const parsed = JSON.parse(rawJson);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        this.stagedCollocations = parsed.map((item, idx) => ({
                            id: `col-${Date.now()}-${idx}`,
                            baseWord: item.baseWord || "",
                            collocation: item.collocation || "",
                            ipa: item.ipa || "",
                            meaning: item.meaning || "",
                            exampleEn: item.exampleEn || "",
                            exampleVi: item.exampleVi || "",
                            mastery: "new",
                            srsStage: 0,
                            intervalDays: 0,
                            nextReviewAt: Date.now(),
                            lastReviewedAt: null
                        }));
                        if (!this.newDeckTitleInput.trim()) {
                            this.newDeckTitleInput = `Bộ Collocation (${words.slice(0, 3).join(", ")}${words.length > 3 ? "..." : ""})`;
                        }
                        this.showToast(`AI đã gợi ý ${this.stagedCollocations.length} cụm Collocation!`);
                    } else {
                        throw new Error("Không nhận được danh sách hợp lệ");
                    }
                } catch (err) {
                    console.error(err);
                    this.showToast("AI đang bận, đã tạo khung gợi ý mẫu để bạn chỉnh sửa nhanh.");
                    this.stagedCollocations = words.map((w, idx) => ({
                        id: `col-${Date.now()}-${idx}`,
                        baseWord: w,
                        collocation: `make good use of ${w}`,
                        ipa: "",
                        meaning: `tận dụng tốt ${w} (nhấn để sửa nghĩa)`,
                        exampleEn: `We should learn how to use ${w} effectively in daily conversations.`,
                        exampleVi: `Chúng ta nên học cách sử dụng ${w} hiệu quả trong giao tiếp hàng ngày.`,
                        mastery: "new",
                        srsStage: 0,
                        intervalDays: 0,
                        nextReviewAt: Date.now(),
                        lastReviewedAt: null
                    }));
                } finally {
                    this.isGeneratingAI = false;
                    this.render();
                }
            }

            createDirectDeckFromRawInput(downloadImmediately = false) {
                const rawInputEl = document.getElementById("raw-words-textarea");
                const titleInputEl = document.getElementById("new-deck-title");
                if (rawInputEl) this.rawWordsInput = rawInputEl.value;
                if (titleInputEl) this.newDeckTitleInput = titleInputEl.value;

                // Nếu đã có danh sách gợi ý ở bảng dưới thì lưu luôn bảng dưới
                if (this.stagedCollocations.length > 0) {
                    this.saveStagedDeck(downloadImmediately);
                    return;
                }

                const lines = this.rawWordsInput
                    .split(/[\n,;]+/)
                    .map(w => w.trim())
                    .filter(Boolean);

                if (lines.length === 0) {
                    this.showToast("Vui lòng nhập ít nhất 1 từ hoặc cụm từ trước khi bấm Tạo!");
                    return;
                }

                const now = Date.now();
                this.stagedCollocations = lines.map((entry, idx) => {
                    // Hỗ trợ định dạng "cụm từ : nghĩa tiếng Việt" hoặc "cụm từ - nghĩa tiếng Việt" nếu người dùng nhập sẵn
                    const parts = entry.split(/\s*[:\-–]\s*/);
                    const term = (parts[0] || entry).trim();
                    const meaning = parts.length > 1
                        ? parts.slice(1).join(" - ").trim()
                        : `nghĩa của "${term}" (bấm sửa nếu cần)`;

                    return {
                        id: `col-${now}-${idx}`,
                        baseWord: term.split(/\s+/)[0] || term,
                        collocation: term,
                        ipa: "",
                        meaning,
                        exampleEn: `We should practice using "${term}" naturally in daily conversations.`,
                        exampleVi: `Chúng ta nên luyện tập sử dụng "${term}" một cách tự nhiên trong giao tiếp hàng ngày.`,
                        mastery: "new",
                        srsStage: 0,
                        intervalDays: 0,
                        nextReviewAt: now,
                        lastReviewedAt: null
                    };
                });

                this.saveStagedDeck(downloadImmediately);
            }

            updateStagedItem(index, field, value) {
                if (this.stagedCollocations[index]) {
                    this.stagedCollocations[index][field] = value;
                }
            }

            removeStagedItem(index) {
                this.stagedCollocations.splice(index, 1);
                this.render();
            }

            saveStagedDeck(downloadImmediately = false) {
                const titleEl = document.getElementById("new-deck-title");
                const title = (titleEl ? titleEl.value : this.newDeckTitleInput).trim() || `Bộ Collocation ${new Date().toLocaleDateString("vi-VN")}`;

                const validItems = this.stagedCollocations.filter(item => item.collocation.trim() && item.meaning.trim());
                if (validItems.length === 0) {
                    this.showToast("Chưa có cụm từ hợp lệ nào để lưu!");
                    return;
                }

                const now = Date.now();
                const normalizedValidItems = validItems.map(item => ({
                    ...item,
                    srsStage: 0,
                    intervalDays: 0,
                    nextReviewAt: now,
                    lastReviewedAt: null
                }));

                const newDeck = {
                    id: `deck-${now}`,
                    title,
                    createdAt: new Date().toISOString().split("T")[0],
                    items: normalizedValidItems
                };

                this.state.decks.unshift(newDeck);
                this.state.activeDeckId = newDeck.id;
                this.saveState();

                if (downloadImmediately) {
                    this.exportActiveDeck();
                }

                this.stagedCollocations = [];
                this.rawWordsInput = "";
                this.newDeckTitleInput = "";
                this.initFlashcards(false);
                this.initQuiz(false);
                this.initWriting(false);
                this.resetSpeakingSession();

                this.currentTab = "deck-hub";
                this.showToast(`Đã lưu bộ "${title}" với ${validItems.length} Collocation!`);
                this.render();
            }

            exportActiveDeck() {
                const deck = this.getActiveDeck();
                if (!deck) return;
                const exportData = {
                    app: "TlingEnglish",
                    version: "1.1",
                    exportedAt: new Date().toISOString(),
                    deck
                };
                const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                const safeName = deck.title.replace(/[^a-zA-Z0-9\u00C0-\u1EF9_-]+/g, "_");
                a.href = url;
                a.download = `TlingEnglish_${safeName}.json`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
                this.showToast(`Đã xuất file "${a.download}"!`);
            }

            importDeckFile(event) {
                const file = event.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        const importedDeck = parsed.deck ? parsed.deck : parsed;
                        if (!importedDeck || !Array.isArray(importedDeck.items) || importedDeck.items.length === 0) {
                            throw new Error("Cấu trúc file không hợp lệ");
                        }
                        const now = Date.now();
                        const cleanDeck = {
                            id: `deck-${now}`,
                            title: importedDeck.title || file.name.replace(/\.json$/i, ""),
                            createdAt: importedDeck.createdAt || new Date().toISOString().split("T")[0],
                            items: importedDeck.items.map((it, i) => this.normalizeItemSRS({
                                id: it.id || `imp-${now}-${i}`,
                                baseWord: it.baseWord || "",
                                collocation: String(it.collocation || "").trim(),
                                ipa: String(it.ipa || "").trim(),
                                meaning: String(it.meaning || "").trim(),
                                exampleEn: String(it.exampleEn || "").trim(),
                                exampleVi: String(it.exampleVi || "").trim(),
                                mastery: it.mastery || "new",
                                srsStage: it.srsStage,
                                intervalDays: it.intervalDays,
                                nextReviewAt: it.nextReviewAt,
                                lastReviewedAt: it.lastReviewedAt
                            })).filter(it => it.collocation && it.meaning)
                        };

                        this.state.decks.unshift(cleanDeck);
                        this.state.activeDeckId = cleanDeck.id;
                        this.saveState();
                        this.initFlashcards(false);
                        this.initQuiz(false);
                        this.initWriting(false);
                        this.resetSpeakingSession();
                        this.currentTab = "deck-hub";
                        this.render();
                        this.showToast(`Đã nhập thành công bộ "${cleanDeck.title}" (${cleanDeck.items.length} cụm)!`);
                    } catch (err) {
                        this.showToast("File không đúng định dạng TlingEnglish (.json)!");
                    } finally {
                        event.target.value = "";
                    }
                };
                reader.readAsText(file);
            }

            deleteDeck(deckId) {
                if (this.state.decks.length <= 1) {
                    this.showToast("Bạn cần giữ lại ít nhất 1 bộ từ vựng!");
                    return;
                }
                this.state.decks = this.state.decks.filter(d => d.id !== deckId);
                if (this.state.activeDeckId === deckId) {
                    this.state.activeDeckId = this.state.decks[0].id;
                }
                this.saveState();
                this.render();
                this.showToast("Đã xóa bộ từ vựng.");
            }

            // =========================================================================
            // FEATURE 2A: FLASHCARDS (3D FLIP + SPACED REPETITION 1-2-5-10-20 DAYS)
            // =========================================================================
            initFlashcards(onlyDue = false) {
                const deck = this.getActiveDeck();
                if (!deck) {
                    this.fcQueue = [];
                    return;
                }
                this.fcOnlyDue = onlyDue;
                let sourceItems = onlyDue ? this.getDueItemsForDeck(deck) : [...deck.items];
                if (onlyDue && sourceItems.length === 0) {
                    this.fcOnlyDue = false;
                    sourceItems = [...deck.items];
                }
                const orderWeight = { new: 0, learning: 1, mastered: 2 };
                this.fcQueue = sourceItems.sort((a, b) => (orderWeight[a.mastery] || 0) - (orderWeight[b.mastery] || 0));
                this.fcIndex = 0;
                this.fcFlipped = false;
                this.fcShowPronunciationTip = false;
                this.fcLastDirectionHint = null;
            }

            flipFlashcard() {
                this.fcFlipped = !this.fcFlipped;
                this.render();
            }

            rateFlashcard(level) {
                const currentItem = this.fcQueue[this.fcIndex];
                if (!currentItem) return;

                const deck = this.getActiveDeck();
                const srsRes = this.advanceItemSRS(deck?.id, currentItem.id, level);

                if (level === "hard") {
                    currentItem.mastery = "learning";
                    currentItem.srsStage = 0;
                    this.fcQueue.push(currentItem);
                    this.showToast("← Chưa thuộc: Đặt lại lịch 1 ngày & lặp lại cuối phiên");
                } else if (srsRes) {
                    currentItem.mastery = srsRes.item.mastery;
                    currentItem.srsStage = srsRes.newStage;
                    this.showToast(`→ Đã thuộc: Lên lịch ôn lại sau ${srsRes.intervalDays} ngày!`);
                }

                // Phát âm lại từ vừa học trước khi chuyển sang từ tiếp theo
                const finishedCollocation = currentItem.collocation;
                this.fcIndex++;
                this.fcFlipped = false;
                this.fcShowPronunciationTip = false;
                this.render();

                const nextItem = this.fcQueue[this.fcIndex];
                this.speakEnglish(finishedCollocation, 0.94, () => {
                    if (nextItem) {
                        setTimeout(() => this.speakEnglish(nextItem.collocation, 0.92), 260);
                    }
                });
            }

            // =========================================================================
            // FEATURE 2B: MULTIPLE CHOICE QUIZ (2-WAY + SRS SYNC)
            // =========================================================================
            setQuizDirection(dir) {
                this.quizDirection = dir;
                this.initQuiz(this.quizOnlyDue);
                this.render();
            }

            initQuiz(onlyDue = false) {
                const deck = this.getActiveDeck();
                if (!deck || deck.items.length === 0) {
                    this.quizQueue = [];
                    return;
                }
                this.quizOnlyDue = onlyDue;
                let sourceItems = onlyDue ? this.getDueItemsForDeck(deck) : [...deck.items];
                if (onlyDue && sourceItems.length === 0) {
                    this.quizOnlyDue = false;
                    sourceItems = [...deck.items];
                }
                this.quizQueue = sourceItems.sort(() => Math.random() - 0.5);
                this.quizIndex = 0;
                this.quizScore = 0;
                this.quizShowPronunciationTip = false;
                this.prepareQuizQuestion();
            }

            prepareQuizQuestion() {
                const deck = this.getActiveDeck();
                const current = this.quizQueue[this.quizIndex];
                this.quizAnswered = false;
                this.quizShowPronunciationTip = false;
                if (!current || !deck) return;

                const distractorsPool = deck.items.filter(it => it.id !== current.id);
                const shuffledDistractors = distractorsPool.sort(() => Math.random() - 0.5).slice(0, 3);
                const rawOptions = [
                    { item: current, isCorrect: true, selected: false },
                    ...shuffledDistractors.map(d => ({ item: d, isCorrect: false, selected: false }))
                ];
                this.quizOptions = rawOptions.sort(() => Math.random() - 0.5);
            }

            selectQuizOption(optIndex) {
                if (this.quizAnswered) return;
                this.quizAnswered = true;
                const chosen = this.quizOptions[optIndex];
                if (!chosen) return;
                chosen.selected = true;

                const deck = this.getActiveDeck();
                const current = this.quizQueue[this.quizIndex];
                if (chosen.isCorrect) {
                    this.quizScore++;
                    this.speakEnglish(current.collocation);
                    this.advanceItemSRS(deck?.id, current.id, "good");
                } else {
                    this.advanceItemSRS(deck?.id, current.id, "hard");
                }
                this.render();
            }

            nextQuizQuestion() {
                const current = this.quizQueue[this.quizIndex];
                const advance = () => {
                    this.quizIndex++;
                    this.quizShowPronunciationTip = false;
                    if (this.quizIndex < this.quizQueue.length) {
                        this.prepareQuizQuestion();
                    }
                    this.render();
                };
                if (current) {
                    this.speakEnglish(current.collocation, 0.94, advance);
                } else {
                    advance();
                }
            }

            // =========================================================================
            // FEATURE 2C: TWO-WAY WRITING PRACTICE (VI -> EN & EN -> VI + SRS SYNC)
            // =========================================================================
            setWriteDirection(dir) {
                this.writeDirection = dir;
                this.initWriting(this.writeOnlyDue);
                this.render();
            }

            initWriting(onlyDue = false) {
                const deck = this.getActiveDeck();
                if (!deck || deck.items.length === 0) {
                    this.writeQueue = [];
                    return;
                }
                this.writeOnlyDue = onlyDue;
                let sourceItems = onlyDue ? this.getDueItemsForDeck(deck) : [...deck.items];
                if (onlyDue && sourceItems.length === 0) {
                    this.writeOnlyDue = false;
                    sourceItems = [...deck.items];
                }
                this.writeQueue = sourceItems.sort(() => Math.random() - 0.5);
                this.writeIndex = 0;
                this.writeScore = 0;
                this.writeShowPronunciationTip = false;
                this.prepareWritingPrompt();
            }

            prepareWritingPrompt() {
                this.writeAnswered = false;
                this.writeLastResult = null;
                this.writeShowPronunciationTip = false;
                if (this.writeDirection === "mixed") {
                    this.currentItemDirection = Math.random() < 0.5 ? "vi-to-en" : "en-to-vi";
                } else {
                    this.currentItemDirection = this.writeDirection;
                }
            }

            normalizeText(str) {
                return (str || "")
                    .toLowerCase()
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .replace(/[^a-z0-9\s]/g, " ")
                    .replace(/\s+/g, " ")
                    .trim();
            }

            async checkWritingAnswer() {
                if (this.writeAnswered || this.isCheckingWritingAI) return;
                const inputEl = document.getElementById("writing-answer-input");
                const userAnswer = (inputEl ? inputEl.value : "").trim();
                if (!userAnswer) {
                    this.showToast("Bạn hãy nhập câu trả lời trước khi kiểm tra nhé!");
                    return;
                }

                const current = this.writeQueue[this.writeIndex];
                if (!current) return;

                const deck = this.getActiveDeck();

                if (this.currentItemDirection === "vi-to-en") {
                    const normUser = this.normalizeText(userAnswer);
                    const normTarget = this.normalizeText(current.collocation);
                    const isExact = normUser === normTarget;
                    this.writeAnswered = true;
                    if (isExact) {
                        this.writeScore++;
                        this.speakEnglish(current.collocation);
                        this.advanceItemSRS(deck?.id, current.id, "good");
                    } else {
                        this.advanceItemSRS(deck?.id, current.id, "hard");
                    }
                    this.writeLastResult = {
                        isCorrect: isExact,
                        userAnswer,
                        expected: current.collocation,
                        feedback: isExact
                            ? "Chính xác tuyệt đối! Bạn đã viết chuẩn cụm Collocation tiếng Anh."
                            : `Đáp án chuẩn là: "${current.collocation}" (đã đặt lại lịch ôn 1 ngày để nhớ kỹ hơn).`
                    };
                    this.render();
                } else {
                    const normUser = this.normalizeText(userAnswer);
                    const normTarget = this.normalizeText(current.meaning);
                    if (normUser === normTarget || (normUser.length >= 4 && normTarget.includes(normUser))) {
                        this.writeAnswered = true;
                        this.writeScore++;
                        this.advanceItemSRS(deck?.id, current.id, "good");
                        this.writeLastResult = {
                            isCorrect: true,
                            userAnswer,
                            expected: current.meaning,
                            feedback: `Rất chuẩn xác! Nghĩa đầy đủ: "${current.meaning}".`
                        };
                        this.render();
                        return;
                    }

                    this.isCheckingWritingAI = true;
                    this.render();
                    try {
                        const schema = {
                            type: "OBJECT",
                            properties: {
                                isCorrect: { type: "BOOLEAN" },
                                feedback: { type: "STRING" }
                            },
                            required: ["isCorrect", "feedback"]
                        };
                        const prompt = `Cụm từ tiếng Anh: "${current.collocation}"
Nghĩa gốc tham khảo: "${current.meaning}"
Câu trả lời tiếng Việt của học viên: "${userAnswer}"
Hãy đánh giá xem câu trả lời của học viên có diễn đạt đúng ý nghĩa của cụm tiếng Anh trên không (chấp nhận cách diễn đạt đồng nghĩa tự nhiên trong tiếng Việt). Trả về JSON gồm isCorrect (true/false) và feedback (giải thích ngắn gọn 1 câu bằng tiếng Việt).`;
                        const raw = await callGeminiAPI({
                            contents: [{ role: "user", parts: [{ text: prompt }] }],
                            responseSchema: schema
                        });
                        const res = JSON.parse(raw);
                        this.writeAnswered = true;
                        if (res.isCorrect) {
                            this.writeScore++;
                            this.advanceItemSRS(deck?.id, current.id, "good");
                        } else {
                            this.advanceItemSRS(deck?.id, current.id, "hard");
                        }
                        this.writeLastResult = {
                            isCorrect: Boolean(res.isCorrect),
                            userAnswer,
                            expected: current.meaning,
                            feedback: res.feedback || `Nghĩa tham khảo: "${current.meaning}".`
                        };
                    } catch (e) {
                        this.writeAnswered = true;
                        this.advanceItemSRS(deck?.id, current.id, "hard");
                        this.writeLastResult = {
                            isCorrect: false,
                            userAnswer,
                            expected: current.meaning,
                            feedback: `Nghĩa tham khảo chuẩn: "${current.meaning}".`
                        };
                    } finally {
                        this.isCheckingWritingAI = false;
                        this.render();
                    }
                }
            }

            nextWritingQuestion() {
                const current = this.writeQueue[this.writeIndex];
                const advance = () => {
                    this.writeIndex++;
                    this.writeShowPronunciationTip = false;
                    if (this.writeIndex < this.writeQueue.length) {
                        this.prepareWritingPrompt();
                    }
                    this.render();
                };
                if (current) {
                    this.speakEnglish(current.collocation, 0.94, advance);
                } else {
                    advance();
                }
            }

            // =========================================================================
            // FEATURE 3: AI SPEAKING TUTOR (LONG MANUAL RECORDING + BAND 6.5 - 7.5+)
            // =========================================================================
            initSpeechRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) return;
                this.recognition = new SpeechRecognition();
                this.recognition.lang = "en-US";
                this.recognition.continuous = true;
                this.recognition.interimResults = true;
                this.recognition.maxAlternatives = 1;

                this.recognition.onresult = (event) => {
                    let interimTranscript = "";
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            this.finalTranscriptBuffer += (this.finalTranscriptBuffer ? " " : "") + transcript.trim();
                        } else {
                            interimTranscript += transcript;
                        }
                    }
                    const combined = [this.finalTranscriptBuffer, interimTranscript.trim()].filter(Boolean).join(" ");
                    const inputEl = document.getElementById("speaking-user-input");
                    if (inputEl) inputEl.value = combined;
                    const liveBox = document.getElementById("live-transcript-preview");
                    if (liveBox) {
                        liveBox.textContent = combined || "Đang lắng nghe giọng nói của bạn... Hãy nói thoải mái và nhấn 'Dừng ghi âm' khi nói xong.";
                    }
                };

                this.recognition.onerror = (event) => {
                    if (event.error === "no-speech" || event.error === "aborted") return;
                    if (event.error === "not-allowed" || event.error === "service-not-allowed") {
                        this.stopRecording(true);
                        this.showToast("Trình duyệt chưa cấp quyền Micro. Bạn có thể gõ câu trả lời nhé!");
                    }
                };

                this.recognition.onend = () => {
                    if (this.isRecording) {
                        try {
                            this.recognition.start();
                        } catch (e) {
                            setTimeout(() => {
                                if (this.isRecording) {
                                    try { this.recognition.start(); } catch (_) {}
                                }
                            }, 250);
                        }
                    } else {
                        this.updateMicUI();
                    }
                };
            }

            toggleRecording() {
                if (!this.recognition) {
                    this.showToast("Trình duyệt chưa hỗ trợ nhận diện giọng nói. Hãy dùng Chrome/Edge hoặc nhập văn bản.");
                    return;
                }
                if (this.isRecording) {
                    this.stopRecording();
                } else {
                    this.startRecording();
                }
            }

            startRecording() {
                if (!this.recognition || this.isRecording) return;
                const inputEl = document.getElementById("speaking-user-input");
                this.finalTranscriptBuffer = inputEl && inputEl.value.trim() ? inputEl.value.trim() : "";
                this.recordingSeconds = 0;
                this.isRecording = true;

                clearInterval(this.recordingTimer);
                this.recordingTimer = setInterval(() => {
                    if (!this.isRecording) return;
                    this.recordingSeconds++;
                    const timerEl = document.getElementById("recording-timer-text");
                    if (timerEl) timerEl.textContent = this.formatDuration(this.recordingSeconds);
                }, 1000);

                try {
                    this.recognition.start();
                } catch (e) {
                    console.warn("Speech start error:", e);
                }
                this.updateMicUI();
            }

            stopRecording(silent = false) {
                this.isRecording = false;
                clearInterval(this.recordingTimer);
                this.recordingTimer = null;
                try {
                    if (this.recognition) this.recognition.stop();
                } catch (e) {}
                this.updateMicUI();
                if (!silent) {
                    this.showToast("Đã dừng ghi âm! Bạn có thể kiểm tra lại câu hoặc bấm Gửi cho AI.");
                }
            }

            formatDuration(totalSec) {
                const mins = Math.floor(totalSec / 60).toString().padStart(2, "0");
                const secs = (totalSec % 60).toString().padStart(2, "0");
                return `${mins}:${secs}`;
            }

            updateMicUI() {
                const panel = document.getElementById("speaking-controls-wrapper");
                if (panel) {
                    panel.innerHTML = this.renderSpeakingControlsInner();
                    if (window.lucide) lucide.createIcons();
                }
            }

            pickRandomTargetCollocations(count = 2) {
                const deck = this.getActiveDeck();
                if (!deck || deck.items.length === 0) return [];
                const shuffled = [...deck.items].sort(() => Math.random() - 0.5);
                return shuffled.slice(0, Math.min(count, shuffled.length));
            }

            resetSpeakingSession() {
                if (this.isRecording) this.stopRecording(true);
                this.speakingMessages = [];
                this.targetSpeakingCollocations = [];
            }

            async initSpeakingSession() {
                const deck = this.getActiveDeck();
                if (!deck || deck.items.length === 0) return;

                if (this.isRecording) this.stopRecording(true);
                this.targetSpeakingCollocations = this.pickRandomTargetCollocations(2);
                this.speakingMessages = [];
                this.isSpeakingLoading = true;
                this.render();

                const targetsText = this.targetSpeakingCollocations
                    .map(t => `"${t.collocation}" (${t.meaning})`)
                    .join(" và ");

                const systemInstruction = `Bạn là giáo viên luyện nói tiếng Anh IELTS Speaking thân thiện của TlingEnglish.
Nhiệm vụ: Đặt 1 câu hỏi giao tiếp/IELTS Speaking Part 1-3 ngắn gọn, tự nhiên bằng tiếng Anh để khuyến khích học viên trả lời có sử dụng cụm từ chỉ định: ${targetsText}.
Chỉ trả về JSON gồm:
- questionEn: câu hỏi tiếng Anh (1-2 câu tự nhiên)
- hintVi: gợi ý ngắn gọn bằng tiếng Việt (1 câu) cách lồng ghép cụm từ chỉ định vào câu trả lời.`;

                const schema = {
                    type: "OBJECT",
                    properties: {
                        questionEn: { type: "STRING" },
                        hintVi: { type: "STRING" }
                    },
                    required: ["questionEn", "hintVi"]
                };

                try {
                    const raw = await callGeminiAPI({
                        contents: [{ role: "user", parts: [{ text: `Hãy đặt câu hỏi luyện nói để tôi dùng cụm: ${targetsText}` }] }],
                        systemInstruction,
                        responseSchema: schema
                    });
                    const parsed = JSON.parse(raw);
                    this.speakingMessages.push({
                        role: "ai",
                        questionEn: parsed.questionEn,
                        hintVi: parsed.hintVi,
                        targets: this.targetSpeakingCollocations.map(t => t.collocation)
                    });
                    this.speakEnglish(parsed.questionEn);
                } catch (e) {
                    const fallbackTarget = this.targetSpeakingCollocations[0]?.collocation || "make an informed decision";
                    const fallbackQ = `In your daily life or studies, when is it most important to ${fallbackTarget}?`;
                    this.speakingMessages.push({
                        role: "ai",
                        questionEn: fallbackQ,
                        hintVi: `Gợi ý: Hãy kể một tình huống thực tế của bạn và lồng ghép cụm "${fallbackTarget}".`,
                        targets: this.targetSpeakingCollocations.map(t => t.collocation)
                    });
                    this.speakEnglish(fallbackQ);
                } finally {
                    this.isSpeakingLoading = false;
                    this.render();
                }
            }

            async submitSpeakingReply() {
                if (this.isRecording) {
                    this.stopRecording(true);
                }
                const inputEl = document.getElementById("speaking-user-input");
                const userText = (inputEl ? inputEl.value : "").trim();
                if (!userText || this.isSpeakingLoading) {
                    this.showToast("Bạn hãy nói hoặc nhập câu trả lời tiếng Anh trước nhé!");
                    return;
                }

                const usedTargets = this.targetSpeakingCollocations
                    .filter(t => this.normalizeText(userText).includes(this.normalizeText(t.collocation)))
                    .map(t => t.collocation);

                this.speakingMessages.push({
                    role: "user",
                    text: userText,
                    usedTargets
                });

                this.finalTranscriptBuffer = "";
                if (inputEl) inputEl.value = "";
                this.isSpeakingLoading = true;
                this.render();

                const nextTargets = this.pickRandomTargetCollocations(2);
                const currentTargetNames = this.targetSpeakingCollocations.map(t => t.collocation).join(", ");
                const nextTargetNames = nextTargets.map(t => `"${t.collocation}" (${t.meaning})`).join(" và ");

                const systemInstruction = `Bạn là giám khảo và huấn luyện viên IELTS Speaking 8.5+ tại TlingEnglish.
Học viên vừa trả lời câu hỏi luyện nói tiếng Anh với mục tiêu sử dụng cụm từ chỉ định: [${currentTargetNames}].
Nhiệm vụ của bạn:
1. Sửa lỗi câu nói của học viên (correctedSentence): chỉnh lại các lỗi ngữ pháp, thì, giới từ, mạo từ hoặc cách diễn đạt chưa tự nhiên thành câu tiếng Anh chuẩn xác, giữ nguyên ý gốc của học viên. Nếu câu đã đúng, hãy tinh chỉnh nhẹ cho tự nhiên hơn.
2. Giải thích sửa lỗi (correctionNotesVi): giải thích ngắn gọn, dễ hiểu bằng tiếng Việt những điểm đã sửa (nếu câu đã đúng hoàn toàn thì khen ngợi và chỉ ra điểm tốt).
3. Nâng cấp lên Band 6.5 - 7.5+ (upgradedBandSentence): viết lại câu trả lời của học viên theo văn phong tự nhiên, mạch lạc chuẩn IELTS Band 6.5 - 7.5+, có sử dụng khéo léo cụm từ chỉ định [${currentTargetNames}] và từ vựng học thuật/tự nhiên đắt giá.
4. Phân tích từ vựng/cấu trúc Band cao (bandUpgradeNotesVi): giải thích bằng tiếng Việt những cụm từ/cấu trúc hay đã dùng trong câu nâng cấp để học viên học theo.
5. Đặt câu hỏi tiếp theo (nextQuestionEn) bằng tiếng Anh để học viên luyện tiếp với cụm từ chỉ định mới: ${nextTargetNames}, kèm gợi ý tiếng Việt (nextHintVi).`;

                const schema = {
                    type: "OBJECT",
                    properties: {
                        correctedSentence: { type: "STRING" },
                        correctionNotesVi: { type: "STRING" },
                        upgradedBandSentence: { type: "STRING" },
                        bandUpgradeNotesVi: { type: "STRING" },
                        nextQuestionEn: { type: "STRING" },
                        nextHintVi: { type: "STRING" }
                    },
                    required: [
                        "correctedSentence",
                        "correctionNotesVi",
                        "upgradedBandSentence",
                        "bandUpgradeNotesVi",
                        "nextQuestionEn",
                        "nextHintVi"
                    ]
                };

                try {
                    const lastAiQ = [...this.speakingMessages].reverse().find(m => m.role === "ai")?.questionEn || "";
                    const prompt = `Câu hỏi của giáo viên: "${lastAiQ}"
Câu trả lời của học viên: "${userText}"
Cụm từ chỉ định cần dùng trong câu trả lời này: ${currentTargetNames}
Cụm từ chỉ định cho câu hỏi tiếp theo: ${nextTargetNames}`;

                    const raw = await callGeminiAPI({
                        contents: [{ role: "user", parts: [{ text: prompt }] }],
                        systemInstruction,
                        responseSchema: schema
                    });
                    const parsed = JSON.parse(raw);

                    this.targetSpeakingCollocations = nextTargets;
                    this.speakingMessages.push({
                        role: "ai",
                        correctedSentence: parsed.correctedSentence,
                        correctionNotesVi: parsed.correctionNotesVi,
                        upgradedBandSentence: parsed.upgradedBandSentence,
                        bandUpgradeNotesVi: parsed.bandUpgradeNotesVi,
                        questionEn: parsed.nextQuestionEn,
                        hintVi: parsed.nextHintVi,
                        targets: nextTargets.map(t => t.collocation)
                    });
                    this.speakEnglish(parsed.nextQuestionEn);
                } catch (e) {
                    this.targetSpeakingCollocations = nextTargets;
                    const fallbackNext = nextTargets[0]?.collocation || "strike a healthy balance";
                    const q = `That's interesting! How do you usually ${fallbackNext} when you are busy?`;
                    this.speakingMessages.push({
                        role: "ai",
                        correctedSentence: userText,
                        correctionNotesVi: "Ý tưởng của bạn rất rõ ràng! Hãy chú ý chia đúng thì động từ và nhấn trọng âm vào cụm Collocation.",
                        upgradedBandSentence: `From my perspective, making an effort to ${currentTargetNames.split(",")[0] || "stay consistent"} plays a vital role in achieving long-term success.`,
                        bandUpgradeNotesVi: "Sử dụng cụm mở đầu 'From my perspective' và 'plays a vital role in + V-ing' giúp câu nói đạt chuẩn Band 6.5 - 7.0.",
                        questionEn: q,
                        hintVi: `Hãy dùng cụm "${fallbackNext}" để chia sẻ cách bạn cân bằng thời gian.`,
                        targets: nextTargets.map(t => t.collocation)
                    });
                    this.speakEnglish(q);
                } finally {
                    this.isSpeakingLoading = false;
                    this.render();
                    setTimeout(() => {
                        const chatBox = document.getElementById("speaking-chat-scroll");
                        if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
                    }, 50);
                }
            }

            // =========================================================================
            // RENDERING VIEWS
            // =========================================================================
            escapeHtml(str) {
                return String(str || "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            render() {
                this.renderHeaderControls();

                const mainEl = document.getElementById("app-main");
                if (!mainEl) return;

                switch (this.currentTab) {
                    case "home":
                        mainEl.innerHTML = this.renderHomeView();
                        break;
                    case "creator":
                        mainEl.innerHTML = this.renderCreatorView();
                        break;
                    case "deck-hub":
                        mainEl.innerHTML = this.renderDeckHubView();
                        break;
                    case "srs":
                        mainEl.innerHTML = this.renderSRSView();
                        break;
                    case "flashcards":
                        mainEl.innerHTML = this.renderFlashcardsView();
                        break;
                    case "quiz":
                        mainEl.innerHTML = this.renderQuizView();
                        break;
                    case "writing":
                        mainEl.innerHTML = this.renderWritingView();
                        break;
                    case "speaking":
                        mainEl.innerHTML = this.renderSpeakingView();
                        break;
                }

                if (window.lucide) {
                    lucide.createIcons();
                }
            }

            renderHeaderControls() {
                const selectEl = document.getElementById("active-deck-select");
                if (selectEl) {
                    selectEl.innerHTML = this.state.decks.map(d => {
                        const dueCount = this.getDueItemsForDeck(d).length;
                        return `<option value="${d.id}" ${d.id === this.state.activeDeckId ? "selected" : ""}>
                            ${this.escapeHtml(d.title)} (${d.items.length} cụm${dueCount > 0 ? ` • ${dueCount} đến hạn` : ""})
                        </option>`;
                    }).join("");
                }

                const navEl = document.getElementById("nav-tabs");
                if (!navEl) return;

                const activeDeck = this.getActiveDeck();
                const activeDue = activeDeck ? this.getDueItemsForDeck(activeDeck).length : 0;

                // If on Home or Creator, show Home & Creator breadcrumbs
                if (this.currentTab === "home" || this.currentTab === "creator") {
                    navEl.innerHTML = `
                        <button type="button" onclick="app.goHome()"
                            class="px-3.5 py-2 rounded-2xl text-xs sm:text-sm font-semibold flex items-center gap-2 transition-all ${
                                this.currentTab === "home"
                                    ? "bg-pinky-600 text-white shadow-sm shadow-pinky-500/25"
                                    : "text-slate-600 hover:text-pinky-700 hover:bg-pinky-50"
                            }">
                            <i data-lucide="home" class="w-4 h-4"></i>
                            <span>Trang chủ (Danh sách bộ file)</span>
                        </button>
                        <button type="button" onclick="app.switchTab('creator')"
                            class="px-3.5 py-2 rounded-2xl text-xs sm:text-sm font-semibold flex items-center gap-2 transition-all ${
                                this.currentTab === "creator"
                                    ? "bg-pinky-600 text-white shadow-sm shadow-pinky-500/25"
                                    : "text-slate-600 hover:text-pinky-700 hover:bg-pinky-50"

                if (this.fcQueue.length === 0) {
                    this.initFlashcards();

                if (this.fcIndex >= this.fcQueue.length) {
                    return `

                            </div>
                        </div>

                }

                const item = this.fcQueue[this.fcIndex];
                const progressPct = Math.round(((this.fcIndex) / this.fcQueue.length) * 100);
                const hardDays = this.getNextIntervalDays(item.srsStage, "hard");
                const goodDays = this.getNextIntervalDays(item.srsStage, "good");
