                                <div class="flip-card-front bg-white rounded-3xl border-2 border-pinky-200 shadow-lg shadow-pinky-500/10 p-6 sm:p-8 flex flex-col justify-between">
                                    <div class="flex flex-wrap items-center justify-between gap-2">
                                        <span class="text-xs font-extrabold uppercase tracking-wider px-3 py-1 rounded-full bg-pinky-50 text-pinky-700 border border-pinky-200">
                                            ${item.baseWord ? `Từ gốc: ${this.escapeHtml(item.baseWord)}` : "Collocation"}
                                        </span>
                                        <div class="flex items-center gap-1.5">
                                            <button type="button" onclick="event.stopPropagation(); app.togglePronunciationGuide('fc')"
                                                    class="px-3 py-1.5 rounded-xl ${this.fcShowPronunciationTip ? "bg-pinky-600 text-white" : "bg-pinky-50 hover:bg-pinky-100 text-pinky-700 border border-pinky-200"} text-xs font-bold flex items-center gap-1.5 transition-colors">
                                                <i data-lucide="ear" class="w-3.5 h-3.5"></i> Cách đọc
                                            </button>
                                            <button type="button" onclick="event.stopPropagation(); app.speakEnglish('${this.escapeHtml(item.collocation).replace(/'/g, "\\'")}')"
                                                    class="p-2.5 rounded-2xl bg-pinky-50 hover:bg-pinky-100 text-pinky-600 transition-colors" title="Nghe phát âm (Phím A)">
                                                <i data-lucide="volume-2" class="w-5 h-5"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <div class="text-center my-auto px-2 overflow-y-auto max-h-60">
                                        <h2 class="text-2xl sm:text-4xl font-display font-extrabold text-slate-900 mb-2 leading-tight">
                                            ${this.escapeHtml(item.collocation)}
                                        </h2>
                                        ${item.ipa ? `<p class="text-sm sm:text-base font-mono text-pinky-600">${this.escapeHtml(item.ipa)}</p>` : ""}
                                        ${this.fcShowPronunciationTip ? this.buildPronunciationBreakdown(item) : ""}
                                    </div>

                                    <div class="text-center text-xs font-semibold text-slate-400 flex items-center justify-center gap-1.5">
                                        <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i> Chạm vào thẻ hoặc nhấn Space để xem nghĩa & ví dụ
                                    </div>
                                </div>

                                <!-- Back Side -->
                                <div class="flip-card-back bg-gradient-to-br from-pinky-50 via-white to-pinky-100/70 rounded-3xl border-2 border-pinky-300 shadow-lg shadow-pinky-500/10 p-6 sm:p-8 flex flex-col justify-between overflow-y-auto">
                                    <div class="flex flex-wrap items-center justify-between gap-2">
                                        <span class="text-xs font-extrabold uppercase tracking-wider px-3 py-1 rounded-full bg-white text-pinky-700 border border-pinky-200">
                                            Nghĩa tiếng Việt & Ngữ cảnh
                                        </span>
                                        <div class="flex items-center gap-1.5">
                                            <button type="button" onclick="event.stopPropagation(); app.togglePronunciationGuide('fc')"
                                                    class="px-3 py-1.5 rounded-xl ${this.fcShowPronunciationTip ? "bg-pinky-600 text-white" : "bg-white hover:bg-pinky-100 text-pinky-700 border border-pinky-200"} text-xs font-bold flex items-center gap-1.5 transition-colors">
                                                <i data-lucide="ear" class="w-3.5 h-3.5"></i> Cách đọc
                                            </button>
                                            <button type="button" onclick="event.stopPropagation(); app.speakEnglish('${this.escapeHtml(item.exampleEn || item.collocation).replace(/'/g, "\\'")}')"
                                                    class="px-3 py-1.5 rounded-xl bg-white hover:bg-pinky-100 text-pinky-700 border border-pinky-200 text-xs font-bold flex items-center gap-1.5 transition-colors">
                                                <i data-lucide="volume-2" class="w-4 h-4"></i> Nghe ví dụ
                                            </button>
                                        </div>
                                    </div>

                                    <div class="my-auto space-y-3">
                                        <h3 class="text-xl sm:text-2xl font-display font-bold text-pinky-800">
                                            ${this.escapeHtml(item.meaning)}
                                        </h3>
                                        ${this.fcShowPronunciationTip ? this.buildPronunciationBreakdown(item) : ""}
                                        ${item.exampleEn ? `
                                            <div class="bg-white/90 rounded-2xl p-4 border border-pinky-200">
                                                <p class="text-sm sm:text-base font-medium text-slate-800 italic mb-1">"${this.escapeHtml(item.exampleEn)}"</p>
                                                ${item.exampleVi ? `<p class="text-xs sm:text-sm text-slate-500">→ ${this.escapeHtml(item.exampleVi)}</p>` : ""}
                                            </div>
                                        ` : ""}
                                    </div>

                                    <div class="text-center text-xs font-semibold text-pinky-600">
                                        Phát âm lại & tự động chuyển sang từ tiếp theo khi bạn chọn bên dưới
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Keyboard < and > Quick Switch Bar (Chưa thuộc <-> Thuộc rồi) -->
                        <div class="mb-3 p-2.5 rounded-2xl bg-white border border-pinky-200 shadow-2xs flex items-center justify-between gap-2">
                            <button type="button" onclick="app.fcLastDirectionHint='left'; app.rateFlashcard('hard')"
                                    class="flex-1 py-2.5 px-3 rounded-xl bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-700 font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition-all">
                                <kbd class="px-2 py-0.5 rounded-lg bg-white border border-rose-200 text-rose-700 font-mono text-xs shadow-2xs">&lt; / ←</kbd>
                                <span>Chưa thuộc (${hardDays}d)</span>
                            </button>
                            <div class="hidden sm:flex flex-col items-center px-2 text-center">
                                <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Phím &lt; &gt;</span>
                                <span class="text-[11px] font-bold text-pinky-600">Đọc lại & Chuyển</span>
                            </div>
                            <button type="button" onclick="app.fcLastDirectionHint='right'; app.rateFlashcard('easy')"
                                    class="flex-1 py-2.5 px-3 rounded-xl bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-700 font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition-all">
                                <span>Thuộc rồi (${easyDays}d)</span>
                                <kbd class="px-2 py-0.5 rounded-lg bg-white border border-emerald-200 text-emerald-700 font-mono text-xs shadow-2xs">&gt; / →</kbd>
                            </button>
                        </div>

                        <!-- Spaced Repetition Rating Buttons (1 -> 2 -> 5 -> 10 -> 20 days) -->
                        <div class="grid grid-cols-3 gap-3 mb-4">
                            <button type="button" onclick="app.fcLastDirectionHint='left'; app.rateFlashcard('hard')" class="py-3 px-2.5 rounded-2xl bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-700 font-bold text-xs sm:text-sm transition-all flex flex-col items-center">
                                <span>1. Chưa thuộc</span>
                                <span class="text-[11px] font-semibold opacity-80 mt-0.5">Ôn lại sau ${hardDays} ngày</span>
                            </button>
                            <button type="button" onclick="app.rateFlashcard('good')" class="py-3 px-2.5 rounded-2xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-700 font-bold text-xs sm:text-sm transition-all flex flex-col items-center">
                                <span>2. Nhớ được</span>
                                <span class="text-[11px] font-semibold opacity-80 mt-0.5">Ôn lại sau ${goodDays} ngày</span>
                            </button>
                            <button type="button" onclick="app.fcLastDirectionHint='right'; app.rateFlashcard('easy')" class="py-3 px-2.5 rounded-2xl bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-700 font-bold text-xs sm:text-sm transition-all flex flex-col items-center">
                                <span>3. Thuộc rồi</span>
                                <span class="text-[11px] font-semibold opacity-80 mt-0.5">Ôn lại sau ${easyDays} ngày</span>
                            </button>
                        </div>

                        <!-- Transition Example Strip (Shows example usage of current/previous card for context) -->
                        <div class="p-4 rounded-3xl bg-white border border-pinky-200 shadow-2xs space-y-2">
                            <div class="flex items-center justify-between gap-2">
                                <span class="text-[11px] font-extrabold uppercase tracking-wider text-pinky-600 flex items-center gap-1.5">
                                    <i data-lucide="quote" class="w-3.5 h-3.5"></i>
                                    ${prevItem ? `Vừa ôn: "${this.escapeHtml(prevItem.collocation)}" • Ví dụ áp dụng:` : `Gợi ý câu ví dụ áp dụng thẻ hiện tại:`}
                                </span>
                                <button type="button" onclick="app.speakEnglish('${this.escapeHtml((prevItem || item).exampleEn || (prevItem || item).collocation).replace(/'/g, "\\'")}')"
                                        class="px-2.5 py-1 rounded-xl bg-pinky-50 hover:bg-pinky-100 text-pinky-700 text-xs font-bold flex items-center gap-1 transition-colors">
                                    <i data-lucide="volume-2" class="w-3.5 h-3.5"></i> Nghe câu
                                </button>
                            </div>
                            <p class="text-xs sm:text-sm font-medium text-slate-800 italic">
                                "${this.escapeHtml((prevItem || item).exampleEn || `Try to use "${(prevItem || item).collocation}" naturally in your speaking.`)}"
                            </p>
                            ${(prevItem || item).exampleVi ? `<p class="text-xs text-slate-500">→ ${this.escapeHtml((prevItem || item).exampleVi)}</p>` : ""}
                        </div>
                    </div>
                `;
            }

            // =========================================================================
            // VIEW 3: MULTIPLE CHOICE QUIZ
            // =========================================================================
            renderQuizView() {
                const deck = this.getActiveDeck();
                if (!deck || deck.items.length === 0) {
                    return this.renderEmptyDeckPrompt("Trắc nghiệm");
                }
                if (this.quizQueue.length === 0) this.initQuiz();

                if (this.quizIndex >= this.quizQueue.length) {
                    const pct = Math.round((this.quizScore / this.quizQueue.length) * 100);
                    return `
                        <div class="max-w-xl mx-auto bg-white rounded-3xl border border-pinky-200 p-8 text-center shadow-sm">
                            <div class="w-16 h-16 rounded-3xl bg-pinky-100 text-pinky-600 flex items-center justify-center mx-auto mb-4 text-3xl">
                                🎯
                            </div>
                            <h2 class="text-2xl font-display font-bold text-slate-900 mb-2">Kết quả bài Trắc nghiệm</h2>
                            <p class="text-3xl font-extrabold text-pinky-600 mb-2">${this.quizScore} / ${this.quizQueue.length} (${pct}%)</p>
                            <p class="text-sm text-slate-500 mb-6">Phản xạ nhận diện Collocation của bạn đang tiến bộ rất tốt!</p>
                            <button type="button" onclick="app.initQuiz(); app.render();" class="px-6 py-3 rounded-2xl bg-pinky-600 hover:bg-pinky-700 text-white font-bold text-sm shadow-sm transition-all">
                                Làm lại bài trắc nghiệm
                            </button>
                        </div>
                    `;
                }

                const current = this.quizQueue[this.quizIndex];
                const isEnToVi = this.quizDirection === "en-to-vi";

                return `
                    <div class="max-w-2xl mx-auto">
                        <!-- Top Controls -->
                        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                            <div class="inline-flex p-1 rounded-2xl bg-white border border-pinky-200 shadow-2xs">
                                <button type="button" onclick="app.setQuizDirection('en-to-vi')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${isEnToVi ? "bg-pinky-600 text-white" : "text-slate-600 hover:text-pinky-600"}">
                                    Anh → Việt
                                </button>
                                <button type="button" onclick="app.setQuizDirection('vi-to-en')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${!isEnToVi ? "bg-pinky-600 text-white" : "text-slate-600 hover:text-pinky-600"}">
                                    Việt → Anh
                                </button>
                            </div>
                            <div class="text-xs font-bold text-slate-600 bg-white px-3.5 py-2 rounded-2xl border border-pinky-200">
                                Câu ${this.quizIndex + 1}/${this.quizQueue.length} • Điểm: <span class="text-pinky-600">${this.quizScore}</span>
                            </div>
                        </div>

                        <!-- Question Card -->
                        <div class="bg-white rounded-3xl border border-pinky-200 p-6 sm:p-8 shadow-sm mb-4">
                            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                                <span class="text-xs font-extrabold uppercase tracking-wider text-pinky-600">
                                    ${isEnToVi ? "Chọn nghĩa tiếng Việt đúng của cụm từ:" : "Chọn Collocation tiếng Anh tương ứng:"}
                                </span>
                                <div class="flex items-center gap-1.5">
                                    <button type="button" onclick="app.togglePronunciationGuide('quiz')"
                                            class="px-3 py-1.5 rounded-xl ${this.quizShowPronunciationTip ? "bg-pinky-600 text-white" : "bg-pinky-50 hover:bg-pinky-100 text-pinky-700 border border-pinky-200"} text-xs font-bold flex items-center gap-1.5 transition-colors">
                                        <i data-lucide="ear" class="w-3.5 h-3.5"></i> Cách đọc
                                    </button>
                                    ${isEnToVi ? `
                                        <button type="button" onclick="app.speakEnglish('${this.escapeHtml(current.collocation).replace(/'/g, "\\'")}')"
                                                class="p-2 rounded-xl bg-pinky-50 hover:bg-pinky-100 text-pinky-600 transition-colors" title="Nghe phát âm">
                                            <i data-lucide="volume-2" class="w-4 h-4"></i>
                                        </button>
                                    ` : ""}
                                </div>
                            </div>

                            <h2 class="text-2xl sm:text-3xl font-display font-extrabold text-slate-900 mb-1">
                                ${this.escapeHtml(isEnToVi ? current.collocation : current.meaning)}
                            </h2>
                            ${isEnToVi && current.ipa ? `<p class="text-sm font-mono text-slate-400 mb-2">${this.escapeHtml(current.ipa)}</p>` : ""}
                            ${this.quizShowPronunciationTip ? this.buildPronunciationBreakdown(current) : ""}

                            <!-- Options Grid -->
                            <div class="grid grid-cols-1 gap-3 mt-5">
                                ${this.quizOptions.map((opt, idx) => {
                                    const label = isEnToVi ? opt.item.meaning : opt.item.collocation;
                                    let btnStyle = "bg-pinky-50/40 hover:bg-pinky-50 border-pinky-200 text-slate-800";
                                    if (this.quizAnswered) {
                                        if (opt.isCorrect) {
                                            btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-900 ring-2 ring-emerald-500/20";
                                        } else if (opt.selected && !opt.isCorrect) {
                                            btnStyle = "bg-rose-50 border-rose-500 text-rose-900";
                                        } else {
                                            btnStyle = "bg-slate-50 border-slate-200 text-slate-400 opacity-70";
                                        }
                                    }
                                    return `
                                        <button type="button" ${this.quizAnswered ? "disabled" : ""} onclick="app.selectQuizOption(${idx})"
                                                class="w-full text-left p-4 rounded-2xl border-2 font-semibold text-sm sm:text-base transition-all flex items-center justify-between gap-3 ${btnStyle}">
                                            <div class="flex items-center gap-3">
                                                <span class="w-7 h-7 rounded-xl bg-white border border-pinky-200 text-xs font-extrabold text-pinky-700 flex items-center justify-center shrink-0">
                                                    ${String.fromCharCode(65 + idx)}
                                                </span>
                                                <span>${this.escapeHtml(label)}</span>
                                            </div>
                                            ${this.quizAnswered && opt.isCorrect ? `<i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-600 shrink-0"></i>` : ""}
                                            ${this.quizAnswered && opt.selected && !opt.isCorrect ? `<i data-lucide="x-circle" class="w-5 h-5 text-rose-600 shrink-0"></i>` : ""}
                                        </button>
                                    `;
                                }).join("")}
                            </div>

                            ${this.quizAnswered ? this.buildTransitionExampleBox(current, "app.nextQuizQuestion()", "Câu tiếp theo") : ""}
                        </div>
                    </div>
                `;
            }

            // =========================================================================
            // VIEW 4: TWO-WAY WRITING PRACTICE (VI -> EN & EN -> VI)
            // =========================================================================
            renderWritingView() {
                const deck = this.getActiveDeck();
                if (!deck || deck.items.length === 0) {
                    return this.renderEmptyDeckPrompt("Tập viết 2 chiều");
                }
                if (this.writeQueue.length === 0) this.initWriting();

                if (this.writeIndex >= this.writeQueue.length) {
                    return `
                        <div class="max-w-xl mx-auto bg-white rounded-3xl border border-pinky-200 p-8 text-center shadow-sm">
                            <div class="w-16 h-16 rounded-3xl bg-pinky-100 text-pinky-600 flex items-center justify-center mx-auto mb-4 text-3xl">
                                ✍️
                            </div>
                            <h2 class="text-2xl font-display font-bold text-slate-900 mb-2">Hoàn thành phiên Tập viết!</h2>
                            <p class="text-3xl font-extrabold text-pinky-600 mb-2">${this.writeScore} / ${this.writeQueue.length} chính xác</p>
                            <p class="text-sm text-slate-500 mb-6">Bạn đã chủ động nhớ lại và viết chính xác các cụm từ 2 chiều Anh - Việt.</p>
                            <button type="button" onclick="app.initWriting(); app.render();" class="px-6 py-3 rounded-2xl bg-pinky-600 hover:bg-pinky-700 text-white font-bold text-sm shadow-sm transition-all">
                                Luyện viết lại từ đầu
                            </button>
                        </div>
                    `;
                }

                const current = this.writeQueue[this.writeIndex];
                const isViToEn = this.currentItemDirection === "vi-to-en";

                return `
                    <div class="max-w-2xl mx-auto">
                        <!-- Direction Selector -->
                        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                            <div class="inline-flex p-1 rounded-2xl bg-white border border-pinky-200 shadow-2xs">
                                <button type="button" onclick="app.setWriteDirection('vi-to-en')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${this.writeDirection === "vi-to-en" ? "bg-pinky-600 text-white" : "text-slate-600 hover:text-pinky-600"}">
                                    Việt → Anh
                                </button>
                                <button type="button" onclick="app.setWriteDirection('en-to-vi')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${this.writeDirection === "en-to-vi" ? "bg-pinky-600 text-white" : "text-slate-600 hover:text-pinky-600"}">
                                    Anh → Việt
                                </button>
                                <button type="button" onclick="app.setWriteDirection('mixed')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${this.writeDirection === "mixed" ? "bg-pinky-600 text-white" : "text-slate-600 hover:text-pinky-600"}">
                                    Trộn 2 chiều
                                </button>
                            </div>

                            <div class="text-xs font-bold text-slate-600 bg-white px-3.5 py-2 rounded-2xl border border-pinky-200">
                                Câu ${this.writeIndex + 1}/${this.writeQueue.length} • Đúng: <span class="text-pinky-600">${this.writeScore}</span>
                            </div>
                        </div>

                        <!-- Writing Card -->
                        <div class="bg-white rounded-3xl border border-pinky-200 p-6 sm:p-8 shadow-sm">
                            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                                <span class="text-xs font-extrabold uppercase tracking-wider px-3 py-1 rounded-full ${isViToEn ? "bg-pinky-100 text-pinky-700" : "bg-purple-100 text-purple-700"}">
                                    ${isViToEn ? "Chiều: Tiếng Việt → Tiếng Anh" : "Chiều: Tiếng Anh → Tiếng Việt"}
                                </span>
                                <div class="flex items-center gap-1.5">
                                    <button type="button" onclick="app.togglePronunciationGuide('writing')"
                                            class="px-3 py-1.5 rounded-xl ${this.writeShowPronunciationTip ? "bg-pinky-600 text-white" : "bg-pinky-50 hover:bg-pinky-100 text-pinky-700 border border-pinky-200"} text-xs font-bold flex items-center gap-1.5 transition-colors">
                                        <i data-lucide="ear" class="w-3.5 h-3.5"></i> Cách đọc
                                    </button>
                                    ${!isViToEn ? `
                                        <button type="button" onclick="app.speakEnglish('${this.escapeHtml(current.collocation).replace(/'/g, "\\'")}')"
                                                class="p-2 rounded-xl bg-pinky-50 hover:bg-pinky-100 text-pinky-600 transition-colors" title="Nghe phát âm">
                                            <i data-lucide="volume-2" class="w-4 h-4"></i>
                                        </button>
                                    ` : ""}
                                </div>
                            </div>

                            <h2 class="text-xl sm:text-2xl font-display font-bold text-slate-900 mb-1">
                                ${this.escapeHtml(isViToEn ? current.meaning : current.collocation)}
                            </h2>
                            ${!isViToEn && current.ipa ? `<p class="text-sm font-mono text-slate-400 mb-2">${this.escapeHtml(current.ipa)}</p>` : ""}
                            ${isViToEn && current.baseWord ? `<p class="text-xs text-slate-500 mb-2">Gợi ý từ gốc: <span class="font-bold text-pinky-600">${this.escapeHtml(current.baseWord)}</span></p>` : ""}
                            ${this.writeShowPronunciationTip ? this.buildPronunciationBreakdown(current) : ""}

                            <form onsubmit="event.preventDefault(); app.checkWritingAnswer();" class="space-y-4 mt-4">
                                <div>
                                    <input
                                        id="writing-answer-input"
                                        type="text"
                                        autocomplete="off"
                                        ${this.writeAnswered || this.isCheckingWritingAI ? "disabled" : ""}
                                        placeholder="${isViToEn ? "Gõ cụm Collocation tiếng Anh..." : "Gõ nghĩa tiếng Việt tương ứng..."}"
                                        class="w-full rounded-2xl border-2 border-pinky-200 focus:border-pinky-500 focus:ring-2 focus:ring-pinky-500/20 px-4 py-3.5 text-base font-semibold text-slate-900 outline-hidden disabled:bg-slate-50"
                                    />
                                </div>

                                ${!this.writeAnswered ? `
                                    <button type="submit" ${this.isCheckingWritingAI ? "disabled" : ""} class="w-full py-3.5 rounded-2xl bg-pinky-600 hover:bg-pinky-700 disabled:opacity-60 text-white font-bold text-sm shadow-sm flex items-center justify-center gap-2 transition-all">
                                        ${this.isCheckingWritingAI
                                            ? `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>AI đang chấm nghĩa tiếng Việt...</span>`
                                            : `<i data-lucide="check" class="w-4 h-4"></i><span>Kiểm tra đáp án</span>`
                                        }
                                    </button>
                                ` : ""}
                            </form>

                            ${this.writeAnswered && this.writeLastResult ? `
                                <div class="mt-5 p-4 rounded-2xl border ${this.writeLastResult.isCorrect ? "bg-emerald-50 border-emerald-200 text-emerald-900" : "bg-rose-50 border-rose-200 text-rose-900"}">
                                    <div class="flex items-center gap-2 font-bold text-sm mb-1">
                                        <i data-lucide="${this.writeLastResult.isCorrect ? "check-circle-2" : "alert-circle"}" class="w-4 h-4"></i>
                                        <span>${this.writeLastResult.isCorrect ? "Chính xác!" : "Chưa chính xác"}</span>
                                    </div>
                                    <p class="text-xs sm:text-sm">${this.escapeHtml(this.writeLastResult.feedback)}</p>
                                </div>
                                ${this.buildTransitionExampleBox(current, "app.nextWritingQuestion()", "Câu tiếp theo")}
                            ` : ""}
                        </div>
                    </div>
                `;
            }

            // =========================================================================
            // VIEW 5: AI SPEAKING TUTOR (LONG CONTINUOUS RECORDING + BAND 6.5 - 7.5+)
            // =========================================================================
            renderSpeakingControlsInner() {
                if (this.isRecording) {
                    return `
                        <div class="space-y-3">
                            <div class="flex flex-wrap items-center justify-between gap-3 bg-pinky-50 border-2 border-pinky-400 rounded-2xl px-4 py-3">
                                <div class="flex items-center gap-3">
                                    <span class="relative flex h-3.5 w-3.5">
                                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                                        <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-rose-600"></span>
                                    </span>
                                    <div>
                                        <div class="text-xs font-extrabold text-pinky-800 flex items-center gap-2">
                                            <span>Đang ghi âm liên tục (Chỉ dừng khi bạn ấn nút)</span>
                                            <span id="recording-timer-text" class="px-2 py-0.5 rounded-lg bg-white text-rose-600 font-mono text-xs border border-pinky-200">
                                                ${this.formatDuration(this.recordingSeconds)}
                                            </span>
                                        </div>
                                        <p class="text-[11px] text-slate-600">Bạn có thể ngắt nghỉ lấy hơi thoải mái mà không bị ngắt mic.</p>
                                    </div>
                                </div>

                                <div class="flex items-center gap-1 h-6 px-2">
                                    <span class="w-1 bg-pinky-500 rounded-full wave-bar" style="animation-delay: 0s"></span>
                                    <span class="w-1 bg-pinky-600 rounded-full wave-bar" style="animation-delay: 0.15s"></span>
                                    <span class="w-1 bg-pinky-500 rounded-full wave-bar" style="animation-delay: 0.3s"></span>
                                    <span class="w-1 bg-pinky-600 rounded-full wave-bar" style="animation-delay: 0.45s"></span>
                                    <span class="w-1 bg-pinky-500 rounded-full wave-bar" style="animation-delay: 0.2s"></span>
                                </div>

                                <button type="button" onclick="app.stopRecording()"
                                    class="px-4 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs sm:text-sm shadow-sm flex items-center gap-2 transition-all">
                                    <i data-lucide="square" class="w-4 h-4 fill-current"></i>
                                    <span>Dừng ghi âm</span>
                                </button>
                            </div>

                            <div class="bg-white border border-pinky-200 rounded-2xl p-3">
                                <div class="text-[11px] font-bold uppercase text-pinky-600 mb-1">Nội dung đang thu được (Live Transcript):</div>
                                <p id="live-transcript-preview" class="text-sm text-slate-700 italic min-h-[24px]">
                                    ${this.escapeHtml(this.finalTranscriptBuffer) || "Đang lắng nghe giọng nói của bạn..."}
                                </p>
                            </div>
                        </div>
                    `;
                }

                return `
                    <form onsubmit="event.preventDefault(); app.submitSpeakingReply();" class="flex items-center gap-2">
                        <button type="button" onclick="app.toggleRecording()" title="Bấm để bắt đầu nói dài (chỉ dừng khi ấn Dừng)"
                            class="px-3.5 py-3 rounded-2xl bg-pinky-100 hover:bg-pinky-200 text-pinky-700 border border-pinky-300 transition-all shrink-0 flex items-center gap-1.5 font-bold text-xs">
                            <i data-lucide="mic" class="w-4 h-4"></i>
                            <span class="hidden sm:inline">Nói (Micro)</span>
                        </button>

                        <input id="speaking-user-input" type="text" autocomplete="off"
                            value="${this.escapeHtml(this.finalTranscriptBuffer)}"
                            placeholder="Bấm 'Nói (Micro)' để thu âm dài hoặc gõ câu trả lời tiếng Anh..."
                            class="flex-1 rounded-2xl border border-pinky-200 bg-pinky-50/40 focus:bg-white focus:border-pinky-400 px-4 py-3 text-sm text-slate-800 outline-hidden">

                        <button type="submit" ${this.isSpeakingLoading ? "disabled" : ""}
                            class="px-4 sm:px-5 py-3 rounded-2xl bg-pinky-600 hover:bg-pinky-700 disabled:opacity-60 text-white font-bold text-sm shadow-sm flex items-center gap-1.5 transition-all shrink-0">
                            <span>Gửi & Chấm Band</span>
                            <i data-lucide="send" class="w-4 h-4"></i>
                        </button>
                    </form>
                `;
            }

            renderSpeakingView() {
                const deck = this.getActiveDeck();
                if (!deck || deck.items.length === 0) {
                    return this.renderEmptyDeckPrompt("Luyện nói với AI");
                }
                if (this.speakingMessages.length === 0 && !this.isSpeakingLoading) {
                    this.initSpeakingSession();
                }

                return `
                    <div class="max-w-3xl mx-auto space-y-4">
                        <!-- Target Collocations Mission Banner -->
                        <div class="bg-white rounded-3xl border-2 border-pinky-300 p-4 sm:p-5 shadow-sm">
                            <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">
                                <span class="text-xs font-extrabold uppercase tracking-wider text-pinky-700 flex items-center gap-1.5">
                                    <i data-lucide="target" class="w-4 h-4"></i> Thử thách từ chỉ định cần dùng trong câu trả lời:
                                </span>
                                <button type="button" onclick="app.initSpeakingSession()" class="text-xs font-bold text-pinky-600 hover:text-pinky-800 bg-pinky-50 hover:bg-pinky-100 px-3 py-1 rounded-xl border border-pinky-200 transition-all">
                                    Đổi câu hỏi & từ khác
                                </button>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                ${this.targetSpeakingCollocations.map(t => `
                                    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-2xl bg-pinky-50 border border-pinky-200">
                                        <span class="font-bold text-xs sm:text-sm text-pinky-800">${this.escapeHtml(t.collocation)}</span>
                                        <span class="text-xs text-slate-500">(${this.escapeHtml(t.meaning)})</span>
                                        <button type="button" onclick="app.speakEnglish('${this.escapeHtml(t.collocation).replace(/'/g, "\\'")}')" class="text-pinky-600 hover:text-pinky-800">
                                            <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </div>
                                `).join("")}
                            </div>
                        </div>

                        <!-- Chat & Correction Transcript Container -->
                        <div id="speaking-chat-scroll" class="bg-white rounded-3xl border border-pinky-200 p-4 sm:p-6 shadow-sm h-[470px] overflow-y-auto space-y-5">
                            ${this.speakingMessages.map(msg => {
                                if (msg.role === "ai") {
                                    return `
                                        <div class="flex items-start gap-3">
                                            <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-pinky-400 to-pinky-600 text-white flex items-center justify-center shrink-0 shadow-xs mt-1">
                                                <i data-lucide="bot" class="w-5 h-5"></i>
                                            </div>
                                            <div class="flex-1 space-y-3 min-w-0">
                                                ${msg.correctedSentence ? `
                                                    <!-- 1. Sentence Grammar & Naturalness Correction Card -->
                                                    <div class="bg-amber-50/90 border border-amber-200 rounded-2xl p-3.5 sm:p-4 text-xs sm:text-sm space-y-1.5">
                                                        <div class="flex items-center justify-between gap-2">
                                                            <span class="font-extrabold text-amber-800 flex items-center gap-1.5">
                                                                <i data-lucide="check-check" class="w-4 h-4 text-amber-600"></i>
                                                                Sửa lỗi câu của bạn:
                                                            </span>
                                                            <button type="button" onclick="app.speakEnglish('${this.escapeHtml(msg.correctedSentence).replace(/'/g, "\\'")}')"
                                                                class="px-2.5 py-1 rounded-xl bg-white hover:bg-amber-100 text-amber-800 border border-amber-200 text-xs font-bold flex items-center gap-1">
                                                                <i data-lucide="volume-2" class="w-3.5 h-3.5"></i> Nghe câu đúng
                                                            </button>
                                                        </div>
                                                        <p class="font-semibold text-slate-900 bg-white/80 rounded-xl p-2.5 border border-amber-200/70">
                                                            "${this.escapeHtml(msg.correctedSentence)}"
                                                        </p>
                                                        <p class="text-xs text-amber-900/90 leading-relaxed">
                                                            💡 ${this.escapeHtml(msg.correctionNotesVi)}
                                                        </p>
                                                    </div>
                                                ` : ""}

                                                ${msg.upgradedBandSentence ? `
                                                    <!-- 2. IELTS Band 6.5 - 7.5+ Upgrade Suggestion Card -->
                                                    <div class="bg-gradient-to-br from-pinky-50 via-white to-purple-50/70 border-2 border-pinky-300 rounded-2xl p-3.5 sm:p-4 text-xs sm:text-sm space-y-2 shadow-2xs">
                                                        <div class="flex flex-wrap items-center justify-between gap-2">
                                                            <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-pinky-600 text-white text-[11px] font-extrabold tracking-wide">
                                                                <i data-lucide="award" class="w-3.5 h-3.5"></i>
                                                                GỢI Ý NÂNG CẤP BAND 6.5 – 7.5+
                                                            </span>
                                                            <button type="button" onclick="app.speakEnglish('${this.escapeHtml(msg.upgradedBandSentence).replace(/'/g, "\\'")}')"
                                                                class="px-2.5 py-1 rounded-xl bg-pinky-100 hover:bg-pinky-200 text-pinky-800 text-xs font-bold flex items-center gap-1 transition-colors">
                                                                <i data-lucide="volume-2" class="w-3.5 h-3.5"></i> Nghe mẫu Band 7.0+
                                                            </button>
                                                        </div>
                                                        <p class="font-bold text-pinky-950 bg-white rounded-xl p-3 border border-pinky-200 leading-relaxed">
                                                            "${this.escapeHtml(msg.upgradedBandSentence)}"
                                                        </p>
                                                        <p class="text-xs text-slate-700 leading-relaxed">
                                                            ✨ <strong>Điểm ăn điểm Band cao:</strong> ${this.escapeHtml(msg.bandUpgradeNotesVi)}
                                                        </p>
                                                    </div>
                                                ` : ""}

                                                <!-- 3. Next AI Question -->
                                                <div class="bg-pinky-50/80 border border-pinky-200 rounded-2xl rounded-tl-xs p-3.5 sm:p-4">
                                                    <div class="flex items-start justify-between gap-2">
                                                        <p class="text-sm sm:text-base font-bold text-slate-900">${this.escapeHtml(msg.questionEn)}</p>
                                                        <button type="button" onclick="app.speakEnglish('${this.escapeHtml(msg.questionEn).replace(/'/g, "\\'")}')"
                                                            class="p-1.5 rounded-xl bg-white hover:bg-pinky-100 text-pinky-600 border border-pinky-200 shrink-0" title="Nghe lại câu hỏi">
                                                            <i data-lucide="volume-2" class="w-4 h-4"></i>
                                                        </button>
                                                    </div>
                                                    ${msg.hintVi ? `<p class="text-xs text-pinky-700 mt-2">💬 ${this.escapeHtml(msg.hintVi)}</p>` : ""}
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                } else {
                                    return `
                                        <div class="flex flex-col items-end">
                                            <div class="max-w-[85%] bg-pinky-600 text-white rounded-2xl rounded-tr-xs p-3.5 sm:p-4 shadow-xs">
                                                <p class="text-sm sm:text-base">${this.escapeHtml(msg.text)}</p>
                                            </div>
                                            <div class="mt-1.5 flex flex-wrap justify-end gap-1.5">
                                                ${msg.usedTargets.length > 0
                                                    ? msg.usedTargets.map(u => `<span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800">✓ Đã dùng: ${this.escapeHtml(u)}</span>`).join("")
                                                    : `<span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-500">Chưa dùng cụm từ chỉ định</span>`
                                                }
                                            </div>
                                        </div>
                                    `;
                                }
                            }).join("")}

                            ${this.isSpeakingLoading ? `
                                <div class="flex items-center gap-2 text-xs font-semibold text-pinky-600">
                                    <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
                                    <span>AI đang chấm lỗi, nâng cấp câu lên Band 6.5 - 7.5+ và chuẩn bị câu hỏi tiếp theo...</span>
                                </div>
                            ` : ""}
                        </div>

                        <!-- Voice / Text Input Controls -->
                        <div id="speaking-controls-wrapper" class="bg-white rounded-3xl border border-pinky-200 p-3.5 shadow-sm">
                            ${this.renderSpeakingControlsInner()}
                        </div>
                    </div>
                `;
            }
        }

        // Initialize application on window load
        window.onload = function() {
            window.app = new TlingEnglishApp();
        };
    </script>
</body>
</html>
