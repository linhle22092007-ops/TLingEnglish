<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TlingEnglish — Học Từ Vựng & Collocation Thông Minh Với AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        pinky: {
                            50: '#FDF2F8',
                            100: '#FCE7F3',
                            200: '#FBCFE8',
                            300: '#F9A8D4',
                            400: '#F472B6',
                            500: '#EC4899',
                            600: '#DB2777',
                            700: '#BE185D',
                            800: '#9D174D',
                            900: '#831843',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #FFF5F8 0%, #FFFFFF 48%, #FDF2F8 100%);
            min-height: 100vh;
            color: #1F2937;
            overflow-x: hidden;
        }
        /* 3D Flashcard Flip Mechanics */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FDF2F8;
        }
        ::-webkit-scrollbar-thumb {
            background: #F9A8D4;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #F472B6;
        }
        /* Pulse animation for recording mic */
        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.55); }
            70% { box-shadow: 0 0 0 16px rgba(225, 29, 72, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }
        .mic-pulse {
            animation: micPulse 1.5s infinite;
        }
    </style>
</head>
<body class="antialiased selection:bg-pinky-200 selection:text-pinky-900">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 bg-white/85 backdrop-blur-md border-b border-pinky-100 shadow-2xs">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
            <!-- Brand Logo (Click to go Home) -->
            <button type="button" onclick="app.goHome()" class="flex items-center gap-2.5 shrink-0 text-left group cursor-pointer focus:outline-hidden">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-pinky-400 to-pinky-600 flex items-center justify-center text-white shadow-sm shadow-pinky-200 group-hover:scale-105 transition-transform">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </div>
                <div>
                    <span class="font-display font-extrabold text-xl tracking-tight bg-gradient-to-r from-pinky-600 to-rose-500 bg-clip-text text-transparent">
                        TlingEnglish
                    </span>
                    <span class="hidden sm:block text-[11px] font-medium text-pinky-500 -mt-1">
                        Học Collocation Thông Minh Với AI
                    </span>
                </div>
            </button>

            <!-- Active Deck Selector & API Key Button -->
            <div class="flex items-center gap-2 sm:gap-2.5 flex-1 justify-end min-w-0">
                <div class="relative flex-1 max-w-[220px]">
                    <select id="active-deck-select" onchange="app.selectDeck(this.value, true)"
                        class="w-full appearance-none bg-pinky-50/90 hover:bg-pinky-100/80 border border-pinky-200 text-pinky-900 text-xs sm:text-sm font-semibold rounded-2xl pl-3.5 pr-8 py-2 focus:outline-hidden focus:ring-2 focus:ring-pinky-400 transition-all cursor-pointer truncate">
                    </select>
                    <i data-lucide="chevron-down" class="w-4 h-4 text-pinky-500 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                </div>
                <button type="button" onclick="app.openApiKeyModal()" title="Cài đặt Gemini API Key"
                    class="px-3 py-2 rounded-2xl bg-pinky-50 hover:bg-pinky-100 border border-pinky-200 text-pinky-700 text-xs font-bold flex items-center gap-1.5 shrink-0 cursor-pointer">
                    <i data-lucide="key-round" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">API Key</span>
                </button>
            </div>
        </div>

        <!-- Mode Navigation Bar -->
        <nav class="bg-white/95 border-t border-pinky-50 overflow-x-auto">
            <div id="nav-tabs" class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center gap-1.5 py-2 whitespace-nowrap">
                <!-- Populated dynamically by JS -->
            </div>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main id="app-main" class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8 pb-20">
        <!-- Active view rendered here -->
    </main>

    <!-- Floating Toast Notification -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <script>
        // =========================================================================
        // GEMINI API HELPER WITH AUTOMATIC MODEL FALLBACK & DIAGNOSTICS
        // =========================================================================
        const apiKey = "";
        const GEMINI_MODELS = ["gemini-3.5-flash-lite", "gemini-2.5-flash", "gemini-2.5-flash-lite"];

        function getEffectiveApiKey() {
            const saved = localStorage.getItem("tling_gemini_api_key");
            return (saved && saved.trim()) ? saved.trim() : apiKey;
        }

        async function callGeminiAPI({ contents, systemInstruction = "", responseSchema = null }) {
            const activeKey = getEffectiveApiKey();
            const payload = { contents };

            if (systemInstruction) {
                payload.systemInstruction = { parts: [{ text: systemInstruction }] };
            }
            if (responseSchema) {
                payload.generationConfig = {
                    responseMimeType: "application/json",
                    responseSchema: responseSchema
                };
            }

            let lastError = null;

            for (const modelName of GEMINI_MODELS) {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(activeKey)}`;
                for (let attempt = 0; attempt < 2; attempt++) {
                    try {
                        const response = await fetch(url, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(payload)
                        });

                        if (!response.ok) {
                            let detail = `HTTP ${response.status}`;
                            try {
                                const errJson = await response.json();
                                detail = errJson?.error?.message || detail;
                            } catch (_) {}
                            if ((response.status === 503 || response.status === 429) && attempt === 0) {
                                await new Promise(r => setTimeout(r, 900));
                                continue;
                            }
                            throw new Error(detail);
                        }

                        const data = await response.json();
                        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (!text) {
                            throw new Error("AI trả về nội dung trống.");
                        }
                        return text;
                    } catch (err) {
                        lastError = err;
                        break;
                    }
                }
            }
            throw lastError || new Error("Không thể kết nối tới Gemini API.");
        }

        // =========================================================================
        // SPACED REPETITION INTERVALS (1 -> 2 -> 5 -> 10 -> 20 DAYS)
        // =========================================================================
        const SRS_INTERVALS_DAYS = [1, 2, 5, 10, 20];
        const DAY_MS = 24 * 60 * 60 * 1000;

        class TlingEnglishApp {
            constructor() {
                this.STORAGE_KEY = "tling_english_v4_state";
                this.state = this.loadState();

                // Active Navigation Tab
                this.currentTab = "home"; // 'home' | 'deck-hub' | 'creator' | 'srs' | 'flashcards' | 'quiz' | 'writing' | 'speaking'

                // Creator & Staging State
                this.rawWordsInput = "";
                this.newDeckTitleInput = "";
                this.stagedCollocations = [];
                this.isGeneratingAI = false;

                // Flashcard State
                this.fcQueue = [];
                this.fcIndex = 0;
                this.fcFlipped = false;
                this.fcOnlyDue = false;
                this.fcShowPronunciationTip = false;
                this.fcLastDirectionHint = null;

                // Quiz State
                this.quizQueue = [];
                this.quizIndex = 0;
                this.quizScore = 0;
                this.quizAnswered = false;
                this.quizSelectedId = null;
                this.quizOptions = [];
                this.quizDirection = "en-to-vi"; // 'en-to-vi' | 'vi-to-en'
                this.quizOnlyDue = false;
                this.quizShowPronunciationTip = false;

                // Two-Way Writing State
                this.writeQueue = [];
                this.writeIndex = 0;
                this.writeScore = 0;
                this.writeAnswered = false;
                this.writeUserAnswer = "";
                this.writeFeedback = null;
                this.writeDirection = "vi-to-en"; // 'vi-to-en' | 'en-to-vi' | 'mixed'
                this.currentItemDirection = "vi-to-en";
                this.isCheckingWritingAI = false;
                this.writeOnlyDue = false;
                this.writeShowPronunciationTip = false;

                // AI Speaking Tutor State
                this.speakingMessages = [];
                this.targetSpeakingCollocations = [];
                this.isSpeakingLoading = false;
                this.isRecording = false;
                this.recognition = null;
                this.recordingSeconds = 0;
                this.recordingTimer = null;
                this.finalTranscriptBuffer = "";

                this.initSpeechRecognition();
                this.initKeyboardShortcuts();
                this.render();
            }

            // =========================================================================
            // STATE & SPACED REPETITION MANAGEMENT
            // =========================================================================
            normalizeSrsItem(item) {
                const now = Date.now();
                return {
                    ...item,
                    srsStep: typeof item.srsStep === "number" ? item.srsStep : 0,
                    nextReviewAt: typeof item.nextReviewAt === "number" ? item.nextReviewAt : now
                };
            }

            getDefaultDecks() {
                const now = Date.now();
                return [
                    {
                        id: "deck-ielts-core-1",
                        title: "IELTS Speaking & Writing Collocations",
                        createdAt: new Date().toISOString().slice(0, 10),
                        items: [
                            {
                                id: "col-1",
                                rootWord: "decision",
                                collocation: "make an informed decision",
                                ipa: "/meɪk ən ɪnˈfɔːrmd dɪˈsɪʒ.ən/",
                                meaningVi: "đưa ra quyết định sáng suốt (dựa trên đầy đủ thông tin)",
                                exampleEn: "Students should research carefully before making an informed decision about their major.",
                                exampleVi: "Sinh viên nên tìm hiểu kỹ trước khi đưa ra quyết định sáng suốt về chuyên ngành của mình.",
                                mastery: 0,
                                srsStep: 0,
                                nextReviewAt: now
                            },
                            {
                                id: "col-2",
                                rootWord: "balance",
                                collocation: "strike a healthy balance",
                                ipa: "/straɪk ə ˈhel.θi ˈbæl.əns/",
                                meaningVi: "đạt được sự cân bằng lành mạnh",
                                exampleEn: "It is crucial to strike a healthy balance between work and personal life.",
                                exampleVi: "Việc đạt được sự cân bằng lành mạnh giữa công việc và cuộc sống cá nhân là rất quan trọng.",
                                mastery: 0,
                                srsStep: 0,
                                nextReviewAt: now
                            },
                            {
                                id: "col-3",
                                rootWord: "awareness",
                                collocation: "raise public awareness of",
                                ipa: "/reɪz ˈpʌb.lɪk əˈwer.nəs əv/",
                                meaningVi: "nâng cao nhận thức cộng đồng về",
                                exampleEn: "Social media campaigns can effectively raise public awareness of environmental protection.",
                                exampleVi: "Các chiến dịch mạng xã hội có thể nâng cao nhận thức cộng đồng một cách hiệu quả về bảo vệ môi trường.",
                                mastery: 0,
                                srsStep: 0,
                                nextReviewAt: now
                            },
                            {
                                id: "col-4",
                                rootWord: "effort",
                                collocation: "make a concerted effort",
                                ipa: "/meɪk ə kənˈsɜːr.tɪd ˈef.ərt/",
                                meaningVi: "nỗ lực hết mình / chung sức đồng lòng",
                                exampleEn: "Governments and citizens must make a concerted effort to reduce plastic waste.",
                                exampleVi: "Chính phủ và người dân phải nỗ lực chung tay để giảm thiểu rác thải nhựa.",
                                mastery: 0,
                                srsStep: 0,
                                nextReviewAt: now
                            }
                        ]
                    }
                ];
            }

            loadState() {
                try {
                    const raw = localStorage.getItem(this.STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed && Array.isArray(parsed.decks)) {
                            parsed.decks = parsed.decks.map(deck => ({
                                ...deck,
                                items: (deck.items || []).map(item => this.normalizeSrsItem(item))
                            }));
                            return parsed;
                        }
                    }
                } catch (e) {
                    console.warn("Failed to load state:", e);
                }
                const defaults = this.getDefaultDecks();
                return {
                    decks: defaults,
                    activeDeckId: defaults[0]?.id || null
                };
            }

            saveState() {
                try {
                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.state));
                } catch (e) {
                    console.warn("Could not save state:", e);
                }
            }

            getDueItemsForDeck(deck) {
                if (!deck || !Array.isArray(deck.items)) return [];
                const now = Date.now();
                return deck.items.filter(item => (item.nextReviewAt || 0) <= now);
            }

            getTotalDueAcrossAllDecks() {
                return (this.state.decks || []).reduce((sum, d) => sum + this.getDueItemsForDeck(d).length, 0);
            }

            updateItemSrsSchedule(deckId, itemId, action) {
                const deck = (this.state.decks || []).find(d => d.id === deckId);
                if (!deck) return;
                const item = deck.items.find(i => i.id === itemId);
                if (!item) return;

                const now = Date.now();
                let currentStep = item.srsStep || 0;

                if (action === "reset") {
                    item.srsStep = 1;
                    item.nextReviewAt = now + SRS_INTERVALS_DAYS[0] * DAY_MS;
                } else if (action === "master") {
                    const nextStep = Math.min(currentStep + 2, SRS_INTERVALS_DAYS.length);
                    item.srsStep = nextStep;
                    item.nextReviewAt = now + SRS_INTERVALS_DAYS[nextStep - 1] * DAY_MS;
                } else {
                    const nextStep = Math.min(currentStep + 1, SRS_INTERVALS_DAYS.length);
                    item.srsStep = nextStep;
                    item.nextReviewAt = now + SRS_INTERVALS_DAYS[nextStep - 1] * DAY_MS;
                }
                this.saveState();
            }

            simulateAdvanceOneDay(deckId) {
                const deck = (this.state.decks || []).find(d => d.id === deckId);
                if (!deck) return;
                deck.items.forEach(item => {
                    item.nextReviewAt = (item.nextReviewAt || Date.now()) - DAY_MS;
                });
                this.saveState();
                this.showToast(`Đã tua nhanh +1 ngày cho bộ "${deck.title}"!`);
                this.render();
            }

            startDueReviewForDeck(deckId, targetMode) {
                this.state.activeDeckId = deckId;
                this.saveState();
                if (targetMode === "flashcards") {
                    this.initFlashcards(true);
                    this.switchTab("flashcards");
                } else if (targetMode === "quiz") {
                    this.initQuiz(true);
                    this.switchTab("quiz");
                } else if (targetMode === "writing") {
                    this.initWriting(true);
                    this.switchTab("writing");
                }
            }

            // =========================================================================
            // NAVIGATION, DECK MANAGEMENT, JSON EXPORT/IMPORT & API KEY MODAL
            // =========================================================================
            getActiveDeck() {
                if (!this.state.decks || this.state.decks.length === 0) return null;
                let found = this.state.decks.find(d => d.id === this.state.activeDeckId);
                if (!found) {
                    found = this.state.decks[0];
                    this.state.activeDeckId = found.id;
                }
                return found;
            }

            goHome() {
                this.stopRecording();
                this.currentTab = "home";
                this.render();
            }

            selectDeck(deckId, openHub = false) {
                this.stopRecording();
                this.state.activeDeckId = deckId;
                this.saveState();
                this.fcQueue = [];
                this.quizQueue = [];
                this.writeQueue = [];
                this.speakingMessages = [];
                if (openHub) {
                    this.currentTab = "deck-hub";
                }
                this.render();
            }

            openDeckHub(deckId) {
                this.stopRecording();
                this.state.activeDeckId = deckId;
                this.saveState();
                this.currentTab = "deck-hub";
                this.render();
            }

            switchTab(tabId) {
                this.stopRecording();
                this.currentTab = tabId;
                if (tabId === "flashcards" && this.fcQueue.length === 0) {
                    this.initFlashcards(false);
                } else if (tabId === "quiz" && this.quizQueue.length === 0) {
                    this.initQuiz(false);
                } else if (tabId === "writing" && this.writeQueue.length === 0) {
                    this.initWriting(false);
                } else if (tabId === "speaking" && this.speakingMessages.length === 0) {
                    this.initSpeakingSession();
                }
                this.render();
            }

            deleteDeck(deckId) {
                const deck = (this.state.decks || []).find(d => d.id === deckId);
                if (!deck) return;
                const container = document.getElementById("modal-container");
                if (!container) return;
                container.innerHTML = `
                    <div class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
                        <div class="bg-white rounded-3xl border border-pinky-200 max-w-md w-full p-6 shadow-xl space-y-4">
                            <h3 class="font-display font-extrabold text-lg text-slate-900">Xóa file từ vựng?</h3>
                            <p class="text-xs sm:text-sm text-slate-600">
                                Bạn có chắc muốn xóa bộ từ <strong>"${this.escapeHtml(deck.title)}"</strong> (${deck.items.length} cụm từ) không? Hành động này không thể hoàn tác.
                            </p>
                            <div class="flex justify-end gap-2 pt-2">
                                <button type="button" onclick="document.getElementById('modal-container').innerHTML = ''"
                                    class="px-4 py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold cursor-pointer">
                                    Hủy
                                </button>
                                <button type="button" onclick="app.confirmDeleteDeck('${deck.id}')"
                                    class="px-4 py-2.5 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-extrabold cursor-pointer">
                                    Xóa vĩnh viễn
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            confirmDeleteDeck(deckId) {
                this.state.decks = (this.state.decks || []).filter(d => d.id !== deckId);
                if (this.state.activeDeckId === deckId) {
                    this.state.activeDeckId = this.state.decks[0]?.id || null;
                }
                this.saveState();
                const container = document.getElementById("modal-container");
                if (container) container.innerHTML = "";
                this.currentTab = "home";
                this.showToast("Đã xóa file từ vựng!");
                this.render();
            }

            exportDeckToJson(deckId) {
                const deck = (this.state.decks || []).find(d => d.id === deckId) || this.getActiveDeck();
                if (!deck) return;
                const blob = new Blob([JSON.stringify(deck, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                const safeName = deck.title.toLowerCase().replace(/[^a-z0-9\u00C0-\u1EF9]+/gi, "-").replace(/^-|-$/g, "") || "tling-deck";
                a.href = url;
                a.download = `${safeName}.json`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
                this.showToast(`Đã tải xuống file "${safeName}.json"!`);
            }

            importDeckFromJson(event) {
                const file = event.target?.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        const now = Date.now();
                        const itemsRaw = Array.isArray(parsed) ? parsed : (parsed.items || []);
                        if (!Array.isArray(itemsRaw) || itemsRaw.length === 0) {
                            this.showToast("File JSON không chứa danh sách từ vựng hợp lệ!");
                            return;
                        }
                        const newDeck = {
                            id: "deck-" + now,
                            title: parsed.title || file.name.replace(/\.json$/i, ""),
                            createdAt: new Date().toISOString().slice(0, 10),
                            items: itemsRaw.map((item, idx) => this.normalizeSrsItem({
                                id: item.id || ("col-" + now + "-" + idx),
                                rootWord: item.rootWord || item.collocation || "",
                                collocation: item.collocation || item.word || "",
                                ipa: item.ipa || "",
                                meaningVi: item.meaningVi || item.meaning || "",
                                exampleEn: item.exampleEn || "",
                                exampleVi: item.exampleVi || "",
                                mastery: 0
                            }))
                        };
                        this.state.decks.unshift(newDeck);
                        this.state.activeDeckId = newDeck.id;
                        this.saveState();
                        this.showToast(`Đã nhập thành công "${newDeck.title}" (${newDeck.items.length} cụm từ)!`);
                        this.openDeckHub(newDeck.id);
                    } catch (err) {
                        this.showToast("Lỗi đọc file JSON: định dạng không hợp lệ.");
                    }
                };
                reader.readAsText(file);
                event.target.value = "";
            }

            openApiKeyModal() {
                const currentKey = localStorage.getItem("tling_gemini_api_key") || "";
                const container = document.getElementById("modal-container");
                if (!container) return;
                container.innerHTML = `
                    <div class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
                        <div class="bg-white rounded-3xl border border-pinky-200 max-w-md w-full p-6 shadow-xl space-y-4">
                            <div class="flex items-center justify-between">
                                <h3 class="font-display font-extrabold text-lg text-slate-900 flex items-center gap-2">
                                    <i data-lucide="key-round" class="w-5 h-5 text-pinky-600"></i>
                                    Cài đặt Gemini API Key
                                </h3>
                                <button type="button" onclick="document.getElementById('modal-container').innerHTML = ''" class="text-slate-400 hover:text-slate-700">
                                    <i data-lucide="x" class="w-5 h-5"></i>
                                </button>

            // =========================================================================
            speakEnglish(text, rate = 0.95, onEndCallback = null) {
                if (!text) {
                    if (onEndCallback) onEndCallback();
                    return;
                }
                if (!("speechSynthesis" in window)) {
                    if (onEndCallback) onEndCallback();
                    return;
                }

                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = "en-US";
                utter.rate = rate;

                const voices = window.speechSynthesis.getVoices();
                const preferred = voices.find(v => v.lang === "en-US" && (v.name.includes("Google") || v.name.includes("Natural") || v.name.includes("Samantha")))
                    || voices.find(v => v.lang.startsWith("en-"));
                if (preferred) utter.voice = preferred;

                let finished = false;
                const finishOnce = () => {
                    if (finished) return;
                    finished = true;
                    if (onEndCallback) onEndCallback();
                };

                utter.onend = finishOnce;
                utter.onerror = finishOnce;
                window.speechSynthesis.speak(utter);

                if (onEndCallback) {
                    const fallbackMs = Math.min(Math.max(text.length * 75, 900), 3500);
                    setTimeout(finishOnce, fallbackMs);
                }
            }

                let currentItem = null;
                if (mode === "fc") {

                } else if (mode === "write") {
                    this.writeShowPronunciationTip = !this.writeShowPronunciationTip;

            initKeyboardShortcuts() {
                document.addEventListener("keydown", (e) => {
                    const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : "";
                    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

                    if (this.currentTab === "flashcards" && this.fcQueue.length > 0 && this.fcIndex < this.fcQueue.length) {
                        const current = this.fcQueue[this.fcIndex];
                        if (e.code === "Space") {
                            e.preventDefault();
                            this.flipFlashcard();
                        } else if (e.key === "a" || e.key === "A") {
                            e.preventDefault();
                            if (current) this.speakEnglish(current.collocation);
                        } else if (e.key === "p" || e.key === "P") {
                            e.preventDefault();
                            this.togglePronunciationGuide("fc");
                        } else if (e.key === "ArrowLeft" || e.key === "<" || e.key === ",") {
                            e.preventDefault();
                            this.fcLastDirectionHint = "left";
                            this.rateFlashcard("hard");
                        } else if (e.key === "ArrowRight" || e.key === ">" || e.key === ".") {
                            e.preventDefault();
                            this.fcLastDirectionHint = "right";
                            this.rateFlashcard("easy");
                        }
                    }
                });
            }

${rawLines.map((line, i) => `${i + 1}. ${line}`).join("\n")}`;

                const schema = {
                    type: "ARRAY",
                    items: {
                        type: "OBJECT",
                        properties: {
                            rootWord: { type: "STRING" },
                            collocation: { type: "STRING" },
                            ipa: { type: "STRING" },
                            meaningVi: { type: "STRING" },
                            exampleEn: { type: "STRING" },
                            exampleVi: { type: "STRING" }
                        },
                        required: ["rootWord", "collocation", "ipa", "meaningVi", "exampleEn", "exampleVi"]
                    }
                };

                const jsonText = await callGeminiAPI({
                    contents: [{ role: "user", parts: [{ text: prompt }] }],
                    systemInstruction: "Bạn là chuyên gia ngôn ngữ Anh - Việt. Luôn mở rộng từ đơn thành Collocation tự nhiên và BẮT BUỘC dịch đầy đủ nghĩa tiếng Việt chuẩn xác cho từng cụm từ cùng câu ví dụ song ngữ Anh - Việt.",
                    responseSchema: schema
                });

                const parsed = JSON.parse(jsonText);
                return parsed.map((item, idx) => ({
                    id: "col-" + Date.now() + "-" + idx,
                    rootWord: (item.rootWord || rawLines[idx] || "").trim(),
                    collocation: (item.collocation || rawLines[idx] || "").trim(),
                    ipa: (item.ipa || "").trim(),
                    meaningVi: (item.meaningVi || "").trim(),
                    exampleEn: (item.exampleEn || "").trim(),
                    exampleVi: (item.exampleVi || "").trim()
                }));
            }

            async generateCollocationsWithAI() {
                const titleInput = document.getElementById("creator-deck-title");
                const wordsInput = document.getElementById("creator-raw-words");
                this.newDeckTitleInput = titleInput ? titleInput.value : this.newDeckTitleInput;
                this.rawWordsInput = wordsInput ? wordsInput.value : this.rawWordsInput;

                const rawLines = this.rawWordsInput
                    .split(/[\n,;]+/)
                    .map(s => s.trim())
                    .filter(Boolean);

                if (rawLines.length === 0) {
                    this.showToast("Vui lòng nhập ít nhất 1 từ vựng hoặc cụm từ tiếng Anh!");
                    return;
                }

                this.isGeneratingAI = true;
                this.render();

                try {
                    this.stagedCollocations = await this.translateRawItemsWithAI(rawLines);
                    this.showToast(`AI đã ghép Collocation & dịch nghĩa tiếng Việt xong cho ${this.stagedCollocations.length} từ!`);
                } catch (err) {
                    console.error(err);
                    const hasKey = Boolean(getEffectiveApiKey());
                    this.showToast(hasKey
                        ? `Lỗi AI: ${err.message}. Hãy kiểm tra lại nút API Key góc trên!`
                        : "Bạn chưa nhập Gemini API Key! Hãy bấm nút 'API Key' ở góc trên bên phải để dán mã AIzaSy...");
                    this.stagedCollocations = rawLines.map((line, idx) => {
                        const parts = line.split(/[:\-–]/);
                        return {
                            id: "col-" + Date.now() + "-" + idx,
                            rootWord: parts[0].trim(),
                            collocation: parts[0].trim(),
                            ipa: "",
                            meaningVi: parts[1] ? parts[1].trim() : "",
                            exampleEn: "",
                            exampleVi: ""
                        };
                    });
                } finally {
                    this.isGeneratingAI = false;
                    this.render();
                }
            }

            async saveCreatorDeck(downloadJson = false) {
                const titleInput = document.getElementById("creator-deck-title");
                const wordsInput = document.getElementById("creator-raw-words");
                if (titleInput) this.newDeckTitleInput = titleInput.value;
                if (wordsInput) this.rawWordsInput = wordsInput.value;

                if (this.stagedCollocations.length === 0) {
                    const rawLines = this.rawWordsInput
                        .split(/[\n,;]+/)
                        .map(s => s.trim())
                        .filter(Boolean);

                    if (rawLines.length === 0) {
                        this.showToast("Vui lòng nhập từ vựng trước khi tạo bộ từ!");
                        return;
                    }

                    const linesWithoutVi = rawLines.filter(line => !/[:\-–]/.test(line));
                    if (linesWithoutVi.length > 0) {
                        this.isGeneratingAI = true;
                        this.render();
                        try {
                            this.stagedCollocations = await this.translateRawItemsWithAI(rawLines);
                            this.showToast("AI đã tự động dịch nghĩa tiếng Việt & lưu bộ từ!");
                        } catch (err) {
                            console.warn("Auto-translate fallback:", err);
                            this.stagedCollocations = rawLines.map((line, idx) => {
                                const parts = line.split(/[:\-–]/);
                                return {
                                    id: "col-" + Date.now() + "-" + idx,
                                    rootWord: parts[0].trim(),
                                    collocation: parts[0].trim(),
                                    ipa: "",
                                    meaningVi: parts[1] ? parts[1].trim() : "",
                                    exampleEn: "",
                                    exampleVi: ""
                                };
                            });
                        } finally {
                            this.isGeneratingAI = false;
                        }
                    } else {
                        this.stagedCollocations = rawLines.map((line, idx) => {
                            const parts = line.split(/[:\-–]/);
                            return {
                                id: "col-" + Date.now() + "-" + idx,
                                rootWord: parts[0].trim(),
                                collocation: parts[0].trim(),
                                ipa: "",
                                meaningVi: parts[1] ? parts[1].trim() : "",
                                exampleEn: "",
                                exampleVi: ""
                            };
                        });
                    }
                }

                const title = (this.newDeckTitleInput || "").trim() || `Bộ từ ngày ${new Date().toLocaleDateString("vi-VN")}`;
                const now = Date.now();
                const items = this.stagedCollocations.map((item, idx) => ({
                    id: item.id || ("col-" + now + "-" + idx),
                    rootWord: (item.rootWord || item.collocation || "").trim(),
                    collocation: (item.collocation || "").trim(),
                    ipa: (item.ipa || "").trim(),
                    meaningVi: (item.meaningVi || "").trim() || "(Chưa nhập nghĩa tiếng Việt)",
                    exampleEn: (item.exampleEn || "").trim(),
                    exampleVi: (item.exampleVi || "").trim(),
                    mastery: 0,
                    srsStep: 0,
                    nextReviewAt: now
                })).filter(i => i.collocation);

                if (items.length === 0) {
                    this.showToast("Không có cụm từ hợp lệ để lưu!");
                    return;
                }

                const newDeck = {
                    id: "deck-" + now,
                    title,
                    createdAt: new Date().toISOString().slice(0, 10),
                    items
                };

                this.state.decks.unshift(newDeck);
                this.state.activeDeckId = newDeck.id;
                this.saveState();

                this.rawWordsInput = "";
                this.newDeckTitleInput = "";
                this.stagedCollocations = [];

                this.showToast(`Đã tạo & lưu "${newDeck.title}" (${items.length} cụm từ)!`);

                if (downloadJson) {
                    this.exportDeckToJson(newDeck.id);
                }

                this.openDeckHub(newDeck.id);
            }

            async retranslateSingleStagedItem(idx) {
                const item = this.stagedCollocations[idx];
                if (!item || !item.collocation) return;
                this.showToast(`Đang dịch lại "${item.collocation}" bằng AI...`);
                try {
                    const res = await this.translateRawItemsWithAI([item.collocation]);
                    if (res && res[0]) {
                        this.stagedCollocations[idx] = {
                            ...item,
                            collocation: res[0].collocation || item.collocation,
                            ipa: res[0].ipa || item.ipa,
                            meaningVi: res[0].meaningVi || item.meaningVi,
                            exampleEn: res[0].exampleEn || item.exampleEn,
                            exampleVi: res[0].exampleVi || item.exampleVi
                        };
                        this.showToast("Đã cập nhật nghĩa tiếng Việt & ví dụ!");
                        this.render();
                    }
                } catch (err) {
                    this.showToast(`Không kết nối được AI: ${err.message}`);
                }
            }

            updateStagedField(idx, field, value) {
                if (this.stagedCollocations[idx]) {
                    this.stagedCollocations[idx][field] = value;
                }
            }

            removeStagedItem(idx) {
                this.stagedCollocations.splice(idx, 1);
                this.render();
            }

                        </div>
                    </div>
                `;

            // =========================================================================
            // 3. FLASHCARDS VIEW (3D FLIP, < / > SHORTCUTS, PRONUNCIATION & REPLAY)
            // =========================================================================
            initFlashcards(onlyDue = false) {
                const deck = this.getActiveDeck();
                if (!deck) return;
                this.fcOnlyDue = onlyDue;
                const pool = onlyDue ? this.getDueItemsForDeck(deck) : deck.items;
                this.fcQueue = pool.map(item => ({ ...item }));
                this.fcIndex = 0;
                this.fcFlipped = false;
                this.fcShowPronunciationTip = false;
                this.fcLastDirectionHint = null;
                if (this.fcQueue.length > 0) {
                    setTimeout(() => this.speakEnglish(this.fcQueue[0].collocation), 200);
                }
            }

            flipFlashcard() {
                this.fcFlipped = !this.fcFlipped;
                this.render();
            }

            rateFlashcard(quality) {
                const deck = this.getActiveDeck();
                const current = this.fcQueue[this.fcIndex];
                if (!deck || !current) return;

                if (quality === "hard") {
                    this.updateItemSrsSchedule(deck.id, current.id, "reset");
                    this.fcQueue.push({ ...current });
                } else if (quality === "good") {
                    this.updateItemSrsSchedule(deck.id, current.id, "advance");
                } else {
                    this.updateItemSrsSchedule(deck.id, current.id, "master");
                }

                this.speakEnglish(current.collocation, 0.95, () => {
                    this.fcIndex++;
                    this.fcFlipped = false;
                    this.fcShowPronunciationTip = false;
                    this.fcLastDirectionHint = null;
                    this.render();
                    if (this.fcIndex < this.fcQueue.length) {
                        setTimeout(() => this.speakEnglish(this.fcQueue[this.fcIndex].collocation), 250);
                    }
                });
            }

                                <div class="font-display font-extrabold text-xs sm:text-sm">Thuộc rồi &gt;</div>
                                <div class="text-[11px] text-emerald-600">Phím &gt; • Giãn lịch ôn</div>
